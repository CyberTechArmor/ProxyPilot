name: Credential broker configured boundary
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: credential-broker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-filesystem:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install locked backend and CLI dependencies
        run: |
          npm ci --prefix admin/backend --no-audit --no-fund
          npm ci --prefix cli --no-audit --no-fund
      - name: Full authentication and security selection with canonical root custody
        working-directory: admin/backend
        run: |
          test "$(id -u)" = 0
          node --test src/__tests__/security-*.test.js src/__tests__/mcp-*.test.js src/__tests__/ldap.test.js src/__tests__/notification-logic.test.js src/__tests__/root-recovery.test.js src/__tests__/sso-transport.test.js src/__tests__/webauthn.test.js
  broker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dashboard dependencies for saved-agent integration
        run: npm ci --prefix admin/backend --no-audit --no-fund
      - name: Authority, durable state and hostile transport cases
        run: npm test --prefix services/credential-broker
      - name: Real disposable OpenBao and synthetic upstream proof
        run: npm run test:integration --prefix services/credential-broker
      - name: Metadata-only migration refusals
        run: node --test scripts/tests/broker-migration-dry-run.test.mjs
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
        working-directory: admin/backend
      - run: npm ci --no-audit --no-fund
        working-directory: admin/frontend
      - name: Broker dashboard and existing Operations boundaries
        working-directory: admin/backend
        run: node --test src/__tests__/broker-*.test.js src/__tests__/operational-*.test.js src/__tests__/agent-run*.test.js src/__tests__/operations-toggles.test.js
      - run: npm run build
        working-directory: admin/frontend
      - name: Install disposable browser
        run: node admin/backend/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Connection and agent setup browser journeys
        working-directory: admin/frontend
        run: |
          export BROWSER_EXE="$(node --input-type=module -e "import { chromium } from '../backend/node_modules/playwright-core/index.mjs'; console.log(chromium.executablePath())")"
          node --test test/theme.test.mjs
          node --test tests/connection-ui-logic.test.mjs tests/run-readiness.test.mjs
          node tests/operations-guide.browser.mjs
          node tests/ui-alignment.browser.mjs
          node tests/broker-connections.browser.mjs
          node tests/broker-integrated.browser.mjs
          node tests/broker-tasks.browser.mjs
          node tests/broker-saved-agent.integrated.browser.mjs
