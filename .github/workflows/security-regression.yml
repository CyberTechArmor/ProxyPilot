name: Security regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: admin/backend
      - run: npm ci --no-audit --no-fund
        working-directory: cli
      - name: Install bounded PDF fixture tools on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils util-linux
          test -x /usr/bin/pdftotext
          test -x /usr/bin/prlimit
          /usr/bin/pdftotext -v
          /usr/bin/prlimit --version
      - name: Authentication, authorization, upgrade and dependency regressions
        working-directory: admin/backend
        run: |
          tests=()
          for test_file in src/__tests__/security-*.test.js; do
            case "$test_file" in *security-bootstrap*) ;; *) tests+=("$test_file");; esac
          done
          node --test "${tests[@]}" src/__tests__/sso-transport.test.js src/__tests__/webauthn.test.js src/__tests__/mcp-*.test.js src/__tests__/ldap.test.js src/__tests__/notification-logic.test.js src/__tests__/root-recovery.test.js
      - name: Pomerium route protection and Platform MCP integration
        working-directory: admin/backend
        run: node --test src/__tests__/pomerium-setup.test.js src/__tests__/full-platform-mcp.test.js
      - name: Operations and supervised agent authorization, fencing and recovery
        working-directory: admin/backend
        run: node --test src/__tests__/operational-*.test.js src/__tests__/agent-run*.test.js src/__tests__/operations-toggles.test.js
      - name: Root-only bootstrap integration (disposable runner and temporary databases)
        working-directory: admin/backend
        run: sudo "$(command -v node)" --test src/__tests__/security-bootstrap*.test.js
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Terminal update handoff (disposable command boundaries, root entry)
        run: sudo python3 -m unittest discover -s scripts/tests -p 'test_update_terminal.py'
      - run: python3 scripts/host-boundary-inventory.py
      - name: Reviewed Infisical and evidence decoder host contracts
        working-directory: admin/backend
        run: node --test src/__tests__/agent-network.test.js src/__tests__/agent-network-boundary.test.js src/__tests__/operational-evidence-decoder.test.js
      - name: Agent client and selected-agent outage behavior
        working-directory: admin/backend
        run: node --test src/__tests__/agent.test.js src/__tests__/caddy-driver.test.js
      - name: Update recovery and runner policy regressions
        working-directory: admin/backend
        run: node --test src/__tests__/update-runner-maintenance.test.js src/__tests__/update-runner-policy.test.js src/__tests__/self-update-logic.test.js src/__tests__/self-update-runner.test.js
      - run: bash -n install.sh update.sh scripts/install-incus-stable.sh scripts/incus-stable-candidate.sh scripts/upgrade-incus-stable.sh
      - run: bash scripts/tests/incus-upgrade-preflight.sh
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [admin/backend, admin/frontend, cli, admin/backend/src/mock2/framework-seed/base-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dependency audit
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          if [ "${{ matrix.directory }}" != "admin/frontend" ]; then
            npm audit --audit-level=low
            exit
          fi
          set +e
          npm audit --audit-level=low --json > audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -eq 0 ]; then
            exit
          fi
          node ../../.github/scripts/frontend-audit-policy.mjs audit.json
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: admin/frontend
      - name: MCP access browser regression
        run: |
          npm ci --prefix admin/backend --ignore-scripts --no-audit --no-fund
          node admin/backend/node_modules/playwright-core/cli.js install --with-deps chromium
          node admin/frontend/tests/mcp-access.browser.mjs
      - name: Supervised agent A6, A7 and A8 dashboard journeys
        working-directory: admin/frontend
        run: |
          export BROWSER_EXE="$(node --input-type=module -e "import { chromium } from '../backend/node_modules/playwright-core/index.mjs'; console.log(chromium.executablePath())")"
          node --test tests/agent-runs-cleanup.test.mjs
          node tests/agent-runs.browser.mjs
          node tests/agent-runs-a7.browser.mjs
          node tests/browser-configurations.browser.mjs
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: go vet ./... && go test -race ./...
        working-directory: cmd/agent
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: cmd/agent
