name: Security regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: admin/backend
      - run: npm ci --no-audit --no-fund
        working-directory: cli
      - name: Authentication, authorization, upgrade and dependency regressions
        working-directory: admin/backend
        run: node --test src/__tests__/security-*.test.js src/__tests__/sso-transport.test.js src/__tests__/webauthn.test.js src/__tests__/mcp-*.test.js src/__tests__/ldap.test.js src/__tests__/notification-logic.test.js src/__tests__/root-recovery.test.js
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: bash -n install.sh update.sh
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [admin/backend, admin/frontend, cli, admin/backend/src/mock2/framework-seed/base-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --audit-level=low
        working-directory: ${{ matrix.directory }}
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: admin/frontend
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: go vet ./... && go test ./...
        working-directory: cmd/agent
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: cmd/agent
