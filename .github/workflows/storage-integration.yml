# ZFS storage management — unit tests, the host agent's Go tests, and the
# loop-device integration test (4 × 512 MB files → losetup → real zpool/zfs/
# sanoid/syncoid through lib/storage/service.js). No real device is touched.
name: Storage (ZFS) tests

on:
  push:
    paths:
      - 'admin/backend/src/lib/storage/**'
      - 'admin/backend/src/lib/storage-monitor.js'
      - 'admin/backend/src/routes/storage.js'
      - 'admin/backend/src/routes/mcp-tools/storage.js'
      - 'admin/backend/src/lib/mcp-ext/catalog/storage.js'
      - 'admin/backend/src/__tests__/storage-*.test.js'
      - 'admin/backend/src/__tests__/fixtures/storage/**'
      - 'cmd/agent/**'
      - 'scripts/storage-*.sh'
      - 'deploy/proxypilot-zfs-scrub@.*'
      - 'deploy/proxypilot-syncoid@.*'
      - '.github/workflows/storage-integration.yml'
  pull_request:
    paths:
      - 'admin/backend/src/lib/storage/**'
      - 'admin/backend/src/routes/storage.js'
      - 'admin/backend/src/routes/mcp-tools/storage.js'
      - 'admin/backend/src/__tests__/storage-*.test.js'
      - 'cmd/agent/**'
      - 'scripts/storage-*.sh'
  workflow_dispatch:

jobs:
  unit:
    name: Backend unit tests (storage + MCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: admin/backend
      - run: node --test src/__tests__/storage-parse.test.js src/__tests__/storage-planner.test.js src/__tests__/storage-policy.test.js src/__tests__/storage-service.test.js src/__tests__/storage-replicate.test.js src/__tests__/mcp-extended.test.js
        working-directory: admin/backend

  agent:
    name: Host agent (Go) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./... && go test ./...
        working-directory: cmd/agent

  loop-devices:
    name: Loop-device integration (zpool / zfs / sanoid / syncoid)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ZFS, sanoid (syncoid), smartmontools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y zfsutils-linux sanoid smartmontools pv mbuffer lzop
          sudo modprobe zfs
          zfs version
          syncoid --version || true
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: admin/backend
      - name: Run the cycle on loop devices
        run: sudo -E env "PATH=$PATH" PROXYPILOT_STORAGE_INTEGRATION=1 PROXYPILOT_DISABLE_CRONS=1 node --test src/__tests__/storage-loop.integration.test.js
        working-directory: admin/backend
      - name: Shell syntax of the host helpers
        run: bash -n scripts/storage-replicate.sh && bash -n scripts/storage-restore-guest.sh && bash -n scripts/install-storage.sh
