<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Default mark: the sidebar's rocket in the primary green on the navy
         ground (public/logo.svg — the same glyph lucide draws in the sidebar).
         The same file is rasterised into the icon-*.png set the installed app
         uses, so the tab and the home-screen icon always match. Admins can
         override it from Profile → Platform branding; lib/branding.js swaps
         these hrefs at runtime (and the server brands the manifest) when they do. -->
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero on a
         notched iPhone; without it the bottom bar sits under the home indicator.
         Combined with the .h-viewport (100dvh) utility, the studio fits the
         VISIBLE area rather than the large viewport. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1524" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons entirely and uses this. It must be a
         PNG; an SVG here silently yields a blank home-screen tile. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fractionate" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Fractionate</title>
    <script>
      // Pre-paint colors; keep normalization in sync with src/lib/theme.js.
      // Legacy dark/light preferences map to Midnight/Office. Default unchanged.
      (function () {
        var t = 'midnight';
        try {
          var stored = localStorage.getItem('pp-theme');
          if (stored === 'light') t = 'office';
          else if (stored === 'latte' || stored === 'office') t = stored;
        } catch (e) { /* blocked storage retains Midnight */ }
        document.documentElement.classList.toggle('dark', t === 'midnight');
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t === 'midnight' ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
