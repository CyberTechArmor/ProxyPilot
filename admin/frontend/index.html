<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Default mark: a rocket badge on the brand gradient (replaces the bare
         emoji glyph). Admins can override it entirely from Profile → Platform
         branding; lib/branding.js swaps this href at runtime when they do. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><defs><linearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%2264%22 y2=%2264%22><stop stop-color=%22%232563eb%22/><stop offset=%221%22 stop-color=%22%237c3aed%22/></linearGradient></defs><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22url(%23g)%22/><path d=%22M32 8C40 14 44 22 44 31C44 34 43.5 37 42.5 40L36 36L32 42L28 36L21.5 40C20.5 37 20 34 20 31C20 22 24 14 32 8Z%22 fill=%22%23fff%22/><circle cx=%2232%22 cy=%2226%22 r=%224.5%22 fill=%22url(%23g)%22/><path d=%22M32 44L35.5 51L32 58L28.5 51Z%22 fill=%22%23fbbf24%22/></svg>" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero on a
         notched iPhone; without it the bottom bar sits under the home indicator.
         Combined with the .h-viewport (100dvh) utility, the studio fits the
         VISIBLE area rather than the large viewport. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1524" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons entirely and uses this. It must be a
         PNG; an SVG here silently yields a blank home-screen tile. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ProxyPilot" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>ProxyPilot Admin</title>
    <script>
      // Pre-paint theme: apply the stored theme class before React mounts so
      // there's no flash of the wrong palette. Defaults to dark (ProxyPilot's
      // historical look). Kept in sync afterward by ThemeContext.
      (function () {
        try {
          var t = localStorage.getItem('pp-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
