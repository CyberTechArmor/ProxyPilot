<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier — the client-work operating system</title>
<style>
/* ============ Atelier — Folio Light ============ */
:root{
  --wash:#f2f3f6;          /* cool gallery wash */
  --chrome:#ffffff;        /* white chrome */
  --ink:#191b20;
  --ink2:#4b5160;
  --mute:#8a90a0;
  --faint:#b6bac6;
  --hair:#e6e8ee;          /* hairline */
  --hair2:#d8dbe4;
  --cobalt:#2140d9;        /* THE accent */
  --cobalt-ink:#1a34b0;
  --cobalt-wash:#eef1fd;
  --paper:#fdfbf6;         /* warm proposal paper */
  --paper-ink:#22201b;
  --ok:#177a4c;   --ok-wash:#e7f4ec;
  --warn:#9a6a12; --warn-wash:#faf1dd;
  --bad:#b3383e;  --bad-wash:#fbeaea;
  --violet:#6d5bd0; --violet-wash:#efedfa;
  --teal:#177a86; --teal-wash:#e5f3f4;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --sh-pop:0 8px 28px rgba(25,27,32,.13),0 2px 6px rgba(25,27,32,.08);
  --sh-soft:0 1px 3px rgba(25,27,32,.07);
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.5 var(--sans);color:var(--ink);background:var(--wash);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
a{color:var(--cobalt);text-decoration:none}
::selection{background:rgba(33,64,217,.16)}
.serif{font-family:var(--serif)}
.mute{color:var(--mute)} .ink2{color:var(--ink2)}
.small{font-size:12px} .tiny{font-size:11px}
.mono{font-variant-numeric:tabular-nums}

/* ---------- app frame ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.side{width:236px;flex:0 0 236px;background:var(--chrome);border-right:1px solid var(--hair);display:flex;flex-direction:column;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:52px;flex:0 0 52px;background:var(--chrome);border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:14px;padding:0 20px}
.content{flex:1;overflow:auto;position:relative}
.content-pad{padding:26px 34px 60px;max-width:1280px;margin:0 auto}
.content-wide{padding:0;height:100%;display:flex;flex-direction:column}
.content-wide>*{min-width:0}
.content-wide>.content-pad{width:100%}

/* wordmark */
.wordmark{font-family:var(--serif);font-size:19px;letter-spacing:.02em;padding:18px 20px 14px;display:flex;align-items:baseline;gap:8px}
.wordmark b{font-weight:400}
.wordmark .dot{width:7px;height:7px;border-radius:50%;background:var(--cobalt);display:inline-block;transform:translateY(-1px)}

/* sidebar nav */
.navsec{padding:10px 12px 4px}
.navsec .lab{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:8px 10px 5px}
.navitem{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:6px;color:var(--ink2);width:100%;text-align:left;font-size:13.5px}
.navitem svg{flex:0 0 16px;opacity:.72}
.navitem:hover{background:var(--wash)}
.navitem.on{color:var(--cobalt);background:var(--cobalt-wash)}
.navitem.on svg{opacity:1}
.navitem .cnt{margin-left:auto;font-size:11px;color:var(--faint)}
.navproj{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;width:100%;text-align:left;font-size:13px;color:var(--ink2)}
.navproj:hover{background:var(--wash)}
.navproj.on{color:var(--ink);background:var(--wash)}
.navproj .swatch{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
.navproj .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidefoot{margin-top:auto;border-top:1px solid var(--hair);padding:10px 12px}

/* topbar pieces */
.crumb{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--mute);min-width:0}
.crumb b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--hair2)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}

/* presence */
.presence{display:flex;align-items:center}
.presence .avatar{margin-left:-6px;border:2px solid var(--chrome);position:relative}
.presence .avatar:first-child{margin-left:0}
.presence .avatar::after{content:"";position:absolute;right:-1px;bottom:-1px;width:7px;height:7px;border-radius:50%;background:var(--ok);border:1.5px solid var(--chrome)}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:#fff;flex:0 0 auto}
.avatar.lg{width:34px;height:34px;font-size:13px}
.avatar.sm{width:20px;height:20px;font-size:9px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:7px;font-size:13px;font-weight:500;border:1px solid var(--hair2);background:var(--chrome);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn.primary:hover{background:var(--cobalt-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:rgba(25,27,32,.05);color:var(--ink)}
.btn.small{padding:3px 9px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--mute)}
.iconbtn:hover{background:rgba(25,27,32,.06);color:var(--ink)}
.iconbtn.on{color:var(--cobalt);background:var(--cobalt-wash)}

/* chips — soft pills */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap}
.chip .d{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75}
.chip.neutral{background:#eceef3;color:var(--ink2)}
.chip.cobalt{background:var(--cobalt-wash);color:var(--cobalt)}
.chip.ok{background:var(--ok-wash);color:var(--ok)}
.chip.warn{background:var(--warn-wash);color:var(--warn)}
.chip.bad{background:var(--bad-wash);color:var(--bad)}
.chip.violet{background:var(--violet-wash);color:var(--violet)}
.chip.teal{background:var(--teal-wash);color:var(--teal)}
.chip.client{background:#fdf3e4;color:#9a6a12;border:1px dashed #e5cf9e}
.chip.tag{background:transparent;border:1px solid var(--hair2);color:var(--ink2)}

/* hairline structure */
.hr{border:0;border-top:1px solid var(--hair);margin:18px 0}
.sect{padding:22px 0;border-bottom:1px solid var(--hair)}
.sect:last-child{border-bottom:0}
.pagehead{display:flex;align-items:flex-end;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--hair);margin-bottom:20px;flex-wrap:wrap}
.pagehead h1{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:.01em}
.pagehead .sub{color:var(--mute);font-size:13px;margin-top:3px}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h2.sec{font-family:var(--serif);font-weight:400;font-size:17px;margin-bottom:10px}
.lab2{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--hair2)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--hair);vertical-align:middle}
.tbl tr.rowlink{cursor:pointer}
.tbl tr.rowlink:hover td{background:rgba(33,64,217,.03)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}

/* empty state */
.empty{padding:44px 24px;text-align:center;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .glyph{width:44px;height:44px;border-radius:50%;border:1px dashed var(--hair2);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:18px}
.empty .t{font-family:var(--serif);font-size:16px;color:var(--ink2)}
.empty .s{font-size:12.5px;max-width:340px}
.empty .btn{margin-top:8px}

/* inputs */
.inp{border:1px solid var(--hair2);border-radius:7px;padding:6px 10px;font-size:13px;background:var(--chrome);width:100%}
.inp:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px rgba(33,64,217,.12)}
.inp.bare{border-color:transparent;background:transparent;padding-left:0}
.inp.bare:focus{box-shadow:none;border-color:transparent;border-bottom:1px solid var(--cobalt);border-radius:0}
textarea.inp{resize:vertical;min-height:70px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
select.inp{appearance:auto}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,22,28,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--chrome);border-radius:12px;box-shadow:var(--sh-pop);width:480px;max-width:100%;max-height:88vh;display:flex;flex-direction:column}
.modal.wide{width:720px}
.modal-h{padding:16px 20px 12px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:10px}
.modal-h .t{font-family:var(--serif);font-size:17px}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:12px 20px;border-top:1px solid var(--hair);display:flex;justify-content:flex-end;gap:8px}

/* floating micro-toolbar */
.mtb{position:absolute;z-index:120;background:var(--chrome);border:1px solid var(--hair);border-radius:99px;box-shadow:var(--sh-pop);display:flex;align-items:center;gap:2px;padding:3px 5px;animation:pop .12s ease-out}
.mtb button{width:26px;height:26px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--ink2)}
.mtb button:hover{background:var(--wash);color:var(--ink)}
.mtb button.on{color:var(--cobalt);background:var(--cobalt-wash)}
.mtb .div{width:1px;height:16px;background:var(--hair);margin:0 3px}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.97)}to{opacity:1}}

/* toast */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:99px;padding:8px 18px;font-size:13px;box-shadow:var(--sh-pop);display:flex;gap:9px;align-items:center;animation:pop .18s ease-out;max-width:88vw}
.toast .zap{color:#9db1ff}

/* dropdown menu */
.menu{position:absolute;z-index:300;background:var(--chrome);border:1px solid var(--hair);border-radius:9px;box-shadow:var(--sh-pop);padding:5px;min-width:190px;animation:pop .1s ease-out}
.menu button{display:flex;width:100%;text-align:left;padding:6px 10px;border-radius:6px;font-size:13px;gap:9px;align-items:center;color:var(--ink)}
.menu button:hover{background:var(--wash)}
.menu button.sel{color:var(--cobalt)}
.menu .mhr{border-top:1px solid var(--hair);margin:5px 3px}
.menu .mlab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:6px 10px 3px}

/* ---------- kanban ---------- */
.kwrap{display:flex;gap:0;align-items:flex-start;overflow-x:auto;padding:20px 34px 40px;flex:1}
.kcol{flex:0 0 268px;padding:0 14px;border-left:1px solid var(--hair)}
.kcol:first-child{border-left:0;padding-left:0}
.kcol-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;font-weight:600;color:var(--ink2)}
.kcol-h .n{color:var(--faint);font-weight:500}
.kcol.dragover{background:rgba(33,64,217,.035);border-radius:8px}
.kcard{background:var(--chrome);border:1px solid var(--hair);border-radius:9px;padding:10px 12px;margin-bottom:9px;cursor:grab;box-shadow:var(--sh-soft)}
.kcard:hover{border-color:var(--hair2);box-shadow:0 3px 10px rgba(25,27,32,.08)}
.kcard.dragging{opacity:.4}
.kcard .t{font-size:13px;font-weight:500;line-height:1.35}
.kcard .meta{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}
.kcard .due{font-size:11px;color:var(--mute)}
.kcard .due.over{color:var(--bad);font-weight:600}
.kcard .cl{font-size:11px;color:var(--mute);display:flex;align-items:center;gap:4px}
.phasedot{width:7px;height:7px;border-radius:2px;display:inline-block}

/* ---------- timeline ---------- */
.tlwrap{flex:1;overflow:auto;position:relative}
.tl-grid{position:relative}
.tl-head{position:sticky;top:0;background:var(--chrome);border-bottom:1px solid var(--hair2);z-index:20;display:flex}
.tl-hcell{border-left:1px solid var(--hair);font-size:10.5px;color:var(--mute);padding:6px 0 5px 7px;flex:0 0 auto}
.tl-hcell.today{color:var(--cobalt);font-weight:700}
.tl-row{position:relative;border-bottom:1px solid var(--hair);height:38px}
.tl-row.phase{height:30px;background:rgba(25,27,32,.014)}
.tl-vlines{position:absolute;inset:0;pointer-events:none}
.tl-vline{position:absolute;top:0;bottom:0;border-left:1px solid var(--hair);opacity:.6}
.tl-vline.wk{opacity:1}
.tl-todayline{position:absolute;top:0;bottom:0;width:1px;background:var(--cobalt);opacity:.55;z-index:5;pointer-events:none}
.tl-bar{position:absolute;top:8px;height:22px;border-radius:6px;font-size:11px;display:flex;align-items:center;padding:0 8px;color:#fff;cursor:grab;white-space:nowrap;overflow:hidden;box-shadow:var(--sh-soft);user-select:none}
.tl-bar.done{opacity:.55}
.tl-phasebar{position:absolute;top:9px;height:11px;border-radius:99px;opacity:.28}
.tl-label{position:sticky;left:0;z-index:15;background:var(--chrome);border-right:1px solid var(--hair2);width:200px;flex:0 0 200px;font-size:12px;display:flex;align-items:center;padding:0 12px;gap:7px;white-space:nowrap;overflow:hidden}
.tl-line{display:flex}
.tl-canvas{position:relative;flex:1}
.tl-dep{stroke:var(--faint);stroke-width:1.3;fill:none;marker-end:url(#arrh)}

/* ---------- calendar ---------- */
.calwrap{flex:1;overflow:auto;padding:0 34px 30px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--hair);border-top:1px solid var(--hair)}
.cal-dh{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:8px 10px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair2);background:var(--chrome);position:sticky;top:0;z-index:5}
.cal-cell{min-height:104px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:6px 7px;position:relative;background:var(--chrome);cursor:crosshair}
.cal-cell.dim{background:var(--wash)}
.cal-cell.today .dnum{background:var(--cobalt);color:#fff}
.cal-cell.selrange{background:var(--cobalt-wash)}
.dnum{font-size:11.5px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--ink2)}
.cal-ev{font-size:11px;border-radius:5px;padding:2px 7px;margin-top:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;width:100%;text-align:left}
.cal-ev.task{background:var(--cobalt-wash);color:var(--cobalt-ink)}
.cal-ev.milestone{background:transparent;color:var(--ink);font-weight:600}
.cal-ev.booking{background:var(--teal-wash);color:var(--teal)}
.cal-ev.meeting{background:var(--violet-wash);color:var(--violet)}

/* ---------- estimate grid ---------- */
.egridwrap{overflow:auto;border:1px solid var(--hair2);border-radius:10px;background:var(--chrome)}
.egrid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;min-width:760px}
.egrid th{position:sticky;top:0;background:var(--chrome);z-index:10;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--hair2)}
.egrid td{border-bottom:1px solid var(--hair);padding:0;position:relative}
.egrid td .cellin{padding:8px 12px;min-height:35px;display:flex;align-items:center}
.egrid td.num .cellin{justify-content:flex-end;font-variant-numeric:tabular-nums}
.egrid td.sel{outline:2px solid var(--cobalt);outline-offset:-2px;border-radius:2px}
.egrid td.infill{background:var(--cobalt-wash)}
.egrid td.sel .fillh{position:absolute;right:-4px;bottom:-4px;width:8px;height:8px;background:var(--cobalt);border:1.5px solid #fff;border-radius:2px;cursor:crosshair;z-index:12}
.egrid input.cellinp{border:0;width:100%;padding:8px 12px;background:transparent;outline:none;font:inherit;font-variant-numeric:tabular-nums}
.egrid tr:hover td{background:rgba(33,64,217,.025)}
.egrid tr:hover td.sel{background:transparent}
.egrid tfoot td{border-top:1px solid var(--hair2);border-bottom:0;font-weight:600;background:var(--chrome);position:sticky;bottom:0}
.egrid .rowidx{color:var(--faint);font-size:11px;width:34px;text-align:center}
.egrid .del{opacity:0;color:var(--faint)}
.egrid tr:hover .del{opacity:1}
.marginbar{height:5px;border-radius:99px;background:var(--hair);overflow:hidden;flex:1}
.marginbar>i{display:block;height:100%;background:var(--cobalt);border-radius:99px}

/* ---------- block editor ---------- */
.doc{max-width:720px;margin:0 auto;padding:30px 20px 120px}
.doc-title{font-family:var(--serif);font-size:34px;font-weight:400;outline:none;margin-bottom:6px;line-height:1.2}
.doc-title:empty::before{content:"Untitled document";color:var(--faint)}
.blk{position:relative;padding:2px 34px 2px 28px;border-radius:6px}
.blk .bh{position:absolute;left:0;top:5px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--faint);opacity:0;cursor:grab;border-radius:4px;font-size:13px}
.blk:hover .bh{opacity:1}
.blk .bh:hover{background:var(--wash);color:var(--ink2)}
.blk.dragover-top{box-shadow:0 -2px 0 var(--cobalt)}
.blk.dragover-bot{box-shadow:0 2px 0 var(--cobalt)}
.blk [contenteditable]{outline:none;min-height:1.4em}
.blk [contenteditable]:empty::before{content:attr(data-ph);color:var(--faint)}
.blk-p{font-size:15px;line-height:1.65;color:var(--ink);font-family:var(--serif)}
.blk-h1{font-family:var(--serif);font-size:24px;font-weight:400;margin-top:18px}
.blk-h2{font-family:var(--serif);font-size:18.5px;font-weight:400;margin-top:12px;color:var(--ink)}
.blk-li{font-size:15px;font-family:var(--serif);line-height:1.6;display:flex;gap:10px}
.blk-li::before{content:"—";color:var(--cobalt);flex:0 0 auto}
.blk-li>div{flex:1}
.blk-callout{background:var(--cobalt-wash);border-left:2px solid var(--cobalt);border-radius:0 8px 8px 0;padding:12px 16px;font-size:14px;line-height:1.6}
.blk-quote{border-left:2px solid var(--hair2);padding:2px 16px;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink2)}
.blk-img img{border-radius:8px;border:1px solid var(--hair)}
.blk-img .cap{font-size:12px;color:var(--mute);margin-top:6px;text-align:center}
.blk-div{border-top:1px solid var(--hair2);margin:14px 0}
.slashmenu{width:230px}
.slashmenu .k{margin-left:auto;font-size:10px;color:var(--faint)}

/* ---------- canvas board ---------- */
.cvwrap{flex:1;position:relative;overflow:hidden;background:var(--wash);cursor:default;
  background-image:radial-gradient(var(--hair2) 1px,transparent 1px);background-size:22px 22px}
.cvstage{position:absolute;transform-origin:0 0;top:0;left:0}
.cvitem{position:absolute;user-select:none}
.cvitem.sel>.cvbox{outline:1.5px solid var(--cobalt);outline-offset:2px}
.cvbox{width:100%;height:100%;border-radius:6px;overflow:hidden}
.cv-note{background:#fff7d6;border:1px solid #eadfa8;padding:12px;font-size:13px;font-family:var(--serif);line-height:1.5;box-shadow:var(--sh-soft);border-radius:2px}
.cv-note[contenteditable]{outline:none}
.cv-img{box-shadow:var(--sh-soft);border:1px solid rgba(25,27,32,.09)}
.cv-img img{width:100%;height:100%;object-fit:cover}
.cv-frame{border:1.5px solid var(--hair2);border-radius:10px;background:rgba(255,255,255,.5)}
.cv-frame-lab{position:absolute;top:-22px;left:2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;white-space:nowrap}
.marquee{position:absolute;border:1px solid var(--cobalt);background:rgba(33,64,217,.07);z-index:50;pointer-events:none}
.cvhud{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:60}
.cvzoom{position:absolute;right:18px;bottom:18px;z-index:60;background:var(--chrome);border:1px solid var(--hair);border-radius:99px;box-shadow:var(--sh-soft);display:flex;align-items:center;padding:2px 4px;gap:2px;font-size:12px}
.cpin{position:absolute;width:24px;height:24px;border-radius:99px 99px 99px 3px;background:var(--warn);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;box-shadow:var(--sh-soft);z-index:40}
.cpin.team{background:var(--cobalt)}

/* ---------- proposal / paper ---------- */
.paperbg{background:#e9e7e1;flex:1;overflow:auto;padding:34px 20px 80px}
.page{width:794px;min-height:1123px;background:var(--paper);color:var(--paper-ink);margin:0 auto 30px;box-shadow:0 3px 16px rgba(30,28,22,.18),0 1px 3px rgba(30,28,22,.12);padding:76px 80px;position:relative;font-family:var(--serif)}
.page .pnum{position:absolute;bottom:34px;right:80px;font-size:11px;color:#9b968a}
.page .runhead{position:absolute;top:34px;left:80px;right:80px;display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#9b968a}
.page h1{font-weight:400;font-size:38px;line-height:1.15}
.page h2{font-weight:400;font-size:22px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid #e2ddd2}
.page p{font-size:14px;line-height:1.75;margin-bottom:12px}
.page .toc-row{display:flex;align-items:baseline;font-size:14px;padding:9px 0;border-bottom:1px solid #eae6db}
.page .toc-row .dots{flex:1;border-bottom:1px dotted #c9c3b4;margin:0 10px;transform:translateY(-4px)}
.sigbox{border:1px solid #d9d3c4;border-radius:6px;padding:18px 20px;margin-top:14px;background:#fffdf9}
.sigline{border-bottom:1px solid #22201b;height:52px;display:flex;align-items:flex-end;padding-bottom:4px;font-size:24px}
.sig-script{font-family:'Segoe Script','Snell Roundhand',cursive}
.lockbanner{background:var(--ok-wash);color:var(--ok);border-radius:8px;padding:9px 14px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.sigpad{border:1px dashed var(--hair2);border-radius:8px;background:#fff;touch-action:none;width:100%}
.coverspacer{margin-top:200px}
.coverfoot{position:absolute;bottom:76px;left:80px;right:80px;border-top:1px solid #e2ddd2;padding-top:14px;display:flex;justify-content:space-between;font-size:11.5px;color:#6f6a5c;gap:10px;flex-wrap:wrap}

/* ---------- files ---------- */
.filesplit{display:flex;gap:0;min-height:420px}
.ftree{width:210px;flex:0 0 210px;border-right:1px solid var(--hair);padding-right:14px}
.ftree .fnode{display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:6px;font-size:13px;color:var(--ink2);width:100%;text-align:left}
.ftree .fnode:hover{background:var(--wash)}
.ftree .fnode.on{background:var(--cobalt-wash);color:var(--cobalt)}
.fmain{flex:1;padding-left:20px;min-width:0}
.frow{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--hair)}
.frow:hover{background:rgba(33,64,217,.02)}
.fthumb{width:44px;height:44px;border-radius:7px;border:1px solid var(--hair);background:var(--wash);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 44px;font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.05em}
.fthumb img{width:100%;height:100%;object-fit:cover}
.vbadge{font-size:10.5px;font-weight:700;background:var(--ink);color:#fff;border-radius:5px;padding:1px 6px}

/* ---------- automations ---------- */
.flowwrap{flex:1;position:relative;overflow:hidden;background:var(--wash);background-image:radial-gradient(var(--hair2) 1px,transparent 1px);background-size:22px 22px}
.fnodebox{position:absolute;width:220px;background:var(--chrome);border:1px solid var(--hair2);border-radius:11px;box-shadow:var(--sh-soft);cursor:grab;user-select:none}
.fnodebox.sel{outline:1.5px solid var(--cobalt);outline-offset:2px}
.fnodebox .fh{padding:9px 13px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;border-bottom:1px solid var(--hair)}
.fnodebox .fb{padding:9px 13px;font-size:12px;color:var(--ink2);line-height:1.45}
.fnodebox .port{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--chrome);border:2px solid var(--faint);top:50%;transform:translateY(-50%)}
.fnodebox .port.out{right:-6px;cursor:crosshair}
.fnodebox .port.out:hover{border-color:var(--cobalt);background:var(--cobalt-wash)}
.fnodebox .port.in{left:-6px}
.ftrig .fh{color:var(--cobalt)}
.fedge{stroke:var(--faint);stroke-width:1.6;fill:none}
.fedge.hot{stroke:var(--cobalt)}
.runlog{font-size:12px;border-left:2px solid var(--hair2);padding-left:12px;margin-left:4px}
.runlog .r{padding:5px 0;border-bottom:1px solid var(--hair)}

/* ---------- dashboard ---------- */
.dashgrid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.dashcell{padding:22px 26px;border-bottom:1px solid var(--hair)}
.dashcell:nth-child(odd){border-right:1px solid var(--hair)}
.dashcell h3{font-family:var(--serif);font-weight:400;font-size:16px;margin-bottom:2px}
.dashcell .sub{font-size:12px;color:var(--mute);margin-bottom:14px}
.statrow{display:flex;gap:0;border-bottom:1px solid var(--hair);margin-bottom:0}
.stat{flex:1;padding:18px 26px;border-right:1px solid var(--hair)}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--serif);font-size:27px;line-height:1.15}
.stat .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:600}
.stat .delta{font-size:11.5px;margin-top:2px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink2);flex-wrap:wrap}
.legend .sw{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;transform:translateY(1px)}

/* ---------- comments drawer ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:340px;background:var(--chrome);border-left:1px solid var(--hair);z-index:150;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(25,27,32,.06);animation:slidein .16s ease-out}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.drawer-h{padding:14px 18px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:9px}
.drawer-b{flex:1;overflow-y:auto;padding:8px 18px 20px}
.thread{padding:13px 0;border-bottom:1px solid var(--hair)}
.thread .anch{font-size:11px;color:var(--mute);background:var(--wash);border-radius:5px;padding:2px 8px;display:inline-block;margin-bottom:7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmsg{display:flex;gap:9px;margin-top:9px}
.cmsg .bd{flex:1;min-width:0}
.cmsg .who{font-size:12px;font-weight:600;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.cmsg .when{font-weight:400;color:var(--faint);font-size:11px}
.cmsg .txt{font-size:13px;margin-top:2px;line-height:1.5;overflow-wrap:break-word}
.cmsg .txt .at{color:var(--cobalt);font-weight:500}
.thread.resolved{opacity:.55}
.cbtn{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--mute);border:1px solid var(--hair2);border-radius:99px;padding:1px 8px;vertical-align:middle;background:var(--chrome)}
.cbtn:hover{color:var(--cobalt);border-color:var(--cobalt)}
.cbtn.has{color:var(--cobalt);border-color:transparent;background:var(--cobalt-wash);font-weight:600}
.cbtn.client-flag{background:#fdf3e4;color:#9a6a12}

/* ---------- portal ---------- */
.portal{min-height:100vh;background:var(--wash);display:flex;flex-direction:column}
.portal-top{background:var(--chrome);border-bottom:1px solid var(--hair);padding:0 22px;height:56px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.portal-top .pw{font-family:var(--serif);font-size:17px;display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.portal-nav{display:flex;gap:2px;margin-left:6px;overflow-x:auto;scrollbar-width:none}
.portal-nav::-webkit-scrollbar{display:none}
.portal-nav button{padding:6px 11px;border-radius:99px;font-size:13px;color:var(--ink2);white-space:nowrap}
.portal-nav button.on{background:var(--cobalt-wash);color:var(--cobalt);font-weight:600}
.portal-body{flex:1;width:100%;max-width:860px;margin:0 auto;padding:24px 22px 80px}
.portal-card{background:var(--chrome);border:1px solid var(--hair);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.actionitem{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.actionitem:last-child{border-bottom:0}
.actionitem .ic{width:36px;height:36px;border-radius:50%;background:var(--cobalt-wash);color:var(--cobalt);display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.actionitem .bd{flex:1;min-width:180px}
.actionitem .t{font-weight:600;font-size:13.5px}
.actionitem .s{font-size:12px;color:var(--mute)}

/* pipeline board */
.pipewrap{display:flex;gap:0;overflow-x:auto;padding:4px 0 30px;align-items:flex-start}
.pipecol{flex:0 0 218px;padding:0 13px;border-left:1px solid var(--hair)}
.pipecol:first-child{border-left:0;padding-left:0}
.pcard{background:var(--chrome);border:1px solid var(--hair);border-radius:9px;padding:11px 13px;margin-bottom:9px;cursor:pointer;box-shadow:var(--sh-soft)}
.pcard:hover{border-color:var(--faint)}
.pcard .nm{font-weight:600;font-size:13px}
.pcard .cl{font-size:11.5px;color:var(--mute)}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.pcard .amt{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink2)}

/* form builder */
.fbwrap{display:flex;gap:26px;align-items:flex-start}
.fbpal{width:190px;flex:0 0 190px;position:sticky;top:20px}
.fbpal .pi{display:flex;gap:9px;align-items:center;border:1px solid var(--hair2);background:var(--chrome);border-radius:8px;padding:8px 11px;margin-bottom:7px;font-size:12.5px;cursor:grab;box-shadow:var(--sh-soft)}
.fbpal .pi:hover{border-color:var(--cobalt);color:var(--cobalt)}
.fbform{flex:1;max-width:600px}
.ffield{border:1px solid transparent;border-radius:9px;padding:12px 14px;position:relative;background:var(--chrome);margin-bottom:8px;box-shadow:var(--sh-soft)}
.ffield:hover{border-color:var(--hair2)}
.ffield.sel{border-color:var(--cobalt)}
.ffield.dragover-top{box-shadow:0 -2px 0 var(--cobalt),var(--sh-soft)}
.ffield.dragover-bot{box-shadow:0 2px 0 var(--cobalt),var(--sh-soft)}
.ffield .flab{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.ffield .req{color:var(--bad)}
.pubform{max-width:560px;margin:0 auto;padding:40px 22px 80px}
.pubform .fcard{background:var(--chrome);border:1px solid var(--hair);border-radius:14px;padding:30px 32px;box-shadow:var(--sh-soft)}
.budget-opts{display:flex;flex-wrap:wrap;gap:8px}
.budget-opt{border:1px solid var(--hair2);border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;background:var(--chrome)}
.budget-opt.on{border-color:var(--cobalt);color:var(--cobalt);background:var(--cobalt-wash);font-weight:600}
.uploadbox{border:1.5px dashed var(--hair2);border-radius:10px;padding:22px;text-align:center;color:var(--mute);font-size:13px;cursor:pointer}
.uploadbox:hover{border-color:var(--cobalt);color:var(--cobalt)}

/* view switch (segmented) */
.seg{display:inline-flex;border:1px solid var(--hair2);border-radius:8px;padding:2px;background:var(--chrome);gap:1px}
.seg button{padding:4px 12px;font-size:12.5px;border-radius:6px;color:var(--ink2)}
.seg button.on{background:var(--cobalt-wash);color:var(--cobalt);font-weight:600}

/* misc */
.rowflex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gridauto{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.kbd{font-size:10.5px;border:1px solid var(--hair2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--mute);background:var(--chrome)}
.dot-sep{color:var(--hair2);margin:0 2px}
.progress{height:5px;border-radius:99px;background:var(--hair);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:99px;background:var(--cobalt)}
.checkline{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
.checkline input{margin-top:3px;accent-color:var(--cobalt)}
.checkline.done{color:var(--mute);text-decoration:line-through}

/* print */
@media print{
  body *{visibility:hidden}
  #printarea,#printarea *{visibility:visible}
  #printarea{position:absolute;left:0;top:0;width:100%}
  #printarea .page{box-shadow:none;margin:0;page-break-after:always;width:100%;min-height:auto}
  .noprint{display:none!important}
}

/* ---------- adopted from the mockup register ---------- */
/* pastel avatar tones */
.avatar.t-ink{background:#191b20;color:#fff}
.avatar.t-sky{background:#dde8f2;color:#2b4a68}
.avatar.t-peach{background:#f4e2d7;color:#7c4a2d}
.avatar.t-mint{background:#dcece5;color:#28584a}
.avatar.t-plum{background:#e9e0eb;color:#5d3f63}
.avatar.t-sand{background:#ede5d4;color:#6b5426}
.presence .avatar::after{background:var(--ok)}
.presence-more{width:26px;height:26px;border-radius:50%;background:var(--wash);border:1px solid var(--hair2);display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--mute);margin-left:-6px}

/* editorial screen headers */
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--cobalt);font-weight:700;margin-bottom:7px}
.pagehead h1{font-size:29px}
.pagehead .sub{font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:13.5px}

/* stage rail — the pipeline is the navigation */
.stagerail{display:flex;flex:0 0 auto;background:var(--chrome);border-bottom:1px solid var(--hair);overflow-x:auto;scrollbar-width:none}
.stagerail::-webkit-scrollbar{display:none}
.stagerail button{display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:12.5px;color:var(--mute);border-left:1px solid var(--hair);white-space:nowrap;position:relative;flex:1;justify-content:center;min-width:104px}
.stagerail button:first-child{border-left:0;flex:0 0 auto;min-width:0}
.stagerail button .sno{width:22px;height:22px;border-radius:50%;border:1px solid var(--hair2);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;letter-spacing:.03em;flex:0 0 22px}
.stagerail button.done{color:var(--ink2)}
.stagerail button.done .sno{border-color:transparent;background:var(--cobalt-wash);color:var(--cobalt)}
.stagerail button.on{color:var(--cobalt);font-weight:600}
.stagerail button.on .sno{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.stagerail button.on::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;background:var(--cobalt)}

/* toggle switch */
.switch{width:32px;height:18px;border-radius:99px;background:var(--hair2);position:relative;flex:0 0 32px;transition:background .12s;cursor:pointer;display:inline-block}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:var(--sh-soft);transition:left .12s}
.switch.on{background:var(--cobalt)}
.switch.on::after{left:16px}

/* side rails (estimate summary, proposal outline, calendar side, portal detail) */
.raillay{display:flex;gap:24px;align-items:flex-start}
.raillay>.railmain{flex:1;min-width:0}
.rail{width:250px;flex:0 0 250px;border:1px solid var(--hair);border-radius:12px;background:var(--chrome);padding:16px 18px}
.rline{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--hair);font-size:13px}
.rline strong{font-variant-numeric:tabular-nums}
.rail .rtotal{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px}
.rail .rtotal strong{font-family:var(--serif);font-size:21px;font-weight:400}
.healthnote{display:flex;gap:9px;align-items:center;border-radius:8px;padding:9px 11px;font-size:12px;margin-top:12px}
.healthnote.good{background:var(--ok-wash);color:var(--ok)}
.healthnote.low{background:var(--warn-wash);color:var(--warn)}
.outline-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 9px;border-radius:7px;font-size:12.5px;color:var(--ink2)}
.outline-item:hover{background:var(--wash)}
.outline-item.on{background:var(--cobalt-wash);color:var(--cobalt);font-weight:600}
.outline-item .n{font-size:10px;color:var(--faint);width:16px}

/* topbar search + bell */
.searchbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--hair2);border-radius:8px;padding:5px 11px;font-size:12.5px;color:var(--mute);background:var(--chrome);min-width:170px}
.searchbtn:hover{border-color:var(--faint)}
.searchbtn .kbd{margin-left:auto}
.searchres button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;padding:7px 10px;border-radius:7px;font-size:13px}
.searchres button:hover{background:var(--wash)}
.bell{position:relative}
.bell .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--cobalt);border:1.5px solid var(--chrome)}

/* workspace card + sidebar polish */
.wscard{display:flex;align-items:center;gap:10px;margin:4px 12px 8px;padding:9px 11px;border-radius:9px;background:var(--wash);text-align:left;width:calc(100% - 24px)}
.wscard .wmark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;font-family:var(--serif);display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 30px}
.wscard b{display:block;font-size:12.5px}
.wscard small{color:var(--mute);font-size:11px}
.navproj small{display:block;color:var(--faint);font-size:10.5px;line-height:1.2}
.sidefoot .footbtn{display:flex;gap:9px;align-items:center;width:100%;text-align:left;padding:6px 10px;border-radius:6px;color:var(--ink2);font-size:13px}
.sidefoot .footbtn:hover{background:var(--wash)}
.side-reopen{position:fixed;left:10px;top:10px;z-index:90;width:36px;height:36px;border-radius:9px;background:var(--chrome);border:1px solid var(--hair);box-shadow:var(--sh-soft);font-family:var(--serif);font-size:17px}
.app.nocollapse .side-reopen{display:none}
@media (min-width:901px){
  .app.side-collapsed .side{display:none}
}
@media (max-width:900px){ .side-reopen{display:none} }

/* canvas: left tool rail + minimap */
.cvtools{position:absolute;left:14px;top:50%;transform:translateY(-50%);z-index:60;background:var(--chrome);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--sh-pop);display:flex;flex-direction:column;gap:2px;padding:5px}
.cvtools button{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.cvtools button:hover{background:var(--wash)}
.cvtools button.on{background:var(--cobalt-wash);color:var(--cobalt)}
.cvtools .div{height:1px;background:var(--hair);margin:3px 4px}
.minimap{position:absolute;right:18px;top:14px;z-index:60;width:120px;height:82px;background:var(--chrome);border:1px solid var(--hair);border-radius:8px;box-shadow:var(--sh-soft);overflow:hidden}
.minimap i{position:absolute;background:var(--faint);border-radius:1px}
.minimap .vp{position:absolute;border:1.5px solid var(--cobalt);border-radius:2px;background:rgba(33,64,217,.05)}
.cv-text{background:#fff;border:1px solid var(--hair);box-shadow:var(--sh-soft);padding:16px;border-radius:4px;display:flex;flex-direction:column}
.cv-text .kick{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--cobalt);font-weight:700;margin-bottom:8px}
.cv-text .tx{font-family:var(--serif);font-size:17px;line-height:1.3;flex:1}
.cv-text .sws{display:flex;gap:5px;margin-top:10px}
.cv-text .sws i{width:22px;height:14px;border-radius:3px;display:inline-block}
@media (max-width:760px){
  .cvtools{left:50%;top:auto;bottom:14px;transform:translateX(-50%);flex-direction:row}
  .cvtools .div{width:1px;height:auto;margin:4px 3px}
  .minimap{display:none}
}

/* form builder 3-pane */
.fbsettings{width:230px;flex:0 0 230px;border:1px solid var(--hair);border-radius:12px;background:var(--chrome);padding:14px 16px;position:sticky;top:20px}
.fnum{font-size:10px;color:var(--cobalt);font-weight:700;letter-spacing:.05em;width:20px;flex:0 0 20px}
@media (max-width:1000px){ .fbsettings{position:static;width:100%;flex:auto} }

/* mini calendar */
.minical{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10.5px;text-align:center}
.minical span{padding:4px 0;border-radius:5px;color:var(--ink2);cursor:pointer}
.minical span.dim{color:var(--faint)}
.minical span.today{background:var(--cobalt);color:#fff;font-weight:700}
.minical span:hover{background:var(--wash)}
.callegend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink2);margin-top:14px}
.callegend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:7px}

/* portal file split */
.pfsplit{display:flex;gap:0;border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--chrome)}
.pfpreview{flex:1;background:#e9e7e1;display:flex;align-items:center;justify-content:center;padding:26px;min-height:340px}
.pfpreview .ppaper{background:var(--paper);box-shadow:0 3px 16px rgba(30,28,22,.18);max-width:280px;width:100%}
.pfpreview img{width:100%;display:block}
.pfdetail{width:290px;flex:0 0 290px;padding:20px 22px;border-left:1px solid var(--hair)}
.ontrack{display:flex;gap:10px;align-items:center;border:1px solid #cfe6d8;background:var(--ok-wash);color:var(--ok);border-radius:10px;padding:10px 14px;font-size:12.5px}
@media (max-width:760px){
  .pfsplit{flex-direction:column}
  .pfdetail{width:100%;flex:auto;border-left:0;border-top:1px solid var(--hair)}
  .pfpreview{min-height:220px;padding:16px}
}

/* automations master-detail */
.autosplit{display:flex;gap:0;flex:1;min-height:0}
.autolist{width:270px;flex:0 0 270px;border-right:1px solid var(--hair);background:var(--chrome);padding:14px;overflow-y:auto}
.flowitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 11px;border-radius:9px;margin-bottom:4px}
.flowitem:hover{background:var(--wash)}
.flowitem.on{background:var(--cobalt-wash)}
.flowitem .fic{width:30px;height:30px;border-radius:8px;background:var(--wash);color:var(--cobalt);display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.flowitem.on .fic{background:#fff}
.flowitem b{display:block;font-size:12.5px}
.flowitem small{color:var(--mute);font-size:11px}
.lastrun{position:absolute;right:16px;bottom:16px;z-index:50;background:var(--chrome);border:1px solid var(--hair);border-radius:10px;box-shadow:var(--sh-soft);padding:9px 13px;display:flex;gap:9px;align-items:center;font-size:12px;max-width:290px}
.lastrun .ok{color:var(--ok)}
.fnodebox.fcond .fh{color:var(--violet)}
@media (max-width:900px){
  .autosplit{flex-direction:column}
  .autolist{width:100%;flex:0 0 auto;border-right:0;border-bottom:1px solid var(--hair);display:flex;overflow-x:auto;padding:10px}
  .flowitem{min-width:210px;margin-bottom:0}
  .lastrun{display:none}
}

/* report screen */
.report-stats{display:flex;border-top:1px solid #e2ddd2;border-bottom:1px solid #e2ddd2;margin:26px 0}
.report-stats>div{flex:1;padding:16px 18px;border-left:1px solid #e2ddd2}
.report-stats>div:first-child{border-left:0;padding-left:0}
.report-stats strong{font-size:24px;font-weight:400;display:block}
.report-stats span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9b968a;display:block;margin-top:3px}
.report-stats small{font-size:11px;color:#6f6a5c}
.report-sec{display:flex;gap:18px;padding:18px 0;border-bottom:1px solid #eae6db}
.report-sec>span{color:var(--cobalt);font-size:11px;font-weight:700;letter-spacing:.05em;padding-top:4px}
.report-sec h3{font-weight:400;font-size:17px;margin-bottom:6px}
@media (max-width:760px){ .report-stats{flex-wrap:wrap} .report-stats>div{flex:1 1 100%;border-left:0;padding-left:0} }

/* raillay responsive */
@media (max-width:1000px){
  .raillay{flex-direction:column}
  .raillay .rail{width:100%;flex:auto}
  .raillay>.railmain{width:100%}
  .raillay .railfirst{order:-1}
}

@media (max-width:1000px){ .propoutline{display:none} .calside{display:none} }

/* library */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.libcard{border:1px solid var(--hair);border-radius:12px;overflow:hidden;background:var(--chrome);text-align:left;cursor:pointer}
.libcard:hover{border-color:var(--faint)}
.libcard img{width:100%;height:130px;object-fit:cover;display:block}
.libcard .lb{padding:10px 13px}
.libcard b{font-size:13px;display:block}
.libcard small{color:var(--mute);font-size:11.5px}

/* touch */
.cvwrap,.flowwrap,.tl-bar{touch-action:none}
.cal-cell,.kcard{touch-action:manipulation}

/* responsive — studio chrome */
.menubtn{display:none}
.sidebk{display:none}
@media (max-width:900px){
  .side{position:fixed;top:0;bottom:0;left:0;width:262px;transform:translateX(-105%);transition:transform .18s ease;z-index:260;box-shadow:8px 0 30px rgba(25,27,32,.14)}
  .side.open{transform:none}
  .sidebk{display:block;position:fixed;inset:0;background:rgba(20,22,28,.35);z-index:250}
  .menubtn{display:inline-flex}
  .topbar{padding:0 12px;gap:8px}
}
@media (max-width:520px){
  .topbar .presence{display:none}
  .crumb .stagechip{display:none}
}
@media (max-width:1100px){ .topbar .searchbtn{display:none} }
@media (max-width:640px){ .tb-right .btn.small{display:none} }
@media (max-width:760px){
  .tblwrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
  .kwrap{padding:14px 14px 34px}
  .kcol{flex:0 0 82vw;max-width:280px;padding:0 10px}
  .pipecol{flex:0 0 74vw;max-width:218px}
  .tl-label{width:122px;flex:0 0 122px;font-size:11px;padding:0 8px}
  .cal-cell{min-height:66px;padding:4px 4px}
  .calwrap{padding:0 14px 24px}
  .cal-ev{padding:2px 4px;font-size:10px}
  .dnum{width:18px;height:18px;font-size:10.5px}
  .flowsplit{flex-direction:column}
  .flowside{width:100%!important;flex:0 0 auto!important;border-left:0!important;border-top:1px solid var(--hair);max-height:190px}
  .toolrow{padding:9px 14px!important}
  .doc{padding:20px 8px 100px}
  .doc-title{font-size:26px}
  .content-wide>.noprint[style]{padding-left:14px!important;padding-right:14px!important}
  .paperbg{padding:18px 8px 60px}
  .fbform{max-width:none}
  .stat{padding:14px 16px}
  .dashcell{padding:16px 16px}
  .egridwrap{max-height:none!important}
}

/* responsive — portal must be clean at 360 */
@media (max-width:760px){
  .portal-body{padding:18px 14px 70px}
  .portal-top{padding:0 14px;gap:8px}
  .portal-card{padding:16px;border-radius:10px}
  .page{width:100%;min-height:auto;padding:34px 26px}
  .page .runhead{left:26px;right:26px;top:12px}
  .page .pnum{right:26px}
  .page h1{font-size:26px}
  .coverspacer{margin-top:60px}
  .coverfoot{position:static;margin-top:44px}
  .drawer{width:100vw}
  .content-pad{padding:18px 16px 60px}
  .filesplit{flex-direction:column}
  .ftree{width:100%;flex:auto;border-right:0;border-bottom:1px solid var(--hair);padding:0 0 10px;display:flex;flex-wrap:wrap;gap:4px}
  .fmain{padding-left:0;padding-top:12px}
  .dashgrid{grid-template-columns:1fr}
  .dashcell:nth-child(odd){border-right:0}
  .statrow{flex-wrap:wrap}
  .stat{flex:1 1 45%;border-bottom:1px solid var(--hair)}
  .fbwrap{flex-direction:column}
  .fbpal{width:100%;position:static;display:flex;flex-wrap:wrap;gap:6px}
  .fbpal .pi{margin-bottom:0}
  .modal{width:100%!important;max-height:94vh}
  .pagehead h1{font-size:21px}
  .sigline{font-size:19px}
}
</style>

<script>/* == src/00-data.js == */
/* ============ Atelier core: state, seed, helpers ============ */
'use strict';
const A = window.A = {};
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ---- utils ---- */
A.uid = (p='id') => p + '_' + Math.random().toString(36).slice(2, 9);
A.h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
A.money = (n, cur='USD') => new Intl.NumberFormat('en-US', {style:'currency', currency:cur, maximumFractionDigits:0}).format(n||0);
A.money2 = (n, cur='USD') => new Intl.NumberFormat('en-US', {style:'currency', currency:cur}).format(n||0);
A.clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const DAY = 86400000;
A.today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
A.iso = d => { const x = new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
A.d = iso => { const [y,m,dd] = iso.split('-').map(Number); return new Date(y, m-1, dd); };
A.addD = (iso, n) => A.iso(new Date(A.d(iso).getTime() + n*DAY));
A.diffD = (a,b) => Math.round((A.d(b)-A.d(a))/DAY);
A.fmtD = iso => A.d(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});
A.fmtDY = iso => A.d(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
A.ago = ts => { const m = Math.round((Date.now()-ts)/60000);
  if (m<1) return 'just now'; if (m<60) return m+'m ago'; const h=Math.round(m/60);
  if (h<24) return h+'h ago'; const dd=Math.round(h/24); if (dd<7) return dd+'d ago';
  return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
A.initials = n => n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
A.esc = A.h;

/* seeded placeholder art: soft duotone SVG */
A.art = (seed, w=640, h=440) => {
  let hsh = 0; for (const c of String(seed)) hsh = (hsh*31 + c.charCodeAt(0)) >>> 0;
  const hue = hsh % 360, hue2 = (hue + 40 + hsh % 60) % 360;
  const s1 = `hsl(${hue},26%,82%)`, s2 = `hsl(${hue2},30%,64%)`, s3 = `hsl(${hue},32%,42%)`;
  const cx = 20 + hsh % 60, cy = 25 + (hsh>>3) % 50, r = 18 + (hsh>>5) % 26;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 ${Math.round(100*h/w)}" width="${w}" height="${h}">
  <rect width="100%" height="100%" fill="${s1}"/>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="${s2}"/>
  <path d="M0 ${Math.round(100*h/w)} L100 ${Math.round(100*h/w*0.35)} L100 ${Math.round(100*h/w)} Z" fill="${s3}" opacity=".85"/>
  <circle cx="${(cx+55)%100}" cy="${cy+12}" r="${Math.max(6,r-12)}" fill="none" stroke="${s3}" stroke-width="1.6" opacity=".6"/></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
};

  db: seed(),
  meId: 'u1',
  route: {screen:'dashboard'},
  drawer: false,          // comments drawer open
  drawerFilter: null,     // {anchorType, anchorId} or null = current screen scope
  toasts: [],
};
A.db = S.db;
A.me = () => S.db.users.find(u => u.id === S.meId);
A.user = id => S.db.users.find(u => u.id === id) || {name:'Someone', color:'#999'};
A.client = id => S.db.clients.find(c => c.id === id) || {name:'—'};
A.proj = id => S.db.projects.find(p => p.id === id);
A.isClient = () => A.me().role === 'client';
A.canEdit = () => ['admin','producer'].includes(A.me().role);
A.isAdmin = () => A.me().role === 'admin';
A.myClientId = () => A.me().clientId;

/* projects visible to current persona — clients NEVER see other clients */
A.visibleProjects = () => {
  const me = A.me();
  if (me.role === 'client') return S.db.projects.filter(p => p.clientId === me.clientId);
  return S.db.projects;
};
A.assertClientAccess = (projectId) => {
  const me = A.me();
  if (me.role !== 'client') return true;
  const p = A.proj(projectId);
  return !!p && p.clientId === me.clientId;
};

/* estimate math */
A.rateFor = role => (S.db.rateCard.find(r => r.role === role) || {}).rate || 0;
A.costFor = role => (S.db.rateCard.find(r => r.role === role) || {}).cost || 0;
A.estTotals = est => {
  let sub = 0, cost = 0;
  for (const l of est.lines) { sub += (l.rate||0) * (l.qty||0); cost += A.costFor(l.role) * (l.qty||0); }
  const margin = sub ? (sub - cost) / sub : 0;
  return {sub, cost, margin, total: sub * (1 + (est.tax||0)/100)};
};
A.estFor = pid => S.db.estimates.find(e => e.projectId === pid);

/* picture resolver — real editorial photo when tagged, generated art otherwise */
A.pic = (obj, w=640, h=440) => (obj && obj.photo && window.PHOTOS && window.PHOTOS[obj.photo]) ? window.PHOTOS[obj.photo] : A.art((obj && (obj.seed || obj.name)) || 'x', w, h);

/* comments helpers */
A.threadsFor = (anchorType, anchorId) => S.db.comments.filter(c => c.anchorType === anchorType && c.anchorId === anchorId);
A.projThreads = pid => S.db.comments.filter(c => c.projectId === pid);
A.commentCount = (anchorType, anchorId) => {
  const th = A.threadsFor(anchorType, anchorId).filter(t => !t.resolved);
  return th.reduce((n,t) => n + 1 + t.replies.length, 0);
};

/* activity + notifications */
A.logAct = (text, projectId) => { S.db.activity.unshift({id:A.uid('a'), text, projectId, at:Date.now(), by:A.me().name}); };
A.notify = (text) => { S.db.notifications.unshift({id:A.uid('n'), text, at:Date.now()}); };

A.ic = (n, sz=16) => `<svg width="${sz}" height="${sz}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${IC[n]||IC.doc}</svg>`;

/* ---- primitives ---- */
A.avatar = (uid, cls='') => { const u = typeof uid === 'string' ? A.user(uid) : uid;
  return u.tone ? `<span class="avatar ${cls} t-${u.tone}" title="${A.h(u.name)}">${A.initials(u.name)}</span>`
    : `<span class="avatar ${cls}" style="background:${u.color}" title="${A.h(u.name)}">${A.initials(u.name)}</span>`; };
A.head = (eyebrow, title, sub, actions='') => `
  <div class="pagehead"><div>${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h1>${title}</h1><div class="sub">${sub}</div></div>
  <div class="actions">${actions}</div></div>`;
A.chip = (label, tone='neutral', dot=true) => `<span class="chip ${tone}">${dot?'<span class="d"></span>':''}${A.h(label)}</span>`;
A.stageChip = st => A.chip(A.STAGE_LABEL[st]||st, A.STAGE_CHIP[st]||'neutral');
A.empty = (glyph, title, sub, actionLabel, actionJs) => `
  <div class="empty">
    <div class="glyph">${glyph}</div>
    <div class="t serif">${title}</div>
    <div class="s">${sub}</div>
    ${actionLabel ? `<button class="btn primary" onclick="${actionJs}">${A.ic('plus',13)} ${actionLabel}</button>` : ''}
  </div>`;

A.toast = (msg, zap=false) => {
  const id = A.uid('t'); S.toasts.push({id, msg, zap});
  renderToasts();
  setTimeout(() => { S.toasts = S.toasts.filter(t => t.id !== id); renderToasts(); }, 3400);
};
function renderToasts(){
  let el = $('#toasts'); if (!el) { el = document.createElement('div'); el.id='toasts'; el.className='toasts'; document.body.appendChild(el); }
  el.innerHTML = S.toasts.map(t => `<div class="toast">${t.zap?`<span class="zap">${A.ic('zap',14)}</span>`:''}${t.msg}</div>`).join('');
}

/* modal */
A.modal = (html, opts={}) => {
  A.closeModal();
  const ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'overlay';
  ov.innerHTML = `<div class="modal ${opts.wide?'wide':''}" onclick="event.stopPropagation()">${html}</div>`;
  ov.onclick = () => { if (!opts.sticky) A.closeModal(); };
  document.body.appendChild(ov);
};
A.closeModal = () => { $('#overlay')?.remove(); };
A.modalH = t => `<div class="modal-h"><span class="t">${t}</span><button class="iconbtn" style="margin-left:auto" onclick="A.closeModal()">${A.ic('x',14)}</button></div>`;

/* popover menu */
A.menuAt = (anchorEl, html) => {
  A.closeMenu();
  const r = anchorEl.getBoundingClientRect();
  const m = document.createElement('div'); m.className = 'menu'; m.id = 'popmenu';
  m.style.top = Math.min(window.innerHeight-260, r.bottom + 6) + 'px';
  m.style.left = Math.min(window.innerWidth - 230, r.left) + 'px';
  m.innerHTML = html;
  document.body.appendChild(m);
  setTimeout(() => document.addEventListener('mousedown', A._menuDismiss = e => { if (!m.contains(e.target)) A.closeMenu(); }), 0);
};
A.closeMenu = () => { $('#popmenu')?.remove(); if (A._menuDismiss) document.removeEventListener('mousedown', A._menuDismiss); };

/* presence — deterministic fake presence per screen */
A.presenceBar = key => {
  const others = S.db.users.filter(u => u.id !== S.meId && u.role !== 'client');
  let h = 0; for (const c of key) h = (h*31 + c.charCodeAt(0)) >>> 0;
  const here = others.filter((u,i) => (h >> i) % 3 !== 0).slice(0,3);
  const clientHere = key.includes('p1') && (h % 4 === 1) ? [S.db.users.find(u=>u.id==='u5')] : [];
  return `<div class="presence" title="Viewing now">${[A.me(),...here,...clientHere].map(u => A.avatar(u)).join('')}</div>`;
};

/* ---- router ---- */
A.go = (...parts) => { location.hash = '#/' + parts.filter(x => x != null).join('/'); };
function parseRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  const seg = h.split('/').filter(Boolean);
  if (A.isClient()) { S.route = {screen:'portal', tab: seg[0]==='portal' ? (seg[1]||'home') : 'home', id: seg[2]}; return; }
  if (!seg.length) { S.route = {screen:'dashboard'}; return; }
  if (seg[0] === 'p') S.route = {screen:'project', pid: seg[1], tab: seg[2]||'overview', sub: seg[3]};
  else S.route = {screen: seg[0], id: seg[1], sub: seg[2]};
}
window.addEventListener('hashchange', () => { parseRoute(); S.sideOpen = false; A.render(); });
A.toggleSide = () => { S.sideOpen = !S.sideOpen; A.render(); };

/* switch persona */
A.switchUser = uid => {
  S.meId = uid; A.closeMenu();
  const u = A.user(uid);
  if (u.role === 'client') location.hash = '#/portal/home';
  else if (location.hash.includes('portal')) location.hash = '#/dashboard';
  parseRoute(); A.render();
  A.toast(`Viewing as ${u.name} (${u.role})`);
};
A.roleMenu = ev => {
  A.menuAt(ev.currentTarget, `
    <div class="mlab">Studio</div>
    ${S.db.users.filter(u=>u.role!=='client').map(u => `<button class="${u.id===S.meId?'sel':''}" onclick="A.switchUser('${u.id}')">${A.avatar(u,'sm')} ${A.h(u.name)} <span class="mute small" style="margin-left:auto">${u.role}</span></button>`).join('')}
    <div class="mhr"></div><div class="mlab">Client portal (guest)</div>
    ${S.db.users.filter(u=>u.role==='client').map(u => `<button class="${u.id===S.meId?'sel':''}" onclick="A.switchUser('${u.id}')">${A.avatar(u,'sm')} ${A.h(u.name)} <span class="mute small" style="margin-left:auto">${A.client(u.clientId).name}</span></button>`).join('')}`);
};

/* ---- shell render ---- */
A.render = () => {
  A.closeMenu();
  const root = $('#root');
  if (A.isClient()) { root.innerHTML = A.renderPortal(); A.afterRender(); return; }
  const r = S.route;
  const unseen = S.db.notifications.length && !S.notifSeen;
  root.innerHTML = `
  <div class="app ${S.sideCollapsed?'side-collapsed':''}">
    ${S.sideOpen ? '<div class="sidebk noprint" onclick="A.toggleSide()"></div>' : ''}
    ${S.sideCollapsed ? `<button class="side-reopen noprint" title="Open navigation" onclick="S.sideCollapsed=false;A.render()">A<span style="color:var(--cobalt)">.</span></button>`:''}
    <nav class="side noprint ${S.sideOpen?'open':''}">
      <div class="wordmark" style="justify-content:space-between;padding-right:12px"><span><b>Atelier</b><span class="dot"></span></span>
        <button class="iconbtn" title="Collapse" onclick="S.sideCollapsed=true;A.render()" style="display:${window.innerWidth>900?'inline-flex':'none'}">${A.ic('chev',13)}</button></div>
      <button class="wscard" onclick="A.toast('One workspace on this plan — Atelier Studio')">
        <span class="wmark">A</span><span style="min-width:0"><b>Atelier Studio</b><small>Creative practice</small></span></button>
      <div class="navsec">
        ${navItem('dashboard','dash','Studio')}
        ${navItem('pipeline','pipe','Pipeline')}
        ${navItem('leads','inbox','Inquiries', S.db.leads.filter(l=>l.status==='new').length || '')}
        ${navItem('forms','form','Intake forms')}
        ${navItem('library','img','Library')}
        ${navItem('automations','zap','Automations')}
        ${navItem('settings','gear','Settings')}
      </div>
      <div class="navsec">
        <div class="lab">Projects</div>
        ${S.db.projects.filter(p=>p.stage!=='report').map(p => `
          <button class="navproj ${r.pid===p.id?'on':''}" onclick="A.go('p','${p.id}','${r.pid===p.id?r.tab:'overview'}')">
            <span class="swatch" style="background:${p.color}"></span><span class="nm">${A.h(p.name)}<small>${A.h(A.client(p.clientId).name)}</small></span></button>`).join('')}
      </div>
      <div class="sidefoot">
        <button class="footbtn" onclick="A.helpModal()">${A.ic('chat',15)} Help & shortcuts</button>
        <button class="navitem" onclick="A.roleMenu(event)" style="padding:6px 8px;margin-top:4px">
          ${A.avatar(A.me())} <span style="min-width:0"><span style="display:block;font-weight:600;font-size:12.5px;color:var(--ink)">${A.h(A.me().name)}</span>
          <span class="tiny mute">${A.h(A.me().title||A.me().role)}</span></span></button>
      </div>
    </nav>
    <div class="main">
      <div class="topbar noprint">
        <button class="iconbtn menubtn" title="Menu" onclick="A.toggleSide()">${A.ic('menu',17)}</button>
        <div class="crumb">${A.crumb()}</div>
        <div class="tb-right">
          <button class="searchbtn" onclick="A.searchModal()">${A.ic('eye',13)} Search anything <span class="kbd">⌘K</span></button>
          ${A.presenceBar(JSON.stringify(r))}
          <button class="iconbtn bell" title="Notifications" onclick="A.bellMenu(event)">${A.ic('clock')}${unseen?'<span class="dot"></span>':''}</button>
          <button class="btn small" onclick="A.clientView()" title="Preview the portal as this project's client">${A.ic('eye',13)} Client view</button>
          <button class="iconbtn ${S.drawer?'on':''}" title="Comments" onclick="A.toggleDrawer()">${A.ic('chat')}</button>
        </div>
      </div>
      <div class="content" id="content">${A.screen()}</div>
    </div>
  </div>
  ${S.drawer ? A.renderDrawer() : ''}`;
  A.afterRender();
};
function navItem(scr, ic, label, cnt=''){
  const on = S.route.screen === scr || (scr==='forms' && ['form','pub'].includes(S.route.screen)) || (scr==='automations' && S.route.screen==='flow');
  return `<button class="navitem ${on?'on':''}" onclick="A.go('${scr}')">${A.ic(ic)} ${label}${cnt!==''?`<span class="cnt">${cnt}</span>`:''}</button>`;
}
A.crumb = () => {
  const r = S.route;
  if (r.screen === 'project') { const p = A.proj(r.pid);
    return `<span class="mute">${A.h(A.client(p.clientId).name)}</span><span class="sep">/</span><b>${A.h(p.name)}</b>
      <span class="stagechip" style="margin-left:6px">${A.stageChip(p.stage)}</span>`; }
  const names = {dashboard:'Studio dashboard', pipeline:'Pipeline', leads:'Inquiries', forms:'Intake forms', form:'Form builder', pub:'Public form', automations:'Automations', flow:'Flow editor', settings:'Settings', library:'Library'};
  return `<b>${names[r.screen]||'Atelier'}</b>`;
};

/* screen dispatch */
A.screen = () => {
  const r = S.route;
  try{
    switch(r.screen){
      case 'dashboard': return A.scrDashboard();
      case 'pipeline': return A.scrPipeline();
      case 'leads': return A.scrLeads();
      case 'forms': return A.scrForms();
      case 'form': return A.scrFormBuilder(r.id);
      case 'pub': return A.scrPublicForm(r.id);
      case 'automations': return A.scrAutomations(r.id);
      case 'flow': return A.scrAutomations(r.id);
      case 'library': return A.scrLibrary();
      case 'settings': return A.scrSettings();
      case 'project': return A.scrProject(r.pid, r.tab, r.sub);
      default: return A.scrDashboard();
    }
  } catch(e){ console.error(e); return `<div class="content-pad">${A.empty('!','Something went sideways', A.h(e.message))}</div>`; }
};
A.afterRenderHooks = [];
A.afterRender = () => { const hooks = A.afterRenderHooks; A.afterRenderHooks = []; hooks.forEach(f => { try{f();}catch(e){console.error(e);} }); renderToasts(); };
A.onDraw = f => A.afterRenderHooks.push(f);

/* ---- pipeline screen ---- */
A.scrPipeline = () => {
  const byStage = st => {
    if (st === 'inquiry') return S.db.leads.filter(l => l.status !== 'converted').map(l => ({lead:l}));
    return A.visibleProjects().filter(p => p.stage === st).map(p => ({proj:p}));
  };
  return `<div class="content-pad" style="max-width:none">
    ${A.head('Studio / Pipeline', 'One river, eight bends.', 'Every engagement from inquiry to report, and where it sits today.',
      `<button class="btn" onclick="A.go('forms')">${A.ic('form',14)} Intake forms</button>
      <button class="btn primary" onclick="A.newProjectModal()">${A.ic('plus',13)} New project</button>`)}
    <div class="pipewrap">
      ${A.STAGES.map(st => { const cards = byStage(st); return `
        <div class="pipecol">
          <div class="kcol-h">${A.stageChip(st)} <span class="n">${cards.length}</span></div>
          ${cards.length ? cards.map(c => c.lead ? `
            <div class="pcard" onclick="A.go('leads')">
              <div class="nm">${A.h(c.lead.name)}</div><div class="cl">${A.h(c.lead.contact)}</div>
              <div class="foot"><span class="chip neutral">${A.h(c.lead.answers['Budget range']||'—')}</span><span class="tiny mute">${A.ago(c.lead.at)}</span></div></div>` : `
            <div class="pcard" onclick="A.go('p','${c.proj.id}','overview')">
              <div class="nm">${A.h(c.proj.name)}</div><div class="cl">${A.h(A.client(c.proj.clientId).name)}</div>
              <div class="foot"><span class="amt">${A.money(c.proj.budget)}</span>${A.avatar(c.proj.team[0],'sm')}</div></div>`).join('')
          : `<div class="empty" style="padding:22px 6px"><div class="s">Nothing in ${A.STAGE_LABEL[st].toLowerCase()}${st==='inquiry'?' — share your intake link':''}</div>${st==='inquiry'?`<button class="btn small" onclick="A.go('forms')">Get the link</button>`:''}</div>`}
        </div>`; }).join('')}
    </div></div>`;
};

A.newProjectModal = () => {
  A.modal(`${A.modalH('New project')}
    <div class="modal-b">
      <div class="field"><label>Project name</label><input class="inp" id="np-name" placeholder="e.g. Meridian Rebrand"></div>
      <div class="field"><label>Client</label><select class="inp" id="np-client">${S.db.clients.map(c=>`<option value="${c.id}">${A.h(c.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Budget (USD)</label><input class="inp" id="np-budget" type="number" value="30000"></div>
      <div class="field"><label>Starting stage</label><select class="inp" id="np-stage">${A.STAGES.slice(1,5).map(s=>`<option value="${s}">${A.STAGE_LABEL[s]}</option>`).join('')}</select></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="A.closeModal()">Cancel</button>
    <button class="btn primary" onclick="A.createProject()">Create project</button></div>`);
};
A.createProject = (opts={}) => {
  const name = opts.name ?? ($('#np-name')?.value.trim() || 'Untitled project');
  const clientId = opts.clientId ?? ($('#np-client')?.value || 'c1');
  const budget = opts.budget ?? (+($('#np-budget')?.value) || 0);
  const stage = opts.stage ?? ($('#np-stage')?.value || 'brief');
  const p = {id:A.uid('p'), clientId, name, code:name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)+'-'+Math.floor(Math.random()*90+10),
    stage, budget, currency:'USD', spent:0, billed:0, start:A.iso(A.today()), due:A.addD(A.iso(A.today()),60),
    color:A.AV_COLORS[S.db.projects.length % A.AV_COLORS.length], team:[S.meId==='u1'||S.meId==='u2'?S.meId:'u2']};
  S.db.projects.push(p);
  A.closeModal(); A.logAct(`created project ${name}`, p.id);
  if (!opts.silent){ A.toast(`Project created — ${name}`); A.go('p', p.id, 'overview'); }
  return p;
};

/* ---- project shell: the pipeline IS the navigation ---- */
const STAGE_TAB = {inquiry:'inquiry', brief:'docs', concept:'board', estimate:'estimate', proposal:'proposal', production:'production', delivery:'delivery', report:'report'};
A.scrProject = (pid, tab, sub) => {
  const p = A.proj(pid);
  if (!p) return `<div class="content-pad">${A.empty('?','Project not found','It may have been archived.','Back to pipeline',"A.go('pipeline')")}</div>`;
  const idx = A.STAGES.indexOf(p.stage);
  const body = {overview:A.tabOverview, inquiry:A.tabInquiry, docs:A.tabDocs, board:A.tabBoard, estimate:A.tabEstimate, proposal:A.tabProposal, production:A.tabProduction, delivery:A.tabDelivery, report:A.tabReport}[tab] || A.tabOverview;
  return `<div class="content-wide">
    <div class="stagerail noprint">
      <button class="${tab==='overview'?'on':''}" onclick="A.go('p','${pid}','overview')" title="Overview"><span class="sno">${A.ic('dash',11)}</span></button>
      ${A.STAGES.map((st,i) => { const t = STAGE_TAB[st]; const on = tab===t;
        return `<button class="${on?'on':''} ${i<idx?'done':''}" onclick="A.go('p','${pid}','${t}')">
          <span class="sno">${i<idx?A.ic('check',11):String(i+1).padStart(2,'0')}</span>${A.STAGE_LABEL[st]}</button>`; }).join('')}
    </div>
    ${body(p, sub)}</div>`;
};

/* ---- stage 01: inquiry ---- */
A.tabInquiry = p => {
  const lead = S.db.leads.find(l => l.projectId === p.id);
  const c = A.client(p.clientId);
  const form = lead ? S.db.forms.find(f=>f.id===lead.formId) : S.db.forms[0];
  return `<div class="content-pad" style="max-width:820px">
    ${A.head(A.h(p.name)+' / Inquiry', 'Where it started.',
      lead ? 'The original submission, kept whole — every answer stays attached to the lead it created.' : 'This project began as a conversation, not a form. The intake link is ready for the next one.',
      `<button class="btn" onclick="A.go('pub','${(form||{}).slug||''}')">${A.ic('eye',14)} Public form</button>
       <button class="btn primary" onclick="A.go('form','${(form||{}).id||''}')">${A.ic('form',14)} Form builder</button>`)}
    ${lead ? `
      <div class="rowflex" style="margin-bottom:14px">${A.chip('Converted to this project','ok')}
        <span class="tiny mute">via “${A.h((form||{}).name||'form')}” · ${A.ago(lead.at)}</span></div>
      ${Object.entries(lead.answers).filter(([,v])=>v).map(([q,v]) => `
        <div style="padding:11px 0;border-bottom:1px solid var(--hair)">
          <div class="lab2" style="margin-bottom:3px">${A.h(q)}</div>
          <div style="font-size:14px" class="serif">${A.h(v)}</div></div>`).join('')}`
    : `<div class="sect" style="border:1px solid var(--hair);border-radius:12px;background:var(--chrome);padding:20px 22px">
        <div class="lab2" style="margin-bottom:8px">Client of record</div>
        <div class="rowflex">${A.avatar(S.db.users.find(u=>u.clientId===p.clientId)||{name:c.contact,color:'#8a90a0'},'lg')}
          <div><b>${A.h(c.contact)}</b><div class="tiny mute">${A.h(c.name)} · ${A.h(c.email)}</div></div></div>
        <div class="hr"></div>
        ${A.empty('◱','No linked inquiry','Next time, share the public intake form — submissions arrive as leads with every answer attached.','See inquiries',"A.go('leads')")}
      </div>`}
  </div>`;
};

/* ---- stage 08: report ---- */
A.tabReport = p => {
  const est = A.estFor(p.id); const t = est ? A.estTotals(est) : null;
  const tasks = S.db.tasks.filter(x=>x.projectId===p.id);
  const done = tasks.filter(x=>x.status==='done').length;
  const shared = S.db.files.filter(f=>f.projectId===p.id && f.shared);
  const approved = shared.filter(f=>f.approval==='approved').length;
  const quote = S.db.comments.find(cm => cm.projectId===p.id && A.user(cm.authorId).role==='client');
  const sections = [
    ['Overview', true], ['Outcomes', true], ['Scope delivered', shared.length>0],
    ['Financials', !!t], ['Client feedback', !!quote], ['Retrospective', false]];
  const ready = sections.filter(s=>s[1]).length;
  return `<div class="content-pad" style="max-width:1080px">
    ${A.head(A.h(p.name)+' / Report', 'Close the loop.', 'A clear account of scope, outcomes, approvals — and what the studio learned.',
      `${A.commentBtn('report', p.id, p.id, 'Report')}<button class="btn primary" onclick="window.print()">${A.ic('print',14)} Export PDF</button>`)}
    <div class="raillay">
      <div class="railmain" id="printarea">
        <div class="page" style="width:100%;min-height:auto;padding:54px 56px">
          <div style="font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#9b968a">Project report · ${new Date().getFullYear()}</div>
          <h1 style="margin-top:14px">${A.h(p.name)},<br>start to finish.</h1>
          <p style="margin-top:14px;color:#6f6a5c;font-style:italic">Prepared for ${A.h(A.client(p.clientId).name)} — ${A.fmtD(p.start)} to ${A.fmtD(p.due)}.</p>
          <div class="report-stats">
            <div><strong>${A.money(p.billed)}</strong><span>Billed</span><small>of ${A.money(p.budget)} budget</small></div>
            <div><strong>${t?Math.round(t.margin*100)+'%':'—'}</strong><span>Margin</span><small>${t? (Math.round(t.margin*100) >= (S.db.settings.marginTarget||55) ? 'above' : 'below')+' the '+(S.db.settings.marginTarget||55)+'% target':'no estimate'}</small></div>
            <div><strong>${shared.length?Math.round(approved/shared.length*100)+'%':'—'}</strong><span>Deliverables approved</span><small>${approved} of ${shared.length} shared files</small></div>
            <div><strong>${done}/${tasks.length||0}</strong><span>Tasks closed</span><small>across ${A.PHASES.length} phases</small></div>
          </div>
          <div class="report-sec"><span>01</span><div><h3>The outcome</h3>
            <p style="margin:0">${A.h(p.name)} moved through all eight stages of the studio pipeline${p.stage==='report'?' and is complete':' and is currently in '+A.STAGE_LABEL[p.stage].toLowerCase()}. The signed scope held, and the client approved work directly against the files delivered.</p></div></div>
          <div class="report-sec"><span>02</span><div><h3>What shipped</h3>
            ${shared.length?`<ul style="margin:0;padding-left:18px">${shared.map(f=>`<li style="margin-bottom:4px">${A.h(f.name)} — v${f.versions.length}${f.approval==='approved'?' · approved':''}</li>`).join('')}</ul>`
              :'<p style="margin:0;color:#9b968a">Nothing shared to the portal yet — deliverables land here as they ship.</p>'}</div></div>
          ${quote?`<div class="report-sec"><span>03</span><div><h3>In the client’s words</h3>
            <p style="margin:0;font-style:italic;font-size:16px">“${A.h(quote.body)}”</p>
            <p style="margin:8px 0 0;color:#9b968a;font-size:12px">— ${A.h(A.user(quote.authorId).name)}, ${A.h(A.client(p.clientId).name)}</p></div></div>`:''}
        </div>
      </div>
      <div class="rail noprint">
        <div class="lab2" style="margin-bottom:8px">Report contents</div>
        ${sections.map(([s,ok],i)=>`<div class="outline-item"><span class="n">${String(i+1).padStart(2,'0')}</span><span style="flex:1">${s}</span>${ok?`<span style="color:var(--ok)">${A.ic('check',12)}</span>`:''}</div>`).join('')}
        <div class="healthnote ${ready>=5?'good':'low'}" style="margin-top:14px">${A.ic('check',13)} ${ready} of ${sections.length} sections ready</div>
        <button class="btn" style="width:100%;justify-content:center;margin-top:10px" onclick="A.toast('Retrospective template added to Documents')">${A.ic('plus',13)} Add retrospective</button>
      </div>
    </div>
  </div>`;
};

/* ---- library ---- */
A.scrLibrary = () => {
  const cols = [];
  S.db.projects.forEach(p => { const imgs = S.db.files.filter(f=>f.projectId===p.id && f.kind==='image');
    if (imgs.length) cols.push({name:A.h(p.name), sub:imgs.length+' asset'+(imgs.length===1?'':'s'), cover:A.pic(imgs[0],420,280), pid:p.id}); });
  cols.push({name:'Aster & Pine — brand world', sub:'18 assets', cover:window.PHOTOS?window.PHOTOS.still:A.art('still'), pid:'p1'});
  cols.push({name:'Material studies', sub:'9 references', cover:window.PHOTOS?window.PHOTOS.arch:A.art('arch'), pid:'p1'});
  return `<div class="content-pad" style="max-width:1040px">
    ${A.head('Studio / Library', 'The studio’s useful things.', 'Reusable assets, references and approved material — one searchable place.',
      `<button class="btn primary" onclick="A.toast('Upload drawer opened — drop files anywhere')">⇪ Upload</button>`)}
    ${cols.length ? `<div class="libgrid">
      ${cols.map(c => `<button class="libcard" onclick="A.go('p','${c.pid}','delivery')"><img src="${c.cover}" alt=""><span class="lb"><b>${c.name}</b><small>${c.sub}</small></span></button>`).join('')}
      <button class="libcard" style="display:flex;align-items:center;justify-content:center;min-height:170px;border-style:dashed" onclick="A.toast('New collection created')">
        <span style="text-align:center;color:var(--mute)">${A.ic('plus',18)}<b style="display:block;font-size:13px;margin-top:6px;color:var(--ink2)">New collection</b><small>Organize a reusable set</small></span></button>
    </div>` : A.empty('▣','Nothing collected yet','Images from project deliveries gather here automatically.','Open a project',"A.go('pipeline')")}
  </div>`;
};

/* ---- search (⌘K), bell, client view, help ---- */
A.searchModal = () => {
  A.modal(`${A.modalH('Search anything')}
    <div class="modal-b">
      <input class="inp" id="srch" placeholder="Projects, tasks, documents, files, leads…" oninput="A.searchRun(this.value)">
      <div class="searchres" id="srchres" style="margin-top:10px"><div class="tiny mute" style="padding:6px 10px">Type to search across the whole studio.</div></div>
    </div>`);
  setTimeout(()=>$('#srch')?.focus(),0);
};
A.searchRun = q => {
  q = q.trim().toLowerCase(); const out = [];
  if (q) {
    S.db.projects.filter(p=>(p.name+' '+A.client(p.clientId).name).toLowerCase().includes(q)).slice(0,4)
      .forEach(p => out.push([`<span class="swatch" style="background:${p.color};width:8px;height:8px;border-radius:2px"></span>`, p.name, A.client(p.clientId).name, `A.go('p','${p.id}','overview')`]));
    S.db.tasks.filter(t=>t.title.toLowerCase().includes(q)).slice(0,4)
      .forEach(t => out.push([A.ic('kanban',13), t.title, 'Task · '+(A.proj(t.projectId)||{}).name, `A.go('p','${t.projectId}','production')`]));
    S.db.docs.filter(d=>d.title.toLowerCase().includes(q)).slice(0,3)
      .forEach(d => out.push([A.ic('doc',13), d.title, 'Document', `A.go('p','${d.projectId}','docs','${d.id}')`]));
    S.db.files.filter(f=>f.name.toLowerCase().includes(q)).slice(0,3)
      .forEach(f => out.push([A.ic('file',13), f.name, 'File · v'+f.versions.length, `A.go('p','${f.projectId}','delivery')`]));
    S.db.leads.filter(l=>(l.name+' '+l.contact).toLowerCase().includes(q)).slice(0,3)
      .forEach(l => out.push([A.ic('inbox',13), l.name, 'Lead · '+l.status, `A.go('leads')`]));
  }
  $('#srchres').innerHTML = out.length
    ? out.map(([ic,t,s,js]) => `<button onclick="A.closeModal();${js}">${ic}<span style="flex:1;min-width:0"><b style="font-size:13px">${A.h(t)}</b><span class="tiny mute" style="display:block">${A.h(s)}</span></span>${A.ic('arrow',12)}</button>`).join('')
    : `<div class="tiny mute" style="padding:6px 10px">${q?'Nothing matches “'+A.h(q)+'” yet.':'Type to search across the whole studio.'}</div>`;
};
document.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k' && !A.isClient()) { e.preventDefault(); A.searchModal(); }
});
A.bellMenu = ev => {
  S.notifSeen = true;
  const ns = S.db.notifications.slice(0,6);
  A.menuAt(ev.currentTarget, `<div class="mlab">Notifications</div>` +
    (ns.length ? ns.map(n=>`<button style="white-space:normal;line-height:1.4"><span style="color:var(--cobalt)">${A.ic('zap',12)}</span><span style="flex:1;font-size:12.5px">${A.h(n.text)}<span class="tiny mute" style="display:block">${A.ago(n.at)}</span></span></button>`).join('')
      : `<div class="tiny mute" style="padding:6px 10px 8px">You’re all caught up.</div>`));
  A.render && null;
};
A.clientView = () => {
  const pid = S.route.pid;
  const p = pid ? A.proj(pid) : null;
  const cu = p ? S.db.users.find(u=>u.role==='client' && u.clientId===p.clientId) : S.db.users.find(u=>u.role==='client');
  if (!cu) { A.toast('This client has no portal guest yet'); return; }
  A.switchUser(cu.id);
};
A.helpModal = () => {
  A.modal(`${A.modalH('Help & shortcuts')}
    <div class="modal-b">
