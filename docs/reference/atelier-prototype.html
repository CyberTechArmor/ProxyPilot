      ${[['⌘K','Search anything'],['/','Block menu, inside a document'],['Drag','Kanban cards, timeline bars, board items, form fields, doc blocks'],['⇧ + drag','Pan the concept board (one finger on touch)'],['⌘ + scroll','Zoom the board or timeline'],['Drag corner handle','Fill an estimate column down']]
        .map(([k,v])=>`<div class="rowflex" style="padding:7px 0;border-bottom:1px solid var(--hair)"><span class="kbd" style="min-width:86px;text-align:center">${k}</span><span class="small ink2">${v}</span></div>`).join('')}
      <div class="tiny mute" style="margin-top:12px">Switch roles from the avatar in the sidebar — including each client’s portal.</div>
    </div>`);
};

A.tabOverview = p => {
  const est = A.estFor(p.id); const tot = est ? A.estTotals(est) : null;
  const tasks = S.db.tasks.filter(t => t.projectId === p.id);
  const done = tasks.filter(t => t.status === 'done').length;
  const stageOwner = {inquiry:'Inquiry', brief:'Documents', concept:'Board', estimate:'Estimate', proposal:'Proposal', production:'Production', delivery:'Delivery', report:'Report'};
  const acts = S.db.activity.filter(a => a.projectId === p.id).slice(0,6);
  return `<div class="content-pad">
    ${A.head(A.h(A.client(p.clientId).name)+' · '+p.code, A.h(p.name), A.fmtD(p.start)+' → '+A.fmtD(p.due)+' — every stage has one owning screen.',
      p.team.map(u=>A.avatar(u)).join(' ')+
      `<button class="btn" onclick="A.go('p','${p.id}','${STAGE_TAB[p.stage]}')">${A.ic('arrow',14)} Go to ${stageOwner[p.stage]}</button>`)}
    <div class="statrow" style="border:1px solid var(--hair);border-radius:12px;background:var(--chrome);overflow:hidden">
      <div class="stat"><div class="k">Stage</div><div style="margin-top:7px">${A.stageChip(p.stage)}</div></div>
      <div class="stat"><div class="k">Budget</div><div class="v">${A.money(p.budget)}</div><div class="delta mute">${A.money(p.spent)} spent</div></div>
      <div class="stat"><div class="k">Margin (est.)</div><div class="v">${tot ? Math.round(tot.margin*100)+'%' : '—'}</div><div class="delta mute">${tot ? A.money(tot.sub)+' quoted' : 'no estimate yet'}</div></div>
      <div class="stat"><div class="k">Tasks</div><div class="v">${done}<span class="mute" style="font-size:17px">/${tasks.length}</span></div>
        <div class="progress" style="margin-top:8px;width:90px"><i style="width:${tasks.length?Math.round(done/tasks.length*100):0}%"></i></div></div>
    </div>
    <div class="sect"><h2 class="sec">The pipeline</h2>
      <div class="rowflex" style="gap:0;overflow-x:auto;padding-bottom:4px">
        ${A.STAGES.map((st,i) => { const idx = A.STAGES.indexOf(p.stage); const st8 = i<idx?'past':i===idx?'now':'next';
          return `<div style="display:flex;align-items:center">
            <div style="text-align:center;min-width:86px">
              <div style="width:11px;height:11px;border-radius:50%;margin:0 auto 5px;${st8==='past'?'background:var(--cobalt);opacity:.35':st8==='now'?'background:var(--cobalt);box-shadow:0 0 0 4px var(--cobalt-wash)':'border:1.5px solid var(--hair2)'}"></div>
              <div class="tiny ${st8==='now'?'':'mute'}" style="${st8==='now'?'color:var(--cobalt);font-weight:700':''}">${A.STAGE_LABEL[st]}</div></div>
            ${i<7?`<div style="width:26px;height:1px;background:var(--hair2);margin-bottom:16px"></div>`:''}</div>`; }).join('')}
      </div></div>
    <div class="sect"><div class="spread"><h2 class="sec">Recent activity</h2></div>
      ${acts.length ? acts.map(a=>`<div class="rowflex" style="padding:7px 0;border-bottom:1px solid var(--hair);font-size:13px"><span class="mute tiny" style="width:70px;flex:0 0 70px">${A.ago(a.at)}</span><b>${A.h(a.by)}</b> ${A.h(a.text)}</div>`).join('')
      : A.empty('◷','Quiet so far','Activity from documents, estimates and production will appear here.','Open production',`A.go('p','${p.id}','production')`)}
    </div></div>`;
};

/* ---- settings ---- */
A.scrSettings = () => `
  <div class="content-pad" style="max-width:760px">
    ${A.head('Studio / Settings', 'The numbers behind the numbers.', 'Rate card and studio defaults — every estimate’s margin computes from here.')}
    <h2 class="sec">Rate card</h2>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Role</th><th class="num">Bill rate /h</th><th class="num">Cost /h</th><th class="num">Margin</th></tr></thead>
    <tbody>${S.db.rateCard.map((r,i) => `<tr>
      <td>${A.h(r.role)}</td>
      <td class="num"><input class="inp" style="width:90px;text-align:right" value="${r.rate}" onchange="A.setRate(${i},'rate',this.value)"></td>
      <td class="num"><input class="inp" style="width:90px;text-align:right" value="${r.cost}" onchange="A.setRate(${i},'cost',this.value)"></td>
      <td class="num"><span class="chip ${r.rate&&(r.rate-r.cost)/r.rate>=.4?'ok':'warn'}">${r.rate?Math.round((r.rate-r.cost)/r.rate*100):0}%</span></td></tr>`).join('')}</tbody></table></div>
    <div class="hr"></div>
    <h2 class="sec">Studio</h2>
    <div class="field" style="max-width:320px"><label>Studio name</label><input class="inp" value="Atelier" onchange="A.toast('Saved')"></div>
    <div class="field" style="max-width:320px"><label>Default currency</label><select class="inp"><option>USD</option><option>EUR</option><option>GBP</option></select></div>
    <div class="field" style="max-width:320px"><label>Margin target (%)</label><input class="inp" type="number" value="${S.db.settings.marginTarget}" onchange="S.db.settings.marginTarget=+this.value||55;A.toast('Estimates now judge themselves against '+S.db.settings.marginTarget+'%');A.render()"></div>
  </div>`;
A.setRate = (i, k, v) => { S.db.rateCard[i][k] = +v || 0; A.toast('Rate card updated — margins recomputed'); A.render(); };

/* boot */
window.addEventListener('DOMContentLoaded', () => { parseRoute(); A.render(); });
</script>
<script>/* == src/02-forms.js == */
/* ============ intake forms + leads ============ */

const FIELD_TYPES = [
  ['text','Short text','―'], ['longtext','Long text','¶'], ['choice','Choice','◉'],
  ['budget','Budget range','$'], ['date','Date','▦'], ['file','File upload','⇪'],
];

A.scrForms = () => {
  const fs = S.db.forms;
  return `<div class="content-pad" style="max-width:860px">
    ${A.head('Studio / Forms', 'Forms that start the work.', 'Compose once, share the link — every submission lands as a structured lead.',
      `<button class="btn primary" onclick="A.newForm()">${A.ic('plus',13)} New form</button>`)}
    ${fs.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Form</th><th>Fields</th><th>Status</th><th>Submissions</th><th></th></tr></thead><tbody>
      ${fs.map(f => { const subs = S.db.leads.filter(l => l.formId === f.id).length; return `
      <tr class="rowlink" onclick="A.go('form','${f.id}')">
        <td><b>${A.h(f.name)}</b><div class="tiny mute">/${f.slug}</div></td>
        <td>${f.fields.length}</td>
        <td>${f.published ? A.chip('Live','ok') : A.chip('Draft','neutral')}</td>
        <td>${subs}</td>
        <td style="text-align:right"><button class="btn small" onclick="event.stopPropagation();A.copyFormLink('${f.id}')">${A.ic('link',13)} Copy link</button>
        <button class="btn small" onclick="event.stopPropagation();A.go('pub','${f.slug}')">${A.ic('eye',13)} Preview</button></td></tr>`; }).join('')}
    </tbody></table></div>` : A.empty('▤','No intake forms yet','Build your first inquiry form and put the link on your site.','Create a form','A.newForm()')}
  </div>`;
};
A.copyFormLink = id => { const f = S.db.forms.find(x=>x.id===id); A.toast(`Link copied — atelier.studio/f/${f.slug}`); };
A.newForm = () => {
  const f = {id:A.uid('f'), name:'Untitled form', slug:'form-'+Math.floor(Math.random()*900+100), published:false, intro:'', fields:[
    {id:A.uid('q'), type:'text', label:'Your name', required:true},
    {id:A.uid('q'), type:'text', label:'Email', required:true}]};
  S.db.forms.push(f); A.go('form', f.id);
};

/* ---- builder ---- */
let fbSel = null;
A.scrFormBuilder = id => {
  const f = S.db.forms.find(x => x.id === id);
  if (!f) return A.empty('?','Form not found','', 'All forms', "A.go('forms')");
  const sel = f.fields.find(x=>x.id===fbSel);
  return `<div class="content-pad">
    <div class="pagehead">
      <div><div class="eyebrow">Studio / Form builder</div><input class="inp bare" style="font-family:var(--serif);font-size:24px;width:340px;max-width:100%" value="${A.h(f.name)}" onchange="A.fbSet('${f.id}','name',this.value)">
        <div class="sub">Drag field types into the form. Click a field to configure it on the right.</div></div>
      <div class="actions">
        <span class="chip ${f.published?'ok':'neutral'}">${f.published?'Live':'Draft'}</span>
        <span class="tiny mute mono">atelier.studio/f/${f.slug}</span>
        <button class="btn" onclick="A.go('pub','${f.slug}')">${A.ic('eye',14)} Preview</button>
        <button class="btn ${f.published?'':'primary'}" onclick="A.fbSet('${f.id}','published',${!f.published})">${f.published?'Unpublish':'Publish'}</button>
        ${f.published?`<button class="btn primary" onclick="A.copyFormLink('${f.id}')">${A.ic('link',14)} Copy public link</button>`:''}
      </div></div>
    <div class="fbwrap">
      <div class="fbpal">
        <div class="lab2" style="margin-bottom:8px">Add a field</div>
        ${FIELD_TYPES.map(([t,l,g]) => `<div class="pi" draggable="true" ondragstart="A.fbPalDrag(event,'${t}')" onclick="A.fbAdd('${f.id}','${t}')">
          <span style="width:18px;text-align:center;color:var(--cobalt)">${g}</span>${l}</div>`).join('')}
        <div class="tiny mute" style="margin-top:10px;line-height:1.5">Drop into the form, or click to append.</div>
      </div>
      <div class="fbform" id="fbform" ondragover="A.fbFormOver(event)" ondrop="A.fbFormDrop(event,'${f.id}')">
        <div class="field"><textarea class="inp" placeholder="Intro text shown above the form…" onchange="A.fbSet('${f.id}','intro',this.value)">${A.h(f.intro)}</textarea></div>
        ${f.fields.length ? f.fields.map((fd,i) => A.fbFieldHtml(f,fd,i)).join('')
          : A.empty('▤','An empty form','Drag your first field in from the palette.','Add short text',`A.fbAdd('${f.id}','text')`)}
      </div>
      <div class="fbsettings">
        ${sel ? `
          <div class="lab2" style="margin-bottom:10px">Field settings</div>
          <div class="field"><label>Question</label><textarea class="inp" onchange="A.fbField('${f.id}','${sel.id}','label',this.value)">${A.h(sel.label)}</textarea></div>
          <div class="field"><label>Field type</label><select class="inp" onchange="A.fbType('${f.id}','${sel.id}',this.value)">
            ${FIELD_TYPES.map(([t,l])=>`<option value="${t}" ${sel.type===t?'selected':''}>${l}</option>`).join('')}</select></div>
          <label class="check" style="margin-bottom:12px"><input type="checkbox" ${sel.required?'checked':''} onchange="A.fbField('${f.id}','${sel.id}','required',this.checked)"><span><b>Required</b><span class="tiny mute" style="display:block">Respondent must answer</span></span></label>
          ${['choice','budget'].includes(sel.type)?`<div class="field"><label>Options (one per line)</label>
            <textarea class="inp" onchange="A.fbField('${f.id}','${sel.id}','options',this.value.split('\\n').filter(Boolean))">${(sel.options||[]).join('\n')}</textarea></div>`:''}
          <button class="btn small danger" onclick="A.fbDel('${f.id}','${sel.id}')">${A.ic('trash',13)} Remove field</button>`
        : `<div class="empty" style="padding:26px 6px"><div class="glyph">▢</div><div class="t">Select a field</div><div class="s">Choose any field to edit its prompt and rules.</div></div>`}
      </div>
    </div></div>`;
};
A.fbType = (fid, id, type) => { const f=S.db.forms.find(x=>x.id===fid); const fd=f.fields.find(x=>x.id===id);
  fd.type = type;
  if (['choice','budget'].includes(type) && !fd.options) fd.options = type==='budget'?['Under $10k','$10–25k','$25–50k','$50k+']:['Option one','Option two'];
  A.render(); };
A.fbFieldHtml = (f, fd, i) => `
  <div class="ffield ${fbSel===fd.id?'sel':''}" draggable="true" data-idx="${i}"
       ondragstart="A.fbFieldDrag(event,${i})" ondragover="A.fbFieldOver(event)" ondragleave="A.fbFieldLeave(event)" ondrop="A.fbFieldDrop(event,'${f.id}',${i})"
       onclick="A.fbSelect('${f.id}','${fd.id}')">
    <div class="flab"><span class="fnum">${String(i+1).padStart(2,'0')}</span>
      <span>${A.h(fd.label)}</span>${fd.required?'<span class="req">*</span>':''}
      <span class="chip tag" style="margin-left:auto">${(FIELD_TYPES.find(t=>t[0]===fd.type)||['','field'])[1]}</span>
      <span style="cursor:grab;color:var(--faint)">${A.ic('drag',13)}</span></div>
    ${A.fieldPreview(fd, true)}
  </div>`;
A.fieldPreview = (fd, disabled=false) => {
  const dis = disabled ? 'disabled' : '';
  switch(fd.type){
    case 'text': return `<input class="inp" ${dis} placeholder="Short answer" data-q="${A.h(fd.label)}">`;
    case 'longtext': return `<textarea class="inp" ${dis} placeholder="A few sentences…" data-q="${A.h(fd.label)}"></textarea>`;
    case 'choice': return `<select class="inp" ${dis} data-q="${A.h(fd.label)}"><option value="">Choose…</option>${(fd.options||[]).map(o=>`<option>${A.h(o)}</option>`).join('')}</select>`;
    case 'budget': return `<div class="budget-opts" data-q="${A.h(fd.label)}">${(fd.options||['Under $10k','$10–25k','$25k+']).map(o=>`<button type="button" class="budget-opt" ${dis} onclick="if(!this.disabled){[...this.parentNode.children].forEach(b=>b.classList.remove('on'));this.classList.add('on')}">${A.h(o)}</button>`).join('')}</div>`;
    case 'date': return `<input class="inp" type="date" ${dis} data-q="${A.h(fd.label)}" style="max-width:220px">`;
    case 'file': return `<div class="uploadbox" data-q="${A.h(fd.label)}" ${disabled?'':`onclick="this.dataset.file='brand-deck.pdf';this.innerHTML='📎 brand-deck.pdf attached'"`}>Drop a file or click to attach</div>`;
  }
  return '';
};
A.fbSet = (id,k,v) => { const f = S.db.forms.find(x=>x.id===id); f[k]=v;
  if(k==='published') A.toast(v?`Form is live — atelier.studio/f/${f.slug}`:'Form unpublished');
  A.render(); };
A.fbSelect = (fid, id) => { fbSel = fbSel===id ? null : id; A.render(); };
A.fbField = (fid, id, k, v) => { const f=S.db.forms.find(x=>x.id===fid); const fd=f.fields.find(x=>x.id===id); fd[k]=v; A.render(); };
A.fbDel = (fid, id) => { const f=S.db.forms.find(x=>x.id===fid); f.fields = f.fields.filter(x=>x.id!==id); fbSel=null; A.render(); };
A.fbAdd = (fid, type, at=null) => { const f=S.db.forms.find(x=>x.id===fid);
  const fd = {id:A.uid('q'), type, label:{text:'Short text question',longtext:'Tell us more',choice:'Pick one',budget:'Budget range',date:'Target date',file:'Upload a file'}[type], required:false,
    options: type==='choice'?['Option one','Option two']: type==='budget'?['Under $10k','$10–25k','$25–50k','$50k+']:undefined};
  if (at==null) f.fields.push(fd); else f.fields.splice(at,0,fd);
  fbSel = fd.id; A.render(); };

/* dnd */
let fbDragType = null, fbDragIdx = null;
A.fbPalDrag = (e, t) => { fbDragType = t; fbDragIdx = null; e.dataTransfer.effectAllowed='copy'; };
A.fbFieldDrag = (e, i) => { fbDragIdx = i; fbDragType = null; e.dataTransfer.effectAllowed='move'; e.stopPropagation(); };
A.fbFieldOver = e => { e.preventDefault(); e.stopPropagation(); const el = e.currentTarget; const r = el.getBoundingClientRect();
  el.classList.toggle('dragover-top', e.clientY < r.top + r.height/2);
  el.classList.toggle('dragover-bot', e.clientY >= r.top + r.height/2); };
A.fbFieldLeave = e => { e.currentTarget.classList.remove('dragover-top','dragover-bot'); };
A.fbFieldDrop = (e, fid, i) => { e.preventDefault(); e.stopPropagation();
  const before = e.currentTarget.classList.contains('dragover-top');
  e.currentTarget.classList.remove('dragover-top','dragover-bot');
  const f = S.db.forms.find(x=>x.id===fid); let at = before ? i : i+1;
  if (fbDragType) { A.fbAdd(fid, fbDragType, at); }
  else if (fbDragIdx != null) { const [m] = f.fields.splice(fbDragIdx,1); if (fbDragIdx < at) at--; f.fields.splice(at,0,m); A.render(); }
  fbDragType = fbDragIdx = null; };
A.fbFormOver = e => { e.preventDefault(); };
A.fbFormDrop = (e, fid) => { e.preventDefault(); if (fbDragType) A.fbAdd(fid, fbDragType); fbDragType = null; };

/* ---- public form ---- */
A.scrPublicForm = slug => {
  const f = S.db.forms.find(x => x.slug === slug) || S.db.forms[0];
  return `<div style="background:var(--wash);min-height:100%">
    <div class="pubform">
      <div class="tiny mute noprint" style="margin-bottom:10px"><button class="btn ghost small" onclick="A.go('form','${f.id}')">← Back to builder</button> · public view, as a visitor sees it</div>
      <div class="fcard" id="pubfields">
        <div class="wordmark" style="padding:0 0 4px"><b>Atelier</b><span class="dot"></span></div>
        <div class="serif" style="font-size:22px;margin:10px 0 6px">${A.h(f.name)}</div>
        ${f.intro?`<p class="ink2" style="margin-bottom:18px;font-size:13.5px">${A.h(f.intro)}</p>`:''}
        <div class="hr"></div>
        ${f.fields.map(fd => `<div class="field"><label>${A.h(fd.label)}${fd.required?' <span style="color:var(--bad)">*</span>':''}</label>${A.fieldPreview(fd,false)}</div>`).join('')}
        <button class="btn primary" style="width:100%;justify-content:center;padding:9px" onclick="A.submitPublicForm('${f.id}')">Send inquiry</button>
        <div class="tiny mute" style="text-align:center;margin-top:10px">We reply within two working days.</div>
      </div></div></div>`;
};
A.submitPublicForm = fid => {
  const f = S.db.forms.find(x=>x.id===fid);
  const answers = {}; let missing = null;
  $$('#pubfields [data-q]').forEach(el => {
    const q = el.dataset.q; let v = '';
    if (el.classList.contains('budget-opts')) v = el.querySelector('.on')?.textContent || '';
    else if (el.classList.contains('uploadbox')) v = el.dataset.file || '';
    else v = el.value || '';
    answers[q] = v;
    const fd = f.fields.find(x=>x.label===q);
    if (fd?.required && !v && !missing) missing = q;
  });
  if (missing) { A.toast(`“${missing}” is required`); return; }
  const lead = {id:A.uid('l'), formId:fid, name: answers['Company'] || answers['Your name'] || 'New inquiry',
    contact: answers['Your name'] || '—', email: answers['Email'] || '', status:'new', at:Date.now(), answers};
  S.db.leads.unshift(lead);
  A.runFlows('form_submitted', {lead, form:f});
  A.toast('Inquiry sent — thank you!');
  setTimeout(() => { A.go('leads'); }, 600);
};

/* ---- leads ---- */
A.scrLeads = () => {
  const ls = S.db.leads;
  return `<div class="content-pad" style="max-width:900px">
    ${A.head('Studio / Inquiries', 'Ask better questions first.', 'Submissions from your intake forms — convert the good ones into projects.',
      `<button class="btn" onclick="A.go('pub','${S.db.forms[0].slug}')">${A.ic('eye',14)} Try the public form</button>`)}
    ${ls.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Lead</th><th>Type</th><th>Budget</th><th>Received</th><th>Status</th><th></th></tr></thead><tbody>
      ${ls.map(l => `<tr class="rowlink" onclick="A.leadModal('${l.id}')">
        <td><b>${A.h(l.name)}</b><div class="tiny mute">${A.h(l.contact)} · ${A.h(l.email)}</div></td>
        <td class="small">${A.h(l.answers['What kind of work is this?']||'—')}</td>
        <td>${l.answers['Budget range']?A.chip(l.answers['Budget range'],'neutral',false):'—'}</td>
        <td class="small mute">${A.ago(l.at)}</td>
        <td>${l.status==='new'?A.chip('New','cobalt'):l.status==='contacted'?A.chip('Contacted','teal'):A.chip('Converted','ok')}</td>
        <td style="text-align:right">${l.status!=='converted'?`<button class="btn small primary" onclick="event.stopPropagation();A.convertLead('${l.id}')">Convert →</button>`:`<button class="btn small" onclick="event.stopPropagation();A.go('p','${l.projectId}','overview')">Open project</button>`}</td>
      </tr>`).join('')}</tbody></table></div>`
    : A.empty('◱','No inquiries yet','Publish an intake form and share the link — submissions appear here as leads.','Open form builder',"A.go('forms')")}
  </div>`;
};
A.leadModal = id => {
  const l = S.db.leads.find(x=>x.id===id);
  A.modal(`${A.modalH(A.h(l.name))}
    <div class="modal-b">
      <div class="rowflex" style="margin-bottom:14px">${l.status==='new'?A.chip('New','cobalt'):l.status==='contacted'?A.chip('Contacted','teal'):A.chip('Converted','ok')}
        <span class="tiny mute">via “${A.h((S.db.forms.find(f=>f.id===l.formId)||{}).name||'form')}” · ${A.ago(l.at)}</span></div>
      ${Object.entries(l.answers).filter(([,v])=>v).map(([q,v]) => `
        <div style="padding:9px 0;border-bottom:1px solid var(--hair)">
          <div class="lab2" style="margin-bottom:3px">${A.h(q)}</div>
          <div style="font-size:13.5px" class="serif">${A.h(v)}</div></div>`).join('')}
    </div>
    <div class="modal-f">
      ${l.status==='new'?`<button class="btn" onclick="A.leadStatus('${l.id}','contacted')">Mark contacted</button>`:''}
      ${l.status!=='converted'?`<button class="btn primary" onclick="A.convertLead('${l.id}')">Convert to project →</button>`
        :`<button class="btn primary" onclick="A.closeModal();A.go('p','${l.projectId}','overview')">Open project</button>`}
    </div>`);
};
A.leadStatus = (id, st) => { S.db.leads.find(x=>x.id===id).status = st; A.closeModal(); A.render(); };
A.convertLead = id => {
  const l = S.db.leads.find(x=>x.id===id);
  let client = S.db.clients.find(c => c.name === l.name);
  if (!client) { client = {id:A.uid('c'), name:l.name, contact:l.contact, email:l.email}; S.db.clients.push(client); }
  const budgetMap = {'Under $15k':12000,'$15–40k':28000,'$40–80k':60000,'$80k+':95000};
  const p = A.createProject({name: l.name + ' — ' + (l.answers['What kind of work is this?']||'New project'), clientId: client.id,
    budget: budgetMap[l.answers['Budget range']] || 20000, stage:'brief', silent:true});
  l.status = 'converted'; l.projectId = p.id;
  /* seed a brief doc pre-filled from the answers */
  S.db.docs.push({id:A.uid('d'), projectId:p.id, title:'Brief — '+l.name, kind:'Brief', share:'team', updated:Date.now(), blocks:[
    {id:A.uid('b'), type:'h1', text:'The brief'},
    {id:A.uid('b'), type:'callout', text:`From the inquiry: <b>${A.h(l.answers['Budget range']||'')}</b> · ${A.h(l.answers['What kind of work is this?']||'')}`},
    {id:A.uid('b'), type:'p', text:A.h(l.answers['Tell us about the project']||'')},
    {id:A.uid('b'), type:'h2', text:'What success looks like'},
    {id:A.uid('b'), type:'li', text:'…'},
  ]});
  A.closeModal(); A.logAct(`converted inquiry from ${l.name}`, p.id);
  A.toast(`Converted — brief seeded from the inquiry answers`);
  A.go('p', p.id, 'docs');
};
</script>
<script>/* == src/03-docs.js == */
/* ============ documents: block editor ============ */

const SHARE_LABEL = {private:'Private', team:'Team', client:'Shared with client'};
const SHARE_TONE = {private:'neutral', team:'teal', client:'client'};

A.tabDocs = (p, sub) => {
  if (sub) return A.docEditor(p, sub);
  const docs = S.db.docs.filter(d => d.projectId === p.id);
  return `<div class="content-pad" style="max-width:860px">
    ${A.head(A.h(p.name)+' / Brief', 'The thinking, written down.', 'Brief, direction, scope — living documents with share states.',
      `<button class="btn primary" onclick="A.newDoc('${p.id}')">${A.ic('plus',13)} New document</button>`)}
    ${docs.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Document</th><th>Kind</th><th>Visibility</th><th>Updated</th><th></th></tr></thead><tbody>
      ${docs.map(d => `<tr class="rowlink" onclick="A.go('p','${p.id}','docs','${d.id}')">
        <td><b class="serif" style="font-size:14.5px">${A.h(d.title)}</b></td>
        <td>${A.chip(d.kind,'neutral',false)}</td>
        <td>${A.chip(SHARE_LABEL[d.share], SHARE_TONE[d.share], false)}</td>
        <td class="small mute">${A.ago(d.updated)}</td>
        <td style="text-align:right">${A.commentBtn('doc', d.id, p.id, 'Doc · '+d.title)}</td></tr>`).join('')}
    </tbody></table></div>` : A.empty('¶','No documents yet','Start with the brief — it feeds the proposal later.','Write the brief',`A.newDoc('${p.id}')`)}
  </div>`;
};
A.newDoc = pid => {
  const d = {id:A.uid('d'), projectId:pid, title:'', kind:'Brief', share:'private', updated:Date.now(), blocks:[
    {id:A.uid('b'), type:'h1', text:'The brief'}, {id:A.uid('b'), type:'p', text:''}]};
  S.db.docs.push(d); A.go('p', pid, 'docs', d.id);
};

/* ---- editor ---- */
A.docEditor = (p, docId) => {
  const d = S.db.docs.find(x => x.id === docId);
  if (!d) return A.empty('?','Document not found','','All documents',`A.go('p','${p.id}','docs')`);
  A.onDraw(() => A.bindSelToolbar(docId));
  return `<div style="flex:1;overflow:auto;background:var(--chrome)" onclick="A.hideSlash(event)">
    <div style="position:sticky;top:0;z-index:30;background:var(--chrome);border-bottom:1px solid var(--hair);padding:9px 24px;display:flex;align-items:center;gap:9px" class="noprint">
      <button class="btn ghost small" onclick="A.go('p','${p.id}','docs')">← Documents</button>
      <span class="chip ${SHARE_TONE[d.share]}" style="cursor:pointer" onclick="A.shareMenu(event,'${d.id}')">${SHARE_LABEL[d.share]} ▾</span>
      <span class="tiny mute">Edited ${A.ago(d.updated)}</span>
      <span style="margin-left:auto" class="rowflex">${A.commentBtn('doc', d.id, p.id, 'Doc · '+d.title)}
        <span class="tiny mute">Type <span class="kbd">/</span> for blocks · select text for the toolbar</span></span>
    </div>
    <div class="doc" id="doc-${d.id}">
      <div class="doc-title" contenteditable="true" onblur="A.docTitle('${d.id}',this.textContent)">${A.h(d.title)}</div>
      <div class="tiny mute" style="margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--hair)">${A.h(d.kind)} · ${A.h(A.client(p.clientId).name)} · ${A.h(p.name)}</div>
      <div id="blocks-${d.id}">${d.blocks.map(b => A.blockHtml(d, b)).join('')}</div>
      <button class="btn ghost small" style="margin-top:14px;margin-left:28px" onclick="A.blkAdd('${d.id}',null,'p')">${A.ic('plus',12)} Add block</button>
    </div></div>`;
};
A.shareMenu = (ev, docId) => { ev.stopPropagation();
  A.menuAt(ev.currentTarget, ['private','team','client'].map(s =>
    `<button onclick="A.docShare('${docId}','${s}')"><span class="chip ${SHARE_TONE[s]}" style="pointer-events:none">${SHARE_LABEL[s]}</span></button>`).join('') +
    `<div class="mhr"></div><div class="tiny mute" style="padding:4px 10px 6px;line-height:1.5">Client-shared documents appear in the portal, read-only, comments on.</div>`);
};
A.docShare = (docId, s) => { const d = S.db.docs.find(x=>x.id===docId); d.share = s; d.updated = Date.now(); A.closeMenu();
  A.toast(s==='client' ? 'Shared to the client portal' : 'Visibility: '+SHARE_LABEL[s]); A.render(); };
A.docTitle = (docId, t) => { const d = S.db.docs.find(x=>x.id===docId); d.title = t.trim(); d.updated = Date.now(); };

A.blockHtml = (d, b) => {
  const ce = `contenteditable="true" oninput="A.blkTyped(event,'${d.id}','${b.id}')" onblur="A.blkSave('${d.id}','${b.id}',this.innerHTML)" onkeydown="A.blkKey(event,'${d.id}','${b.id}')"`;
  let inner = '';
  switch(b.type){
    case 'h1': inner = `<div class="blk-h1" ${ce} data-ph="Heading">${b.text}</div>`; break;
    case 'h2': inner = `<div class="blk-h2" ${ce} data-ph="Subheading">${b.text}</div>`; break;
    case 'li': inner = `<div class="blk-li"><div ${ce} data-ph="List item">${b.text}</div></div>`; break;
    case 'callout': inner = `<div class="blk-callout" ${ce} data-ph="Something worth a box">${b.text}</div>`; break;
    case 'quote': inner = `<div class="blk-quote" ${ce} data-ph="A line worth quoting">${b.text}</div>`; break;
    case 'img': inner = `<div class="blk-img"><img src="${b.src}" alt=""><div class="cap" ${ce} data-ph="Caption">${b.cap||''}</div></div>`; break;
    case 'div': inner = `<div class="blk-div"></div>`; break;
    default: inner = `<div class="blk-p" ${ce} data-ph="Write, or type / for blocks…">${b.text}</div>`;
  }
  return `<div class="blk" data-bid="${b.id}"
    ondragover="A.blkOver(event)" ondragleave="A.blkLeave(event)" ondrop="A.blkDrop(event,'${d.id}','${b.id}')">
    <span class="bh" draggable="true" ondragstart="A.blkDrag(event,'${b.id}')" onclick="A.blkMenu(event,'${d.id}','${b.id}')" title="Drag to reorder · click for options">${A.ic('drag',13)}</span>
    <span style="position:absolute;right:-6px;top:4px">${A.commentBtn('block', b.id, d.projectId, 'Doc block')}</span>
    ${inner}</div>`;
};
A.blkSave = (docId, bid, html) => { const d = S.db.docs.find(x=>x.id===docId); const b = d.blocks.find(x=>x.id===bid);
  if (!b) return;
  if (b.type === 'img') b.cap = html; else b.text = html;
  d.updated = Date.now(); };
A.blkKey = (e, docId, bid) => {
  const d = S.db.docs.find(x=>x.id===docId);
  const i = d.blocks.findIndex(x=>x.id===bid);
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); A.blkSave(docId,bid,e.target.innerHTML);
    const t = d.blocks[i].type; A.blkAdd(docId, i+1, t==='li'?'li':'p'); }
  else if (e.key === 'Backspace' && e.target.textContent === '' && d.blocks.length > 1) {
    e.preventDefault(); d.blocks.splice(i,1); A.render();
    A.onDraw(()=>{}); const prev = d.blocks[Math.max(0,i-1)];
    setTimeout(() => { const el = document.querySelector(`[data-bid="${prev.id}"] [contenteditable]`); if (el){ el.focus(); placeCaretEnd(el); } }, 0); }
  else if (e.key === 'Escape') A.hideSlash();
};
function placeCaretEnd(el){ const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
A.blkAdd = (docId, at, type) => { const d = S.db.docs.find(x=>x.id===docId);
  const b = {id:A.uid('b'), type, text:''};
  if (type === 'img') { b.src = A.art('doc'+Math.floor(Math.random()*999), 680, 360); b.cap=''; }
  if (at == null) at = d.blocks.length;
  d.blocks.splice(at, 0, b); d.updated = Date.now(); A.render();
  setTimeout(() => { const el = document.querySelector(`[data-bid="${b.id}"] [contenteditable]`); if (el){ el.focus(); } }, 0);
};

/* slash menu */
const SLASH = [['p','Paragraph','¶'],['h1','Heading','H1'],['h2','Subheading','H2'],['li','List item','—'],['callout','Callout','◧'],['quote','Quote','❝'],['img','Image','▣'],['div','Divider','―']];
A.blkTyped = (e, docId, bid) => {
  const t = e.target.textContent;
  if (t.startsWith('/')) A.showSlash(e.target, docId, bid, t.slice(1).toLowerCase());
  else A.hideSlash();
};
A.showSlash = (el, docId, bid, q) => {
  A.hideSlash();
  const opts = SLASH.filter(([k,l]) => !q || l.toLowerCase().includes(q) || k.startsWith(q));
  if (!opts.length) return;
  const r = el.getBoundingClientRect();
  const m = document.createElement('div'); m.className = 'menu slashmenu'; m.id = 'slashmenu';
  m.style.top = (r.bottom + 4) + 'px'; m.style.left = r.left + 'px';
  m.innerHTML = `<div class="mlab">Turn into</div>` + opts.map(([k,l,g]) =>
    `<button onmousedown="event.preventDefault();A.slashPick('${docId}','${bid}','${k}')"><span style="width:20px;color:var(--cobalt);font-size:11px;font-weight:700">${g}</span>${l}</button>`).join('');
  document.body.appendChild(m);
};
A.hideSlash = () => { $('#slashmenu')?.remove(); };
A.slashPick = (docId, bid, type) => {
  const d = S.db.docs.find(x=>x.id===docId); const b = d.blocks.find(x=>x.id===bid);
  b.type = type; b.text = '';
  if (type === 'img') { b.src = A.art('doc'+Math.floor(Math.random()*999), 680, 360); b.cap = ''; }
  A.hideSlash(); A.render();
  setTimeout(() => { const el = document.querySelector(`[data-bid="${bid}"] [contenteditable]`); if (el) el.focus(); }, 0);
};

/* block drag reorder */
let blkDragId = null;
A.blkDrag = (e, bid) => { blkDragId = bid; e.dataTransfer.effectAllowed = 'move';
  const blk = e.target.closest('.blk'); e.dataTransfer.setDragImage(blk, 10, 10); };
A.blkOver = e => { if (!blkDragId) return; e.preventDefault(); const el = e.currentTarget; const r = el.getBoundingClientRect();
  el.classList.toggle('dragover-top', e.clientY < r.top + r.height/2);
  el.classList.toggle('dragover-bot', e.clientY >= r.top + r.height/2); };
A.blkLeave = e => e.currentTarget.classList.remove('dragover-top','dragover-bot');
A.blkDrop = (e, docId, targetBid) => { e.preventDefault();
  const before = e.currentTarget.classList.contains('dragover-top');
  e.currentTarget.classList.remove('dragover-top','dragover-bot');
  if (!blkDragId || blkDragId === targetBid) return;
  const d = S.db.docs.find(x=>x.id===docId);
  const from = d.blocks.findIndex(x=>x.id===blkDragId);
  const [m] = d.blocks.splice(from,1);
  let to = d.blocks.findIndex(x=>x.id===targetBid); if (!before) to++;
  d.blocks.splice(to,0,m); d.updated = Date.now(); blkDragId = null; A.render();
};
A.blkMenu = (ev, docId, bid) => { ev.stopPropagation();
  A.menuAt(ev.currentTarget, `<div class="mlab">Block</div>` +
    SLASH.map(([k,l,g]) => `<button onclick="A.slashPick('${docId}','${bid}','${k}')"><span style="width:18px;color:var(--cobalt);font-size:10px;font-weight:700">${g}</span>${l}</button>`).join('') +
    `<div class="mhr"></div><button onclick="A.blkRemove('${docId}','${bid}')" style="color:var(--bad)">${A.ic('trash',13)} Delete block</button>`);
};
A.blkRemove = (docId, bid) => { const d = S.db.docs.find(x=>x.id===docId);
  d.blocks = d.blocks.filter(x=>x.id!==bid); A.closeMenu(); A.render(); };

/* floating selection micro-toolbar */
A.bindSelToolbar = docId => {
  const wrap = $('#doc-'+docId); if (!wrap) return;
  wrap.addEventListener('mouseup', () => setTimeout(() => {
    $('#seltb')?.remove();
    const sel = getSelection();
    if (!sel.rangeCount || sel.isCollapsed) return;
    const range = sel.getRangeAt(0);
    if (!wrap.contains(range.commonAncestorContainer)) return;
    const r = range.getBoundingClientRect(); if (!r.width) return;
    const tb = document.createElement('div'); tb.className = 'mtb'; tb.id = 'seltb';
    tb.style.top = (r.top + window.scrollY - 42) + 'px';
    tb.style.left = Math.max(8, r.left + r.width/2 - 80) + 'px';
    tb.innerHTML = `
      <button title="Bold" onmousedown="event.preventDefault();document.execCommand('bold')"><b>B</b></button>
      <button title="Italic" onmousedown="event.preventDefault();document.execCommand('italic')"><i>I</i></button>
      <button title="Strike" onmousedown="event.preventDefault();document.execCommand('strikeThrough')"><s>S</s></button>
      <span class="div"></span>
      <button title="Comment on selection" onmousedown="event.preventDefault()" onclick="A.commentOnSelection('${docId}')">${A.ic('chat',13)}</button>`;
    document.body.appendChild(tb);
  }, 10));
  wrap.addEventListener('mousedown', () => $('#seltb')?.remove());
};
A.commentOnSelection = docId => {
  const sel = getSelection(); const txt = sel.toString().slice(0, 60);
  const blkEl = sel.anchorNode?.parentElement?.closest('.blk');
  $('#seltb')?.remove();
  const d = S.db.docs.find(x=>x.id===docId);
  A.openThreadComposer('block', blkEl?.dataset.bid || d.blocks[0].id, d.projectId, '“'+txt+'…”');
};
</script>
<script>/* == src/04-estimate.js == */
/* ============ estimate: spreadsheet grid ============ */

let eSel = null; /* {estId, lineId, col} */
const ECOLS = ['phase','role','desc','rate','qty'];

A.tabEstimate = p => {
  let est = A.estFor(p.id);
  if (!est) return `<div class="content-pad">${A.empty('▦','No estimate yet','Line items price from your rate card; margin computes live as you type.','Start the estimate',`A.newEstimate('${p.id}')`)}</div>`;
  const t = A.estTotals(est);
  const phases = [...new Set(est.lines.map(l => l.phase))];
  const locked = !!est.locked;
  const target = S.db.settings.marginTarget || 55;
  const marginPct = Math.round(t.margin*100);
  const contingency = Math.round(t.sub * .05);
  return `<div class="content-pad" style="max-width:1120px">
    ${A.head(A.h(p.name)+' / Estimate', 'Scope, priced with clarity.', 'Rates come from the studio card — margin updates while the estimate changes.',
      locked?`<span class="lockbanner">${A.ic('lock',13)} Locked with signed proposal rev ${(S.db.proposals.find(x=>x.projectId===p.id)||{}).rev||''}</span>`
        :`<button class="btn" onclick="A.go('settings')">${A.ic('gear',14)} Rate card</button>
          <button class="btn" onclick="A.estAddLine('${est.id}')">${A.ic('plus',13)} Add line</button>
          <button class="btn primary" onclick="A.go('p','${p.id}','proposal')">Add to proposal →</button>`)}
    <div class="raillay">
    <div class="railmain">
    <div class="egridwrap" style="max-height:60vh">
      <table class="egrid" id="egrid">
        <thead><tr><th style="width:34px"></th><th style="width:120px">Phase</th><th style="width:150px">Role</th><th>Description</th>
          <th style="width:90px;text-align:right">Rate</th><th style="width:70px;text-align:right">Hours</th><th style="width:110px;text-align:right">Subtotal</th><th style="width:70px"></th></tr></thead>
        <tbody>
          ${est.lines.map((l,ri) => `<tr data-line="${l.id}">
            <td class="rowidx"><div class="cellin" style="justify-content:center">${ri+1}</div></td>
            ${A.eCell(est,l,'phase',locked)}${A.eCell(est,l,'role',locked)}${A.eCell(est,l,'desc',locked)}${A.eCell(est,l,'rate',locked)}${A.eCell(est,l,'qty',locked)}
            <td class="num"><div class="cellin"><b>${A.money((l.rate||0)*(l.qty||0), est.currency)}</b></div></td>
            <td><div class="cellin" style="gap:4px;justify-content:flex-end">${A.commentBtn('estrow', l.id, p.id, 'Estimate · '+(l.desc||l.role))}
              ${locked?'':`<button class="del iconbtn" onclick="A.estDelLine('${est.id}','${l.id}')">${A.ic('trash',13)}</button>`}</div></td>
          </tr>`).join('')}
          ${!est.lines.length ? `<tr><td colspan="8">${A.empty('▦','Empty sheet','Add the first line item to start pricing.','Add line',`A.estAddLine('${est.id}')`)}</td></tr>`:''}
        </tbody>
        <tfoot><tr>
          <td colspan="4"><div class="cellin"><span class="lab2">Totals</span></div></td>
          <td class="num"><div class="cellin mute small">${est.lines.reduce((n,l)=>n+(+l.qty||0),0)} h</div></td>
          <td class="num" colspan="2"><div class="cellin" style="font-size:15px"><b>${A.money(t.sub, est.currency)}</b></div></td><td></td>
        </tr></tfoot>
      </table>
    </div>
    </div>
    <div class="rail">
      <div class="lab2" style="margin-bottom:6px">Estimate summary</div>
      <div class="rline"><span>Fees</span><strong>${A.money(t.sub, est.currency)}</strong></div>
      <div class="rline"><span>Contingency · 5%</span><strong>${A.money(contingency, est.currency)}</strong></div>
      <div class="rline"><span>Internal cost</span><strong class="mute">${A.money(t.cost, est.currency)}</strong></div>
      <div class="rtotal"><span class="lab2">Total</span><strong>${A.money(t.sub + contingency, est.currency)}</strong></div>
      <div style="margin-top:10px">
        <div class="spread small"><b>Margin</b><b class="mono">${marginPct}%</b></div>
        <div class="marginbar" style="margin-top:6px"><i style="width:${A.clamp(marginPct,0,100)}%;${marginPct<target?'background:var(--warn)':''}"></i></div>
        <div class="tiny mute" style="margin-top:4px">Studio target: ${target}%</div>
      </div>
      <div class="healthnote ${marginPct>=target?'good':'low'}">
        ${marginPct>=target?A.ic('check',13):'⚠'} <span><b>${marginPct>=target?'Healthy estimate':'Below target'}</b> — ${Math.abs(marginPct-target).toFixed(0)} pts ${marginPct>=target?'above':'under'}.</span></div>
      <div class="hr" style="margin:14px 0"></div>
      <div class="lab2" style="margin-bottom:6px">By phase</div>
      ${phases.map(ph => { const sub = est.lines.filter(l=>l.phase===ph).reduce((n,l)=>n+(l.rate||0)*(l.qty||0),0);
        return `<div class="rowflex" style="padding:4px 0;font-size:12.5px">
          <span class="phasedot" style="background:${A.PHASE_COLOR[ph]||'#999'}"></span><span style="flex:1">${A.h(ph)}</span>
          <span class="mono">${A.money(sub, est.currency)}</span>
          <span class="mute tiny" style="width:34px;text-align:right">${t.sub?Math.round(sub/t.sub*100):0}%</span></div>`; }).join('')}
      <div class="tiny mute" style="margin-top:10px">${A.money(t.sub - t.cost)} margin on real rate-card cost — not a guess.</div>
    </div>
    </div></div>`;
};

A.newEstimate = pid => {
  const e = {id:A.uid('e'), projectId:pid, currency:'USD', tax:0, lines:[]};
  S.db.estimates.push(e); A.estAddLine(e.id);
};
A.estAddLine = estId => {
  const e = S.db.estimates.find(x=>x.id===estId);
  const role = S.db.rateCard[1].role;
  e.lines.push({id:A.uid('el'), phase:'Discovery', role, desc:'', rate:A.rateFor(role), qty:8});
  A.render();
};
A.estDelLine = (estId, lid) => { const e = S.db.estimates.find(x=>x.id===estId);
  e.lines = e.lines.filter(l=>l.id!==lid); A.render(); };

A.eCell = (est, l, col, locked) => {
  const isNum = ['rate','qty'].includes(col);
  const sel = eSel && eSel.estId===est.id && eSel.lineId===l.id && eSel.col===col;
  const base = `data-cell="${l.id}:${col}" class="${isNum?'num ':''}${sel?'sel':''}" onclick="A.eSelect('${est.id}','${l.id}','${col}')"`;
  if (locked) return `<td ${base}><div class="cellin">${isNum ? (col==='rate'?A.money(l[col],est.currency):l[col]) : A.h(l[col])}</div></td>`;
  let inner;
  if (col === 'phase') inner = `<select class="cellinp" onchange="A.eSet('${est.id}','${l.id}','phase',this.value)">${A.PHASES.map(ph=>`<option ${l.phase===ph?'selected':''}>${ph}</option>`).join('')}</select>`;
  else if (col === 'role') inner = `<select class="cellinp" onchange="A.eSetRole('${est.id}','${l.id}',this.value)">${S.db.rateCard.map(r=>`<option ${l.role===r.role?'selected':''}>${A.h(r.role)}</option>`).join('')}</select>`;
  else if (col === 'desc') inner = `<input class="cellinp" value="${A.h(l.desc)}" placeholder="What’s the work?" onchange="A.eSet('${est.id}','${l.id}','desc',this.value)">`;
  else if (col === 'rate') inner = `<span style="display:flex;align-items:center;padding-left:12px"><span class="mute" style="font-size:11.5px">$</span><input class="cellinp" style="text-align:right;padding-left:2px" value="${l.rate??''}" onchange="A.eSet('${est.id}','${l.id}','rate',+this.value||0)"></span>`;
  else inner = `<input class="cellinp" style="text-align:right" value="${l[col]??''}" onchange="A.eSet('${est.id}','${l.id}','${col}',+this.value||0)">`;
  return `<td ${base}>${inner}${sel && isNum ? `<span class="fillh" title="Drag to fill down" onmousedown="A.eFillStart(event,'${est.id}','${l.id}','${col}')"></span>`:''}</td>`;
};
A.eSelect = (estId, lineId, col) => {
  if (eSel && eSel.lineId===lineId && eSel.col===col) return;
  eSel = {estId, lineId, col};
  $$('#egrid td.sel').forEach(td => { td.classList.remove('sel'); td.querySelector('.fillh')?.remove(); });
  const td = document.querySelector(`[data-cell="${lineId}:${col}"]`);
  if (td) { td.classList.add('sel');
    if (['rate','qty'].includes(col)) { const h = document.createElement('span'); h.className='fillh'; h.title='Drag to fill down';
      h.onmousedown = e => A.eFillStart(e, estId, lineId, col); td.appendChild(h); } }
};
A.eSet = (estId, lineId, col, v) => { const e = S.db.estimates.find(x=>x.id===estId);
  const l = e.lines.find(x=>x.id===lineId); l[col] = v; A.render(); };
A.eSetRole = (estId, lineId, role) => { const e = S.db.estimates.find(x=>x.id===estId);
  const l = e.lines.find(x=>x.id===lineId); l.role = role; l.rate = A.rateFor(role);
  A.toast(`Rate set from card — ${A.money(l.rate)}/h`); A.render(); };

/* drag-fill */
A.eFillStart = (ev, estId, lineId, col) => {
  ev.preventDefault(); ev.stopPropagation();
  const e = S.db.estimates.find(x=>x.id===estId);
  const srcIdx = e.lines.findIndex(l=>l.id===lineId);
  const srcVal = e.lines[srcIdx][col];
  const rows = $$('#egrid tbody tr[data-line]');
  let lastIdx = srcIdx;
  const move = mv => {
    let idx = srcIdx;
    rows.forEach((tr,i) => { const r = tr.getBoundingClientRect(); if (mv.clientY > r.top) idx = i; });
    idx = Math.max(idx, srcIdx);
    rows.forEach((tr,i) => { const td = tr.querySelector(`[data-cell$=":${col}"]`);
      td?.classList.toggle('infill', i > srcIdx && i <= idx); });
    lastIdx = idx;
  };
  const up = () => {
    document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
    if (lastIdx > srcIdx) {
      for (let i = srcIdx+1; i <= lastIdx; i++) e.lines[i][col] = srcVal;
      A.toast(`Filled ${col === 'qty' ? 'hours' : 'rate'} down ${lastIdx-srcIdx} rows`);
    }
    A.render();
  };
  document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
};
</script>
<script>/* == src/05-proposal.js == */
/* ============ proposal: print layout + e-signature ============ */

A.propFor = pid => S.db.proposals.find(x => x.projectId === pid);

A.tabProposal = p => {
  const pr = A.propFor(p.id);
  if (!pr) return `<div class="content-pad">${A.empty('§','No proposal yet','Assemble brief excerpts, a board and the estimate into a signed-ready document.','Assemble proposal',`A.newProposal('${p.id}')`)}</div>`;
  const est = S.db.estimates.find(e => e.id === pr.sections.estimateId);
  const statusChip = pr.status==='signed' ? A.chip('Signed · rev '+pr.rev+' locked','ok') : pr.status==='sent' ? A.chip('Sent — awaiting signature','cobalt') : A.chip('Draft rev '+pr.rev,'neutral');
  return `<div class="content-wide">
    <div class="noprint" style="padding:12px 34px;border-bottom:1px solid var(--hair);background:var(--chrome);display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      ${statusChip}
      <span class="tiny mute">${pr.status==='signed' ? 'Signed revisions are immutable — duplicate to make changes.' : 'Warm paper below is exactly what prints.'}</span>
      <span style="margin-left:auto" class="rowflex">
        ${A.commentBtn('proposal', pr.id, p.id, 'Proposal')}
        ${pr.status==='draft' ? `<button class="btn" onclick="A.propSectionsModal('${pr.id}')">${A.ic('gear',14)} Sections</button>
          <button class="btn primary" onclick="A.sendProposal('${pr.id}')">${A.ic('send',14)} Send for signature</button>` : ''}
        ${pr.status==='sent' ? `<button class="btn" onclick="A.propAuditModal('${pr.id}')">${A.ic('clock',14)} Audit trail</button>
          <button class="btn primary" onclick="A.toast('Reminder sent to '+${JSON.stringify('client')})">Remind client</button>` : ''}
        ${pr.status==='signed' ? `<button class="btn" onclick="A.propAuditModal('${pr.id}')">${A.ic('clock',14)} Audit trail</button>` : ''}
        <button class="btn" onclick="window.print()">${A.ic('print',14)} Export PDF</button>
      </span>
    </div>
    <div style="flex:1;display:flex;min-height:0">
      <div class="noprint propoutline" style="width:200px;flex:0 0 200px;border-right:1px solid var(--hair);background:var(--chrome);padding:16px 14px;overflow-y:auto">
        <div class="lab2" style="margin-bottom:8px">Proposal pages</div>
        ${A.propOutline(pr).map((pg,i) => `<button class="outline-item" onclick="document.querySelectorAll('#printarea .page')[${i}]?.scrollIntoView({behavior:'smooth',block:'start'})">
          <span class="n">${i+1}</span><span style="flex:1">${pg}</span>${pg==='Terms & signature'&&pr.status==='signed'?`<span style="color:var(--ok)">${A.ic('check',12)}</span>`:''}</button>`).join('')}
        <div class="hr" style="margin:12px 0"></div>
        <div class="tiny mute" style="line-height:1.55">Pages assemble from the live brief, board and estimate — ${pr.status==='signed'?'frozen at signature.':'edit those and the proposal follows.'}</div>
      </div>
      <div class="paperbg" style="flex:1"><div id="printarea">${A.proposalPages(pr)}</div></div>
    </div>
  </div>`;
};
A.propOutline = pr => {
  const out = ['Cover','Contents'];
  if (pr.sections.docId) out.push('The brief');
  if (pr.sections.boardId) out.push('Selected direction');
  if (pr.sections.estimateId) out.push('Investment');
  out.push('Terms & signature');
  return out;
};

A.newProposal = pid => {
  const doc = S.db.docs.find(d => d.projectId === pid && d.kind === 'Brief');
  const board = S.db.boards.find(b => b.projectId === pid);
  const est = A.estFor(pid);
  const pr = {id:A.uid('pr'), projectId:pid, title:'Proposal', status:'draft', rev:1, sentAt:null,
    sections:{coverNote:'Prepared with care by Atelier.', docId:doc?.id||null, boardId:board?.id||null, estimateId:est?.id||null,
      terms:'Fifty percent on signature, balance on delivery. Three revision rounds per phase. Quote valid 30 days.'},
    signature:null, audit:[{at:Date.now(), ev:'Revision 1 drafted', by:A.me().name}]};
  S.db.proposals.push(pr); A.logAct('drafted proposal rev 1', pid); A.render();
};

A.propSectionsModal = prId => {
  const pr = S.db.proposals.find(x=>x.id===prId); const pid = pr.projectId;
  A.modal(`${A.modalH('Proposal sections')}
    <div class="modal-b">
      <div class="field"><label>Cover note</label><textarea class="inp" id="ps-note">${A.h(pr.sections.coverNote)}</textarea></div>
      <div class="field"><label>Brief excerpt</label><select class="inp" id="ps-doc"><option value="">— none —</option>
        ${S.db.docs.filter(d=>d.projectId===pid).map(d=>`<option value="${d.id}" ${pr.sections.docId===d.id?'selected':''}>${A.h(d.title)}</option>`).join('')}</select></div>
      <div class="field"><label>Board</label><select class="inp" id="ps-board"><option value="">— none —</option>
        ${S.db.boards.filter(b=>b.projectId===pid).map(b=>`<option value="${b.id}" ${pr.sections.boardId===b.id?'selected':''}>${A.h(b.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Terms</label><textarea class="inp" id="ps-terms">${A.h(pr.sections.terms)}</textarea></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="A.closeModal()">Cancel</button>
      <button class="btn primary" onclick="A.propSaveSections('${prId}')">Save</button></div>`);
};
A.propSaveSections = prId => { const pr = S.db.proposals.find(x=>x.id===prId);
  pr.sections.coverNote = $('#ps-note').value; pr.sections.docId = $('#ps-doc').value||null;
  pr.sections.boardId = $('#ps-board').value||null; pr.sections.terms = $('#ps-terms').value;
  A.closeModal(); A.render(); };

A.sendProposal = prId => { const pr = S.db.proposals.find(x=>x.id===prId);
  const p = A.proj(pr.projectId); const c = A.client(p.clientId);
  pr.status = 'sent'; pr.sentAt = Date.now();
  pr.audit.push({at:Date.now(), ev:`Sent to ${c.email}`, by:A.me().name});
  if (p.stage !== 'proposal' && A.STAGES.indexOf(p.stage) < A.STAGES.indexOf('proposal')) p.stage = 'proposal';
  A.logAct('sent proposal for signature', p.id);
  A.toast(`Sent — ${c.contact} can now sign in the portal`); A.render();
};

/* ---- the pages ---- */
A.proposalPages = (pr, forPortal=false) => {
  const p = A.proj(pr.projectId); const c = A.client(p.clientId);
  const doc = S.db.docs.find(d => d.id === pr.sections.docId);
  const board = S.db.boards.find(b => b.id === pr.sections.boardId);
  const est = S.db.estimates.find(e => e.id === pr.sections.estimateId);
  const t = est ? A.estTotals(est) : null;
  const dateStr = new Date(pr.sentAt || Date.now()).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
  const run = title => `<div class="runhead"><span>Atelier — ${A.h(p.name)}</span><span>${A.h(title)}</span></div>`;
  let pn = 1; const pnum = () => `<div class="pnum">${String(pn++).padStart(2,'0')}</div>`;
  const toc = [['The brief','02'],['Selected direction','03'],['Investment','0'+(board?4:3)],['Terms & signature','0'+(board?5:4)]].filter(([t2])=> (t2!=='Selected direction'||board)&&(t2!=='The brief'||doc));
  return `
  <div class="page">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-size:15px">Atelier<span style="color:var(--cobalt)"> ●</span></div><div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9b968a">Proposal · Rev ${pr.rev}</div></div>
    <div class="coverspacer">
      <div style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9b968a;margin-bottom:16px">Prepared for ${A.h(c.name)}</div>
      <h1>${A.h(p.name)}</h1>
      <p style="font-size:15px;margin-top:20px;max-width:420px;color:#4c483e">${A.h(pr.sections.coverNote)}</p>
    </div>
    <div class="coverfoot"><span>${dateStr}</span><span>${A.h(c.contact)} · ${A.h(c.email)}</span><span>atelier.studio</span></div>
    ${pnum()}
  </div>
  <div class="page">${run('Contents')}
    <h2 style="margin-top:20px">Contents</h2>
    ${toc.map(([t2,n],i) => `<div class="toc-row"><span style="width:26px;color:#9b968a">${String(i+2).padStart(2,'0')}</span><span>${t2}</span><span class="dots"></span><span>${n}</span></div>`).join('')}
    <p style="margin-top:34px;font-size:13px;color:#6f6a5c">This document assembles the working brief, the selected creative direction and the investment into one record. On signature, this revision is locked and the project moves into production.</p>
    ${pnum()}
  </div>
  ${doc ? `<div class="page">${run('The brief')}
    <h2 style="margin-top:20px">The brief</h2>
    ${doc.blocks.slice(0, 9).map(b => {
      if (b.type==='h1') return '';
      if (b.type==='h2') return `<h2 style="border:0;font-size:17px;margin:18px 0 6px;padding:0">${b.text}</h2>`;

    ${pnum()}
  </div>`:''}
  ${board ? `<div class="page">${run('Direction')}
    <h2 style="margin-top:20px">Selected direction</h2>
    <p style="color:#6f6a5c">From the concept board “${A.h(board.name)}” — the route the work will follow.</p>

    </div>

    ${pnum()}

  ${est ? `<div class="page">${run('Investment')}
    <h2 style="margin-top:20px">Investment</h2>
    <table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px">

        <th style="text-align:right;padding:8px 0;font-weight:400;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#9b968a">Hours</th>
        <th style="text-align:right;padding:8px 0;font-weight:400;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#9b968a">Amount</th></tr></thead>
      <tbody>${[...new Set(est.lines.map(l=>l.phase))].map(ph => {
        const rows = est.lines.filter(l=>l.phase===ph);
        return `<tr><td colspan="3" style="padding:12px 0 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9b968a">${ph}</td></tr>` +
          rows.map(l => `<tr style="border-bottom:1px solid #eae6db"><td style="padding:7px 0">${A.h(l.desc||l.role)}</td>
            <td style="text-align:right;padding:7px 0">${l.qty}</td>
            <td style="text-align:right;padding:7px 0">${A.money((l.rate||0)*(l.qty||0), est.currency)}</td></tr>`).join(''); }).join('')}
      </tbody>
      <tfoot><tr><td style="padding:12px 0;font-size:15px">Total investment</td><td></td>
        <td style="text-align:right;padding:12px 0;font-size:16px;border-top:1px solid #22201b"><b>${A.money(t.sub, est.currency)}</b></td></tr></tfoot>

    ${pnum()}

  <div class="page">${run('Terms & signature')}
    <h2 style="margin-top:20px">Terms</h2>

    ${pr.signature ? `
      <div class="sigbox">
        <div style="display:flex;gap:30px;flex-wrap:wrap">
          <div style="flex:1;min-width:200px">
            ${pr.signature.drawn ? `<img src="${pr.signature.drawn}" style="height:56px;width:auto">` : `<div class="sigline sig-script">${A.h(pr.signature.typed)}</div>`}
            <div style="font-size:12px;margin-top:6px;color:#6f6a5c">${A.h(pr.signature.name)} — ${A.h(c.name)}</div></div>
          <div style="font-size:12px;color:#6f6a5c;align-self:flex-end">Signed ${new Date(pr.signature.signedAt).toLocaleString()}<br>Revision ${pr.rev} · locked</div>
        </div></div>
      <p style="margin-top:16px;font-size:12px;color:#6f6a5c">✓ This revision is cryptographically frozen in the audit trail. Signing moved the project to production.</p>`
    : `<div class="sigbox">
        <div style="display:flex;gap:30px;flex-wrap:wrap">
          <div style="flex:1;min-width:200px"><div class="sigline"></div><div style="font-size:12px;margin-top:6px;color:#6f6a5c">${A.h(c.contact)} — ${A.h(c.name)}</div></div>
          <div style="flex:1;min-width:200px"><div class="sigline sig-script" style="font-size:20px">Mara Voss</div><div style="font-size:12px;margin-top:6px;color:#6f6a5c">Mara Voss — Atelier</div></div>
        </div>
        ${forPortal && pr.status==='sent' ? `<button class="btn primary noprint" style="margin-top:16px" onclick="A.signModal('${pr.id}')">${A.ic('sign',14)} Review & sign</button>`
          : pr.status==='sent' ? `<p class="noprint" style="font-size:12px;color:#6f6a5c;margin:14px 0 0">Awaiting ${A.h(c.contact)} — they sign from their portal.</p>`:''}

};

/* ---- audit trail ---- */
A.propAuditModal = prId => {
  const pr = S.db.proposals.find(x=>x.id===prId);
  A.modal(`${A.modalH('Audit trail')}
    <div class="modal-b"><div class="runlog">
      ${pr.audit.map(a => `<div class="r"><b>${A.h(a.ev)}</b><div class="tiny mute">${new Date(a.at).toLocaleString()} · ${A.h(a.by)}</div></div>`).join('')}
    </div></div>
    <div class="modal-f"><button class="btn" onclick="A.closeModal()">Close</button></div>`);
};

/* ---- signing (client portal) ---- */
A.signModal = prId => {
  const pr = S.db.proposals.find(x=>x.id===prId);
  A.modal(`${A.modalH('Sign proposal — revision '+pr.rev)}
    <div class="modal-b">
      <p class="small ink2" style="margin-bottom:14px">By signing you accept the scope, investment and terms in revision ${pr.rev}. The revision locks on signature and the project moves to production.</p>
      <div class="field"><label>Type your full legal name</label><input class="inp" id="sig-name" placeholder="Full name" oninput="A.sigPreview()"></div>
      <div class="field"><label>Typed signature</label><div class="sigline sig-script" id="sig-typed" style="border-bottom:1px solid var(--hair2);color:var(--ink)">&nbsp;</div></div>
      <div class="field"><label>Draw it too <span class="mute">(finger or mouse)</span></label>
        <canvas class="sigpad" id="sigpad" width="420" height="110"></canvas>
        <button class="btn ghost small" onclick="A.sigClear()">Clear drawing</button></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="A.closeModal()">Not yet</button>
      <button class="btn primary" onclick="A.signProposal('${prId}')">${A.ic('sign',14)} Sign & lock revision</button></div>`, {sticky:true});
  setTimeout(A.bindSigpad, 0);
};
A.sigPreview = () => { $('#sig-typed').textContent = $('#sig-name').value || ' '; };
let sigDrawn = false;
A.bindSigpad = () => {
  const cv = $('#sigpad'); if (!cv) return; const cx = cv.getContext('2d');
  cx.lineWidth = 2; cx.lineCap = 'round'; cx.strokeStyle = '#22201b'; sigDrawn = false;
  let draw = false, last = null;
  const pos = e => { const r = cv.getBoundingClientRect();
    return {x:(e.clientX - r.left) * cv.width/r.width, y:(e.clientY - r.top) * cv.height/r.height}; };
  cv.onpointerdown = e => { draw = true; last = pos(e); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if (!draw) return; const p2 = pos(e);
    cx.beginPath(); cx.moveTo(last.x,last.y); cx.lineTo(p2.x,p2.y); cx.stroke(); last = p2; sigDrawn = true; };
  cv.onpointerup = () => draw = false;
};
A.sigClear = () => { const cv = $('#sigpad'); cv.getContext('2d').clearRect(0,0,cv.width,cv.height); sigDrawn = false; };
A.signProposal = prId => {
  const name = $('#sig-name').value.trim();
  if (!name) { A.toast('Type your full name to sign'); return; }
  const pr = S.db.proposals.find(x=>x.id===prId);
  const p = A.proj(pr.projectId); const c = A.client(p.clientId);
  pr.signature = {name, typed:name, drawn: sigDrawn ? $('#sigpad').toDataURL() : null, signedAt:Date.now(), byUser:S.meId};
  pr.status = 'signed';
  pr.audit.push({at:Date.now(), ev:'Signed — typed'+(sigDrawn?' + drawn':'')+' signature captured', by:name});
  pr.audit.push({at:Date.now()+1, ev:`Revision ${pr.rev} locked · project moved to Production`, by:'System'});
  const est = S.db.estimates.find(e => e.id === pr.sections.estimateId); if (est) est.locked = true;
  p.stage = 'production';
  A.logAct(`proposal signed by ${name}`, p.id);
  A.closeModal();
  A.toast('Signed. Revision locked — welcome to production.');
  A.runFlows('proposal_signed', {project:p, client:c, proposal:pr});
  A.render();
};
</script>
<script>/* == src/06-production.js == */
/* ============ production: kanban + timeline + calendar — ONE task store ============ */

S.prodView = 'kanban';
S.tlZoom = 26;           /* px per day */
S.calOff = 0;            /* month offset */
S.calMode = 'month';

A.tabProduction = p => {
  const tasks = S.db.tasks.filter(t => t.projectId === p.id);
  const head = `
    <div class="noprint" style="padding:12px 34px;border-bottom:1px solid var(--hair);background:var(--chrome);display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div class="seg">
        <button class="${S.prodView==='kanban'?'on':''}" onclick="A.prodView('kanban')">${A.ic('kanban',13)} Board</button>
        <button class="${S.prodView==='timeline'?'on':''}" onclick="A.prodView('timeline')">${A.ic('tl',13)} Timeline</button>
        <button class="${S.prodView==='calendar'?'on':''}" onclick="A.prodView('calendar')">${A.ic('cal',13)} Calendar</button>
      </div>
      <span class="tiny mute rowflex" style="gap:6px"><span style="width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block"></span>All views synced — one task store<span class="dot-sep">·</span>${tasks.filter(t=>t.status!=='done').length} active tasks</span>
      <span style="margin-left:auto" class="rowflex">
        ${S.prodView==='timeline' ? `<span class="seg"><button onclick="A.tlZoom(-6)">−</button><button onclick="A.tlZoom(6)">+</button></span><span class="tiny mute">${S.tlZoom}px/day</span>` : ''}
        ${S.prodView==='calendar' ? `<span class="seg"><button class="${S.calMode==='week'?'on':''}" onclick="A.calMode('week')">Week</button><button class="${S.calMode==='month'?'on':''}" onclick="A.calMode('month')">Month</button></span>
          <span class="seg"><button onclick="A.calNav(-1)">‹</button><button onclick="A.calNav(1)">›</button></span>` : ''}
        <button class="btn primary small" onclick="A.taskModal(null,'${p.id}')">${A.ic('plus',12)} New task</button>
      </span>
    </div>`;
  if (!tasks.length && S.prodView !== 'calendar')
    return `<div class="content-wide">${head}<div class="content-pad">${A.empty('▥','No tasks yet','Seed a task set from the studio template, or add the first task by hand.','Seed template tasks',`A.seedTasks('${p.id}',true)`)}</div></div>`;
  const view = {kanban:A.viewKanban, timeline:A.viewTimeline, calendar:A.viewCalendar}[S.prodView];
  return `<div class="content-wide">${head}${view(p, tasks)}</div>`;
};
A.prodView = v => { S.prodView = v; A.render(); };
A.tlZoom = d => { S.tlZoom = A.clamp(S.tlZoom + d, 8, 60); A.render(); };
A.calNav = d => { S.calOff += d; A.render(); };
A.calMode = m => { S.calMode = m; S.calOff = 0; A.render(); };

/* ---------- KANBAN ---------- */
A.viewKanban = (p, tasks) => `
  <div class="kwrap">
    ${A.TASK_COLS.map(([st, label]) => { const cards = tasks.filter(t => t.status === st); return `
      <div class="kcol" ondragover="A.kOver(event)" ondragleave="A.kLeave(event)" ondrop="A.kDrop(event,'${st}')">
        <div class="kcol-h">${label} <span class="n">${cards.length}</span>
          <button class="iconbtn" style="margin-left:auto;width:22px;height:22px" onclick="A.taskModal(null,'${p.id}','${st}')">${A.ic('plus',12)}</button></div>
        ${cards.length ? cards.map(t => A.kCard(t)).join('')
          : `<div class="empty" style="padding:18px 4px"><div class="s">Nothing ${label.toLowerCase()}</div><button class="btn small" onclick="A.taskModal(null,'${p.id}','${st}')">Add task</button></div>`}
      </div>`; }).join('')}
  </div>`;
A.kCard = t => {
  const over = t.due && t.status!=='done' && A.d(t.due) < A.today();
  const cl = t.checklist||[]; const clDone = cl.filter(c=>c.done).length;
  return `<div class="kcard" draggable="true" ondragstart="A.kDrag(event,'${t.id}')" ondragend="this.classList.remove('dragging')" onclick="A.taskModal('${t.id}')">
    <div class="t">${A.h(t.title)}</div>
    <div class="meta">
      <span class="chip neutral" style="font-size:10.5px;padding:1px 7px"><span class="phasedot" style="background:${A.PHASE_COLOR[t.phase]}"></span>${t.phase}</span>
      ${t.due?`<span class="due ${over?'over':''}">${over?'⚑ ':''}${A.fmtD(t.due)}</span>`:''}
      ${cl.length?`<span class="cl">☑ ${clDone}/${cl.length}</span>`:''}
      ${A.commentBtn('task', t.id, t.projectId, 'Task · '+t.title)}
      <span style="margin-left:auto">${t.assignee?A.avatar(t.assignee,'sm'):''}</span>
    </div></div>`;
};
let kDragId = null;
A.kDrag = (e, id) => { kDragId = id; e.dataTransfer.effectAllowed = 'move'; e.target.classList.add('dragging'); };
A.kOver = e => { e.preventDefault(); e.currentTarget.classList.add('dragover'); };
A.kLeave = e => e.currentTarget.classList.remove('dragover');
A.kDrop = (e, st) => { e.preventDefault(); e.currentTarget.classList.remove('dragover');
  const t = S.db.tasks.find(x=>x.id===kDragId); if (!t) return;
  if (t.status !== st) { t.status = st; A.logAct(`moved “${t.title}” to ${st}`, t.projectId);
    A.toast(`“${t.title}” → ${A.TASK_COLS.find(c=>c[0]===st)[1]} — timeline & calendar updated`); }
  kDragId = null; A.render(); };

/* ---------- TIMELINE ---------- */
A.viewTimeline = (p, tasks) => {
  const z = S.tlZoom, LW = window.innerWidth <= 760 ? 122 : 200;
  const dated = tasks.filter(t => t.start && t.due);
  if (!dated.length) return `<div class="content-pad">${A.empty('―','Nothing scheduled','Give tasks start and due dates to see them on the timeline.','Open a task',`A.taskModal('${tasks[0]?.id||''}')`)}</div>`;
  let min = dated[0].start, max = dated[0].due;
  dated.forEach(t => { if (t.start < min) min = t.start; if (t.due > max) max = t.due; });
  min = A.addD(min,-3); max = A.addD(max,8);
  const days = A.diffD(min, max) + 1, W = days * z;
  const x = iso => A.diffD(min, iso) * z;
  const today = A.iso(A.today());

  /* rows grouped by phase; remember y for dep arrows */
  const rows = []; let y = 0;
  A.PHASES.forEach(ph => {
    const ts = dated.filter(t => t.phase === ph); if (!ts.length) return;
    const s = ts.reduce((a,t)=>t.start<a?t.start:a, ts[0].start), e = ts.reduce((a,t)=>t.due>a?t.due:a, ts[0].due);
    rows.push({kind:'phase', ph, s, e, y, h:30}); y += 30;
    ts.sort((a,b)=>a.start<b.start?-1:1).forEach(t => { rows.push({kind:'task', t, y, h:38}); y += 38; });
  });
  const H = y;
  const taskY = {}; rows.forEach(r => { if (r.kind==='task') taskY[r.t.id] = r.y; });

  /* dependency arrows */
  let deps = '';
  dated.forEach(t => (t.deps||[]).forEach(d => {
    const from = dated.find(x=>x.id===d); if (!from || taskY[from.id]==null || taskY[t.id]==null) return;
    const x1 = x(from.due)+z, y1 = taskY[from.id]+19, x2 = x(t.start), y2 = taskY[t.id]+19;
    const mx = Math.max(x1+10, x2-10);
    deps += `<path class="tl-dep" d="M${x1} ${y1} C ${x1+18} ${y1}, ${mx-18} ${y2}, ${x2-3} ${y2}"/>`;
  }));

  /* header day cells (weekly ticks when zoomed out) */
  const step = z >= 18 ? 1 : 7;
  let hcells = '';
  for (let i = 0; i < days; i += step) { const dISO = A.addD(min, i); const dd = A.d(dISO);
    hcells += `<div class="tl-hcell ${dISO===today?'today':''}" style="width:${z*step}px">${step===1 ? (dd.getDay()===1||i===0 ? dd.toLocaleDateString('en-US',{month:'short',day:'numeric'}) : dd.getDate()) : dd.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>`; }
  let vlines = '';
  for (let i = 0; i < days; i++) { const dow = A.d(A.addD(min,i)).getDay();
    if (z >= 14 || dow === 1) vlines += `<div class="tl-vline ${dow===1?'wk':''}" style="left:${i*z}px"></div>`; }

  return `<div class="tlwrap">
    <div style="width:${LW+W}px;min-width:100%">
      <div class="tl-head"><div class="tl-label lab2" style="height:auto;padding:6px 12px">Task</div><div style="position:relative;width:${W}px;display:flex">${hcells}</div></div>
      <div style="position:relative">
        ${rows.map(r => r.kind==='phase' ? `
          <div class="tl-line tl-row phase">
            <div class="tl-label" style="height:30px"><span class="phasedot" style="background:${A.PHASE_COLOR[r.ph]}"></span><b class="small">${r.ph}</b></div>
            <div class="tl-canvas" style="width:${W}px;height:30px">
              <div class="tl-phasebar" style="left:${x(r.s)}px;width:${(A.diffD(r.s,r.e)+1)*z}px;background:${A.PHASE_COLOR[r.ph]}"></div></div></div>` : `
          <div class="tl-line tl-row">
            <div class="tl-label" style="height:38px">${r.t.assignee?A.avatar(r.t.assignee,'sm'):''}<span style="overflow:hidden;text-overflow:ellipsis">${A.h(r.t.title)}</span></div>
            <div class="tl-canvas" style="width:${W}px;height:38px">
              <div class="tl-bar ${r.t.status==='done'?'done':''}" style="left:${x(r.t.start)}px;width:${Math.max(z,(A.diffD(r.t.start,r.t.due)+1)*z)}px;background:${A.PHASE_COLOR[r.t.phase]}"
                onpointerdown="A.tlBarDown(event,'${r.t.id}')" onclick="A.tlBarClick('${r.t.id}')" title="${A.h(r.t.title)} · ${A.fmtD(r.t.start)}–${A.fmtD(r.t.due)} · drag to reschedule">${A.h(r.t.title)}</div></div></div>`).join('')}
        <svg style="position:absolute;left:${LW}px;top:0;pointer-events:none" width="${W}" height="${H}">
          <defs><marker id="arrh" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L6 3.5L0 7z" fill="var(--faint)"/></marker></defs>
          ${deps}</svg>
        <div class="tl-todayline" style="left:${LW + x(today)}px"></div>
      </div>
    </div></div>`;
};
let tlDrag = null;
A.tlBarDown = (e, tid) => {
  e.preventDefault();
  tlDrag = {tid, x0:e.clientX, moved:0, el:e.currentTarget, left0:parseFloat(e.currentTarget.style.left)};
  const move = mv => { tlDrag.moved = mv.clientX - tlDrag.x0;
    tlDrag.el.style.left = (tlDrag.left0 + Math.round(tlDrag.moved/S.tlZoom)*S.tlZoom) + 'px'; };
  const up = () => { document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
    const dd = Math.round(tlDrag.moved / S.tlZoom);
    if (dd !== 0) { const t = S.db.tasks.find(x=>x.id===tid);
      t.start = A.addD(t.start, dd); t.due = A.addD(t.due, dd);
      A.toast(`“${t.title}” moved ${dd>0?'+':''}${dd}d — board & calendar follow`); A.render(); }
    setTimeout(()=>tlDrag=null, 50); };
  document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
};
A.tlBarClick = tid => { if (tlDrag && Math.abs(tlDrag.moved) > 3) return; A.taskModal(tid); };

/* ---------- CALENDAR ---------- */
let calDragSel = null;
A.viewCalendar = (p, tasks) => {
  const base = A.today();
  let cells = [], title = '';
  if (S.calMode === 'month') {
    const first = new Date(base.getFullYear(), base.getMonth()+S.calOff, 1);
    title = first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    const startDow = (first.getDay()+6)%7;
    const gridStart = new Date(first); gridStart.setDate(1-startDow);
    for (let i=0;i<42;i++){ const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
      cells.push({iso:A.iso(d), dim:d.getMonth()!==first.getMonth()}); }
  } else {
    const mon = new Date(base); mon.setDate(base.getDate()-((base.getDay()+6)%7)+S.calOff*7);
    const end = new Date(mon); end.setDate(mon.getDate()+6);
    title = `${mon.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${end.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
    for (let i=0;i<7;i++){ const d = new Date(mon); d.setDate(mon.getDate()+i); cells.push({iso:A.iso(d), dim:false}); }
  }
  const today = A.iso(A.today());
  const evs = S.db.events.filter(e => e.projectId === p.id);
  const itemsOn = iso => {
    const out = [];
    evs.forEach(e => { const end = e.endDate || e.date; if (iso >= e.date && iso <= end) out.push({ev:e}); });
    tasks.forEach(t => { if (t.due === iso && t.status!=='done') out.push({task:t}); });
    return out;
  };
  /* mini month for the side rail */
  const miniBase = new Date(base.getFullYear(), base.getMonth() + (S.calMode==='month'?S.calOff:0), 1);
  const miniStart = new Date(miniBase); miniStart.setDate(1 - ((miniBase.getDay()+6)%7));
  let mini = '';
  for (let i=0;i<42;i++){ const d = new Date(miniStart); d.setDate(miniStart.getDate()+i); const iso = A.iso(d);
    mini += `<span class="${d.getMonth()!==miniBase.getMonth()?'dim':''} ${iso===today?'today':''}" onclick="A.calJump(${d.getMonth()-base.getMonth() + (d.getFullYear()-base.getFullYear())*12})">${d.getDate()}</span>`; }
  return `<div class="calwrap">
    <div class="raillay" style="gap:20px">
    <div class="rail railfirst calside noprint" style="width:210px;flex:0 0 210px">
      <b class="serif" style="font-size:15px">${miniBase.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b>
      <div class="minical" style="margin-top:10px">${['M','T','W','T','F','S','S'].map(d=>`<span class="dim" style="cursor:default">${d}</span>`).join('')}${mini}</div>
      <div class="callegend">
        <span><i style="background:var(--cobalt)"></i>Task due</span>
        <span><i style="background:var(--teal)"></i>Booking</span>
        <span><i style="background:var(--violet)"></i>Review meeting</span>
        <span><i style="background:var(--ink)"></i>◆ Milestone</span>
      </div>
      <div class="tiny mute" style="margin-top:12px;line-height:1.5">Drag across days to book time or set a meeting.</div>
    </div>
    <div class="railmain">
    <div class="spread" style="padding:2px 0 10px"><h2 class="sec" style="margin:0">${title}</h2></div>
    <div class="cal-grid" id="calgrid">
      ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-dh">${d}</div>`).join('')}
      ${cells.map(c => `
        <div class="cal-cell ${c.dim?'dim':''} ${c.iso===today?'today':''}" data-iso="${c.iso}" style="${S.calMode==='week'?'min-height:300px':''}"
          onpointerdown="A.calDown(event,'${c.iso}','${p.id}')" onpointerenter="A.calEnter('${c.iso}')">
          <span class="dnum">${A.d(c.iso).getDate()}</span>
          ${itemsOn(c.iso).slice(0, S.calMode==='week'?12:4).map(it => it.task
            ? `<button class="cal-ev task" onpointerdown="event.stopPropagation()" onclick="A.taskModal('${it.task.id}')" title="Task due">▸ ${A.h(it.task.title)}</button>`
            : `<button class="cal-ev ${it.ev.type}" onpointerdown="event.stopPropagation()" onclick="A.eventModal('${it.ev.id}')">${it.ev.type==='milestone'?'':it.ev.type==='booking'?'◼ ':'○ '}${A.h(it.ev.title)}</button>`).join('')}
          ${itemsOn(c.iso).length > (S.calMode==='week'?12:4) ? `<div class="tiny mute" style="margin-top:3px">+${itemsOn(c.iso).length-4} more</div>`:''}
        </div>`).join('')}
    </div>
    ${!evs.length && !tasks.some(t=>t.due) ? A.empty('▦','An open calendar','Drag across a few days to create the first booking or review meeting.','Add an event',`A.newEventModal('${p.id}','${today}','${today}')`):''}
    </div>
    </div>
  </div>`;
};
A.calJump = monthDelta => { if (S.calMode==='month') { S.calOff = monthDelta; A.render(); } };
A.calDown = (e, iso, pid) => { e.preventDefault();
  calDragSel = {pid, a:iso, b:iso};
  paintCalSel();
  const up = () => { document.removeEventListener('pointerup', up);
    const [a,b] = [calDragSel.a, calDragSel.b].sort();
    const sel = calDragSel; calDragSel = null;
    A.newEventModal(sel.pid, a, b); };
  document.addEventListener('pointerup', up);
};
A.calEnter = iso => { if (!calDragSel) return; calDragSel.b = iso; paintCalSel(); };
function paintCalSel(){ if (!calDragSel) return; const [a,b] = [calDragSel.a, calDragSel.b].sort();
  $$('#calgrid .cal-cell').forEach(c => c.classList.toggle('selrange', c.dataset.iso >= a && c.dataset.iso <= b)); }
A.newEventModal = (pid, a, b) => {
  A.modal(`${A.modalH('New calendar entry')}
    <div class="modal-b">
      <div class="field"><label>Title</label><input class="inp" id="ne-title" placeholder="e.g. Client review"></div>
      <div class="rowflex">
        <div class="field" style="flex:1"><label>Type</label><select class="inp" id="ne-type">
          <option value="meeting">Review meeting</option><option value="booking">Booking (time block)</option><option value="milestone">Milestone</option></select></div>
        <div class="field" style="flex:1"><label>Who</label><select class="inp" id="ne-who"><option value="">—</option>
          ${S.db.users.filter(u=>u.role!=='client').map(u=>`<option value="${u.id}">${A.h(u.name)}</option>`).join('')}</select></div></div>
      <div class="rowflex">
        <div class="field" style="flex:1"><label>From</label><input class="inp" type="date" id="ne-a" value="${a}"></div>
        <div class="field" style="flex:1"><label>To</label><input class="inp" type="date" id="ne-b" value="${b}"></div></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="A.closeModal()">Cancel</button>
      <button class="btn primary" onclick="A.createEvent('${pid}')">Add to calendar</button></div>`);
  setTimeout(()=>$('#ne-title')?.focus(),0);
};
A.createEvent = pid => {
  const title = $('#ne-title').value.trim() || 'Untitled';
  const type = $('#ne-type').value; const a = $('#ne-a').value, b = $('#ne-b').value;
  const ev = {id:A.uid('ev'), projectId:pid, type, title:(type==='milestone'?'◆ ':'')+title, date:a, userId:$('#ne-who').value||undefined};
  if (b && b !== a) ev.endDate = b;
  S.db.events.push(ev); A.closeModal(); A.logAct(`scheduled “${title}”`, pid); A.render();
};
A.eventModal = id => {
  const e = S.db.events.find(x=>x.id===id);
  A.modal(`${A.modalH(A.h(e.title))}
    <div class="modal-b">
      <div class="rowflex">${A.chip(e.type, e.type==='booking'?'teal':e.type==='meeting'?'violet':'neutral')}
        <span class="small mute">${A.fmtDY(e.date)}${e.endDate?' → '+A.fmtDY(e.endDate):''}</span>
        ${e.userId?A.avatar(e.userId,'sm'):''}</div>
    </div>
    <div class="modal-f"><button class="btn danger" onclick="A.delEvent('${e.id}')">${A.ic('trash',13)} Remove</button>
      <button class="btn" onclick="A.closeModal()">Close</button></div>`);
};
A.delEvent = id => { S.db.events = S.db.events.filter(e=>e.id!==id); A.closeModal(); A.render(); };

/* ---------- task modal ---------- */
A.taskModal = (tid, pid, status) => {
  let t = tid ? S.db.tasks.find(x=>x.id===tid) : null;
  const isNew = !t;
  if (isNew) t = {id:A.uid('t'), projectId:pid, title:'', phase:'Design', status:status||'todo', assignee:'', start:A.iso(A.today()), due:A.addD(A.iso(A.today()),5), deps:[], checklist:[]};
  const proj = A.proj(t.projectId);
  const others = S.db.tasks.filter(x => x.projectId === t.projectId && x.id !== t.id);
  A.modal(`${A.modalH(isNew ? 'New task' : 'Task')}
    <div class="modal-b">
      <div class="field"><label>Title</label><input class="inp" id="tk-title" value="${A.h(t.title)}" placeholder="What needs doing?"></div>
      <div class="rowflex">
        <div class="field" style="flex:1"><label>Status</label><select class="inp" id="tk-status">${A.TASK_COLS.map(([k,l])=>`<option value="${k}" ${t.status===k?'selected':''}>${l}</option>`).join('')}</select></div>
        <div class="field" style="flex:1"><label>Phase</label><select class="inp" id="tk-phase">${A.PHASES.map(ph=>`<option ${t.phase===ph?'selected':''}>${ph}</option>`).join('')}</select></div>
