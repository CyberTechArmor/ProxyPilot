        <div class="field" style="flex:1"><label>Assignee</label><select class="inp" id="tk-who"><option value="">—</option>${S.db.users.filter(u=>u.role!=='client').map(u=>`<option value="${u.id}" ${t.assignee===u.id?'selected':''}>${A.h(u.name)}</option>`).join('')}</select></div>
      </div>
      <div class="rowflex">
        <div class="field" style="flex:1"><label>Start</label><input class="inp" type="date" id="tk-start" value="${t.start||''}"></div>
        <div class="field" style="flex:1"><label>Due</label><input class="inp" type="date" id="tk-due" value="${t.due||''}"></div>
        <div class="field" style="flex:1"><label>Depends on</label><select class="inp" id="tk-dep"><option value="">—</option>${others.map(o=>`<option value="${o.id}" ${(t.deps||[])[0]===o.id?'selected':''}>${A.h(o.title)}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Checklist</label>
        <div id="tk-cl">${(t.checklist||[]).map((c,i)=>`<label class="checkline ${c.done?'done':''}"><input type="checkbox" ${c.done?'checked':''} onchange="A.tkCheck('${t.id}',${i},this.checked)"><span>${A.h(c.text)}</span></label>`).join('')}</div>
        <div class="rowflex"><input class="inp" id="tk-newcl" placeholder="Add checklist item…" style="flex:1" onkeydown="if(event.key==='Enter'){A.tkAddCheck('${t.id}',this.value);this.value=''}">
          <button class="btn small" onclick="A.tkAddCheck('${t.id}',$('#tk-newcl').value);$('#tk-newcl').value=''">Add</button></div></div>
      ${!isNew ? `<div class="rowflex small mute">${A.commentBtn('task', t.id, t.projectId, 'Task · '+t.title)} <span>Comments anchor to this task</span></div>`:''}
    </div>
    <div class="modal-f">
      ${!isNew?`<button class="btn danger" onclick="A.tkDelete('${t.id}')">${A.ic('trash',13)} Delete</button>`:''}
      <button class="btn" onclick="A.closeModal()">Cancel</button>
      <button class="btn primary" onclick="A.tkSave('${t.id}', ${isNew}, '${t.projectId}')">${isNew?'Create task':'Save'}</button></div>`, {sticky:true});
  if (isNew) A._draftTask = t; else A._draftTask = null;
  setTimeout(()=>$('#tk-title')?.focus(),0);
};
A.tkCheck = (tid, i, v) => { const t = S.db.tasks.find(x=>x.id===tid) || A._draftTask; t.checklist[i].done = v; };
A.tkAddCheck = (tid, text) => { if (!text.trim()) return;
  const t = S.db.tasks.find(x=>x.id===tid) || A._draftTask; t.checklist.push({text:text.trim(), done:false});
  $('#tk-cl').insertAdjacentHTML('beforeend', `<label class="checkline"><input type="checkbox" onchange="A.tkCheck('${tid}',${t.checklist.length-1},this.checked)"><span>${A.h(text.trim())}</span></label>`); };
A.tkSave = (tid, isNew, pid) => {
  const t = isNew ? A._draftTask : S.db.tasks.find(x=>x.id===tid);
  t.title = $('#tk-title').value.trim() || 'Untitled task';
  t.status = $('#tk-status').value; t.phase = $('#tk-phase').value; t.assignee = $('#tk-who').value;
  t.start = $('#tk-start').value; t.due = $('#tk-due').value;
  t.deps = $('#tk-dep').value ? [$('#tk-dep').value] : [];
  if (isNew) { S.db.tasks.push(t); A.logAct(`added task “${t.title}”`, pid); }
  A.closeModal(); A.render();
};
A.tkDelete = tid => { S.db.tasks = S.db.tasks.filter(x=>x.id!==tid); A.closeModal(); A.render(); };

/* template seeding (used by automations too) */
A.seedTasks = (pid, interactive) => {
  const t0 = A.iso(A.today());
  const tpl = [
    ['Kickoff & discovery', 'Discovery', 0, 4, 'u2'],
    ['Research synthesis', 'Discovery', 5, 9, 'u1'],
    ['Concept directions', 'Design', 10, 17, 'u3'],
    ['Client review — concepts', 'Design', 18, 19, 'u2'],
    ['Design development', 'Design', 20, 30, 'u3'],
    ['Production build-out', 'Production', 31, 42, 'u3'],
    ['QA & polish', 'Production', 43, 47, 'u4'],
    ['Handover & guidelines', 'Delivery', 48, 52, 'u2'],
  ];
  let prev = null;
  tpl.forEach(([title, phase, s, e, who]) => {
    const t = {id:A.uid('t'), projectId:pid, title, phase, status:'todo', assignee:who, start:A.addD(t0,s), due:A.addD(t0,e), deps: prev?[prev]:[], checklist:[]};
    S.db.tasks.push(t); prev = t.id;
  });
  A.logAct('seeded 8 tasks from the studio template', pid);
  if (interactive) { A.toast('8 tasks seeded across four phases'); A.render(); }
};
</script>
<script>/* == src/07-delivery.js == */
/* ============ delivery: versioned files + approvals ============ */

S.fSel = 'all'; S.fQuery = '';
A.tabDelivery = p => {
  const folders = S.db.folders.filter(f => f.projectId === p.id);
  let files = S.db.files.filter(f => f.projectId === p.id);
  if (S.fSel === 'shared') files = files.filter(f => f.shared);
  else if (S.fSel !== 'all') files = files.filter(f => f.folderId === S.fSel);
  if (S.fQuery) files = files.filter(f => f.name.toLowerCase().includes(S.fQuery.toLowerCase()));
  const shared = S.db.files.filter(f => f.projectId === p.id && f.shared);
  const approved = shared.filter(f=>f.approval==='approved').length;
  const acts = S.db.activity.filter(a => a.projectId === p.id && /file|upload|approv|share|change/i.test(a.text)).slice(0,4);
  return `<div class="content-pad" style="max-width:1120px">
    ${A.head(A.h(p.name)+' / Delivery', 'Everything, in its right place.', 'Versions stay intact. Only explicitly shared files cross into the client portal.',
      `<span class="chip ${approved===shared.length&&shared.length?'ok':'neutral'}">${approved}/${shared.length} shared approved</span>
       <button class="btn" onclick="A.newFolder('${p.id}')">${A.ic('plus',13)} Folder</button>
       <button class="btn primary" onclick="A.uploadFile('${p.id}')">⇪ Upload file</button>`)}
    <div class="rowflex" style="margin-bottom:14px">
      <div class="searchbtn" style="min-width:0;flex:1;max-width:320px;display:flex">${A.ic('eye',13)}
        <input class="inp bare" style="border:0;padding:0;font-size:12.5px" placeholder="Search project files" value="${A.h(S.fQuery)}" oninput="S.fQuery=this.value;A.render();A.onDraw(()=>{const el=document.querySelector('.searchbtn input');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}})"></div>
    </div>
    <div class="filesplit">
      <div class="ftree">
        <button class="fnode ${S.fSel==='all'?'on':''}" onclick="A.fGo('all')">${A.ic('file',14)} All files <span style="margin-left:auto" class="tiny mute">${S.db.files.filter(f=>f.projectId===p.id).length}</span></button>
        <button class="fnode ${S.fSel==='shared'?'on':''}" onclick="A.fGo('shared')">${A.ic('eye',14)} Shared to portal</button>
        <div class="lab2" style="padding:12px 9px 5px">Folders</div>
        ${folders.map(fo => `<button class="fnode ${S.fSel===fo.id?'on':''}" onclick="A.fGo('${fo.id}')">▸ ${A.h(fo.name)}</button>`).join('')}
        ${!folders.length?`<div class="tiny mute" style="padding:4px 9px">No folders yet</div>`:''}
        <div style="margin-top:16px;padding:0 9px">
          <div class="tiny mute" style="margin-bottom:4px"><b>8.4 GB</b> of 25 GB</div>
          <div class="progress"><i style="width:34%"></i></div>
        </div>
      </div>
      <div class="fmain">
        ${files.length ? files.map(f => A.fileRow(f, p)).join('')
          : S.fQuery ? A.empty('◌','No matches',`Nothing named “${A.h(S.fQuery)}” in this view.`,'Clear search',"S.fQuery='';A.render()")
          : A.empty('⇪','Nothing here yet','Upload the first deliverable — versions stack as the work evolves.','Upload file',`A.uploadFile('${p.id}')`)}
        ${acts.length?`<div class="lab2" style="margin:18px 0 4px">Delivery activity</div>
          ${acts.map(a=>`<div class="rowflex" style="padding:6px 0;border-bottom:1px solid var(--hair);font-size:12.5px"><span class="mute tiny" style="width:64px;flex:0 0 64px">${A.ago(a.at)}</span><b>${A.h(a.by)}</b> ${A.h(a.text)}</div>`).join('')}`:''}
      </div>
    </div></div>`;
};
A.fGo = sel => { S.fSel = sel; A.render(); };
A.fileRow = (f, p) => {
  const v = f.versions[f.versions.length-1];
  const appr = f.approval==='approved' ? A.chip('Approved by client','ok') : f.approval==='changes' ? A.chip('Changes requested','bad') : f.shared ? A.chip('Awaiting client','cobalt') : '';
  return `<div class="frow">
    <div class="fthumb">${f.kind==='image' ? `<img src="${A.pic(f,120,120)}">` : A.h(f.kind.toUpperCase())}</div>
    <div style="flex:1;min-width:0">
      <div class="rowflex" style="gap:8px"><b style="font-size:13.5px;overflow:hidden;text-overflow:ellipsis">${A.h(f.name)}</b>
        <button class="vbadge" title="Version history" onclick="A.versionsModal('${f.id}')">v${v.n}</button>
        ${A.commentBtn('file', f.id, p.id, 'File · '+f.name)}</div>
      <div class="tiny mute">${v.size} · ${A.h(A.user(v.by).name)} · ${A.ago(v.at)} ${f.changeNote&&f.approval==='changes'?`· <span style="color:var(--bad)">“${A.h(f.changeNote)}”</span>`:''}</div>
    </div>
    <div class="rowflex" style="gap:8px">${appr}
      ${['image','pdf'].includes(f.kind) ? `<button class="btn small" onclick="A.previewFile('${f.id}')">${A.ic('eye',13)} Preview</button>`:''}
      <button class="btn small" onclick="A.newVersion('${f.id}')">+ v${v.n+1}</button>
      <button class="btn small ${f.shared?'':'primary'}" onclick="A.toggleShare('${f.id}')">${f.shared?'Unshare':'Share to portal'}</button>
    </div></div>`;
};
A.versionsModal = fid => {
  const f = S.db.files.find(x=>x.id===fid);
  A.modal(`${A.modalH('Versions — '+A.h(f.name))}
    <div class="modal-b">${[...f.versions].reverse().map(v => `
      <div class="rowflex" style="padding:9px 0;border-bottom:1px solid var(--hair)">
        <span class="vbadge">v${v.n}</span><span style="flex:1">${A.h(A.user(v.by).name)}</span>
        <span class="small mute">${v.size}</span><span class="small mute">${A.ago(v.at)}</span>
        ${v.n===f.versions.length?'<span class="chip cobalt">current</span>':''}</div>`).join('')}
    </div>
    <div class="modal-f"><button class="btn" onclick="A.closeModal()">Close</button></div>`);
};
A.previewFile = fid => {
  const f = S.db.files.find(x=>x.id===fid);
  A.modal(`${A.modalH(A.h(f.name)+' — v'+f.versions.length)}
    <div class="modal-b" style="padding:0">
      ${f.kind==='image' ? `<img src="${A.pic(f,900,620)}" style="width:100%">`
        : `<div style="background:var(--paper);padding:44px 40px;font-family:var(--serif)">
            <div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#9b968a;margin-bottom:12px">PDF preview · page 1</div>
            <div style="font-size:22px;margin-bottom:12px">${A.h(f.name.replace(/\..+$/,''))}</div>
            <div style="height:8px;background:#eae6db;border-radius:4px;margin:9px 0;width:88%"></div>
            <div style="height:8px;background:#eae6db;border-radius:4px;margin:9px 0;width:72%"></div>
            <div style="height:8px;background:#eae6db;border-radius:4px;margin:9px 0;width:81%"></div>
            <div style="display:flex;gap:10px;margin-top:18px">
              <img src="${A.art(f.name+'1',220,150)}" style="width:50%;border-radius:4px"><img src="${A.art(f.name+'2',220,150)}" style="width:50%;border-radius:4px"></div>
          </div>`}
    </div>
    <div class="modal-f"><button class="btn" onclick="A.closeModal()">Close</button></div>`, {wide:true});
};
A.newVersion = fid => {
  const f = S.db.files.find(x=>x.id===fid);
  f.versions.push({n:f.versions.length+1, size:(1+Math.random()*9).toFixed(1)+' MB', by:S.meId, at:Date.now()});
  if (f.approval === 'changes') { f.approval = 'pending'; A.toast(`v${f.versions.length} uploaded — back to the client for review`); }
  else A.toast(`v${f.versions.length} uploaded`);
  A.logAct(`uploaded ${f.name} v${f.versions.length}`, f.projectId); A.render();
};
A.toggleShare = fid => {
  const f = S.db.files.find(x=>x.id===fid);
  f.shared = !f.shared;
  if (f.shared && !f.approval) f.approval = 'pending';
  if (!f.shared) f.approval = null;
  A.toast(f.shared ? `Shared — ${A.client(A.proj(f.projectId).clientId).contact} can review in the portal` : 'Removed from portal');
  A.render();
};
A.uploadFile = pid => {
  const folders = S.db.folders.filter(f=>f.projectId===pid);
  A.modal(`${A.modalH('Upload deliverable')}
    <div class="modal-b">
      <div class="uploadbox" style="margin-bottom:14px" onclick="$('#uf-name').value=['final-logo-lockups.pdf','launch-teaser.mp4','brand-guidelines.pdf','packaging-flat.png'][Math.floor(Math.random()*4)]">Drop a file here — or click to pick a sample</div>
      <div class="field"><label>File name</label><input class="inp" id="uf-name" placeholder="e.g. brand-guidelines.pdf"></div>
      <div class="field"><label>Folder</label><select class="inp" id="uf-folder">${folders.map(fo=>`<option value="${fo.id}">${A.h(fo.name)}</option>`).join('')}<option value="">(no folder)</option></select></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="A.closeModal()">Cancel</button>
      <button class="btn primary" onclick="A.doUpload('${pid}')">Upload v1</button></div>`);
};
A.doUpload = pid => {
  const name = $('#uf-name').value.trim() || 'untitled.pdf';
  const ext = (name.split('.').pop()||'').toLowerCase();
  const kind = ['png','jpg','gif'].includes(ext)?'image':['mp4','mov'].includes(ext)?'video':ext==='pdf'?'pdf':ext;
  S.db.files.unshift({id:A.uid('fl'), projectId:pid, folderId:$('#uf-folder').value||null, name, kind, seed:name, shared:false, approval:null,
    versions:[{n:1, size:(1+Math.random()*9).toFixed(1)+' MB', by:S.meId, at:Date.now()}]});
  A.closeModal(); A.logAct(`uploaded ${name}`, pid); A.render();
};
A.newFolder = pid => {
  A.modal(`${A.modalH('New folder')}
    <div class="modal-b"><div class="field"><label>Name</label><input class="inp" id="nf-name" placeholder="e.g. Print"></div></div>
    <div class="modal-f"><button class="btn" onclick="A.closeModal()">Cancel</button>
      <button class="btn primary" onclick="S.db.folders.push({id:A.uid('fo'),projectId:'${pid}',name:$('#nf-name').value||'Folder',parentId:null});A.closeModal();A.render()">Create</button></div>`);
  setTimeout(()=>$('#nf-name')?.focus(),0);
};

/* client-side approval (called from portal) */
A.clientApprove = fid => {
  const f = S.db.files.find(x=>x.id===fid);
  f.approval = 'approved'; f.approvedBy = A.me().name;
  A.logAct(`${A.me().name} approved ${f.name}`, f.projectId);
  A.runFlows('deliverable_approved', {file:f, project:A.proj(f.projectId)});
  A.toast('Approved — the studio has been notified'); A.render();
};
A.clientRequestChanges = fid => {
  const f = S.db.files.find(x=>x.id===fid);
  A.modal(`${A.modalH('Request changes')}
    <div class="modal-b"><div class="field"><label>What should change?</label>
      <textarea class="inp" id="rc-note" placeholder="Be as specific as you like — this becomes a task for the team."></textarea></div></div>
    <div class="modal-f"><button class="btn" onclick="A.closeModal()">Cancel</button>
      <button class="btn primary" onclick="A.doRequestChanges('${fid}')">Send request</button></div>`);
};
A.doRequestChanges = fid => {
  const f = S.db.files.find(x=>x.id===fid);
  const note = $('#rc-note').value.trim() || 'Changes requested';
  f.approval = 'changes'; f.changeNote = note;
  /* a change request becomes a task — the non-negotiable */
  S.db.tasks.push({id:A.uid('t'), projectId:f.projectId, title:`Rework ${f.name} — “${note.slice(0,50)}”`, phase:'Production', status:'todo',
    assignee: f.versions[f.versions.length-1].by, start:A.iso(A.today()), due:A.addD(A.iso(A.today()),3), deps:[], checklist:[], fromChangeRequest:true});
  S.db.comments.push({id:A.uid('cm'), projectId:f.projectId, anchorType:'file', anchorId:fid, label:'Delivery · '+f.name,
    authorId:S.meId, at:Date.now(), resolved:false, body:note, replies:[]});
  A.logAct(`${A.me().name} requested changes on ${f.name} → task created`, f.projectId);
  A.closeModal(); A.toast('Request sent — it’s on the production board as a task'); A.render();
};
</script>
<script>/* == src/08-board.js == */
/* ============ concept board: infinite canvas ============ */

S.cv = {x:40, y:20, z:.9, sel:[], connectFrom:null};

A.tabBoard = (p, sub) => {
  const boards = S.db.boards.filter(b => b.projectId === p.id);
  if (!boards.length) return `<div class="content-pad">${A.empty('▦','No boards yet','A pan-and-zoom canvas for moodboards, flows and thinking out loud.','Create a board',`A.newBoard('${p.id}')`)}</div>`;
  const bd = boards.find(b => b.id === sub) || boards[0];
  return `<div class="content-wide">
    <div class="noprint" style="padding:10px 34px;border-bottom:1px solid var(--hair);background:var(--chrome);display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <select class="inp" style="width:auto" onchange="A.go('p','${p.id}','board',this.value)">
        ${boards.map(b=>`<option value="${b.id}" ${b.id===bd.id?'selected':''}>${A.h(b.name)}</option>`).join('')}</select>
      <span class="chip ${SHARE_TONE[bd.share]}" style="cursor:pointer" onclick="A.boardShareMenu(event,'${bd.id}')">${SHARE_LABEL[bd.share]} ▾</span>
      ${A.commentBtn('board', bd.id, p.id, 'Board · '+bd.name)}
      <span style="margin-left:auto" class="rowflex tiny mute">Scroll to pan · <span class="kbd">⌘</span>+scroll to zoom · drag empty space for marquee</span>
      <button class="btn small" onclick="A.newBoard('${p.id}')">${A.ic('plus',12)} Board</button>
    </div>
    ${A.boardCanvas(bd, false)}
  </div>`;
};
A.newBoard = pid => { const b = {id:A.uid('bd'), projectId:pid, name:'Board '+(S.db.boards.filter(x=>x.projectId===pid).length+1), share:'team', items:[], connectors:[]};
  S.db.boards.push(b); A.go('p', pid, 'board', b.id); };
A.boardShareMenu = (ev, bid) => { ev.stopPropagation();
  A.menuAt(ev.currentTarget, ['private','team','client'].map(s =>
    `<button onclick="A.boardShare('${bid}','${s}')"><span class="chip ${SHARE_TONE[s]}" style="pointer-events:none">${SHARE_LABEL[s]}</span></button>`).join('') +
    `<div class="mhr"></div><div class="tiny mute" style="padding:4px 10px 6px;line-height:1.5">Client-visible boards accept client comments, never edits.</div>`); };
A.boardShare = (bid, s) => { S.db.boards.find(b=>b.id===bid).share = s; A.closeMenu();
  A.toast(s==='client'?'Board visible in the client portal (comment-only)':'Visibility: '+SHARE_LABEL[s]); A.render(); };

/* ---- canvas renderer ---- */
A.boardCanvas = (bd, readOnly) => {
  A.onDraw(() => A.bindCanvas(bd.id, readOnly));
  const {x, y, z} = S.cv;
  const pins = S.db.comments.filter(c => c.anchorType==='boarditem' && bd.items.some(i => i.id===c.anchorId) && !c.resolved);
  return `
  <div class="cvwrap" id="cvwrap" data-board="${bd.id}">
    <div class="cvstage" id="cvstage" style="transform:translate(${x}px,${y}px) scale(${z})">
      <svg id="cvlines" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none" width="10" height="10">
        ${bd.connectors.map(cn => { const a = bd.items.find(i=>i.id===cn.from), b = bd.items.find(i=>i.id===cn.to);
          if (!a||!b) return ''; const ax=a.x+a.w/2, ay=a.y+a.h/2, bx=b.x+b.w/2, by=b.y+b.h/2;
          return `<path d="M${ax} ${ay} C ${(ax+bx)/2} ${ay}, ${(ax+bx)/2} ${by}, ${bx} ${by}" stroke="var(--faint)" stroke-width="1.6" fill="none" stroke-dasharray="4 4"/>`; }).join('')}
      </svg>
      ${bd.items.map(i => A.cvItem(bd, i, readOnly)).join('')}
      ${pins.map(c => { const it = bd.items.find(i=>i.id===c.anchorId); const u = A.user(c.authorId);
        return `<div class="cpin ${u.role==='client'?'':'team'}" style="left:${it.x+it.w-10}px;top:${it.y-12}px" title="${A.h(u.name)}: ${A.h(c.body)}"
          onclick="event.stopPropagation();A.openDrawerFor('boarditem','${it.id}')">${A.initials(u.name)[0]}</div>`; }).join('')}
    </div>
    ${!readOnly ? `<div class="cvtools" aria-label="Canvas tools">
      <button title="Sticky note" onclick="A.cvAdd('${bd.id}','note')">${A.ic('note',15)}</button>
      <button title="Text card" onclick="A.cvAdd('${bd.id}','text')">¶</button>
      <button title="Image from file library" onclick="A.cvAddImage('${bd.id}')">${A.ic('img',15)}</button>
      <button title="Frame" onclick="A.cvAdd('${bd.id}','frame')">${A.ic('frame',15)}</button>
      <span class="div"></span>
      <button title="Connect two items" class="${S.cv.connectFrom==='arm'?'on':''}" onclick="A.cvArmConnect()">${A.ic('link',15)}</button>
      <button title="Delete selection" onclick="A.cvDeleteSel('${bd.id}')">${A.ic('trash',15)}</button>
    </div>` : `<div class="cvhud mtb" style="position:absolute"><span class="tiny mute" style="padding:0 10px">View only — click any item to comment</span></div>`}
    ${A.minimapHtml(bd)}
    <div class="cvzoom">
      <button class="iconbtn" style="width:24px;height:24px" onclick="A.cvZoomBtn(-.15)">−</button>
      <span style="min-width:40px;text-align:center">${Math.round(z*100)}%</span>
      <button class="iconbtn" style="width:24px;height:24px" onclick="A.cvZoomBtn(.15)">+</button>
    </div>
    ${!bd.items.length ? `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
      ${A.empty('✦','A blank canvas','Drop in a note, an image or a frame from the toolbar below.')}</div>`:''}
  </div>`;
};
A.cvItem = (bd, i, readOnly) => {
  const sel = S.cv.sel.includes(i.id);
  const cc = A.commentCount('boarditem', i.id);
  const base = `class="cvitem ${sel?'sel':''}" data-item="${i.id}" style="left:${i.x}px;top:${i.y}px;width:${i.w}px;height:${i.h}px;${i.type==='frame'?'z-index:1':'z-index:3'}"`;
  if (i.type === 'note') return `<div ${base}><div class="cvbox cv-note" ${readOnly?'':`contenteditable="true" onblur="A.cvNoteSave('${bd.id}','${i.id}',this.textContent)"`} onpointerdown="event.stopPropagation();A.cvItemDown(event,'${bd.id}','${i.id}',${readOnly})">${A.h(i.text)}</div></div>`;
  if (i.type === 'image') return `<div ${base} onpointerdown="A.cvItemDown(event,'${bd.id}','${i.id}',${readOnly})"><div class="cvbox cv-img"><img src="${A.pic(i, 400, 300)}" draggable="false"></div></div>`;
  if (i.type === 'text') return `<div ${base} onpointerdown="A.cvItemDown(event,'${bd.id}','${i.id}',${readOnly})"><div class="cvbox cv-text">
    ${i.kicker?`<span class="kick">${A.h(i.kicker)}</span>`:''}<span class="tx" ${readOnly?'':`contenteditable="true" onpointerdown="event.stopPropagation()" onblur="A.cvTextSave('${bd.id}','${i.id}',this.textContent)"`}>${A.h(i.text)}</span>
    ${i.swatches?`<span class="sws">${i.swatches.map(c=>`<i style="background:${c}"></i>`).join('')}</span>`:''}</div></div>`;
  if (i.type === 'frame') return `<div ${base} onpointerdown="A.cvItemDown(event,'${bd.id}','${i.id}',${readOnly})"><div class="cvbox cv-frame"></div><span class="cv-frame-lab">${A.h(i.label||'Frame')}</span></div>`;
  return '';
};
A.cvTextSave = (bid, iid, text) => { const bd = S.db.boards.find(b=>b.id===bid);
  const it = bd.items.find(i=>i.id===iid); if (it) it.text = text; };
A.cvNoteSave = (bid, iid, text) => { const bd = S.db.boards.find(b=>b.id===bid);
  const it = bd.items.find(i=>i.id===iid); if (it) it.text = text; };

/* ---- interactions ---- */
A.bindCanvas = (bid, readOnly) => {
  const wrap = $('#cvwrap'); if (!wrap) return;
  const stage = $('#cvstage');
  const apply = () => { stage.style.transform = `translate(${S.cv.x}px,${S.cv.y}px) scale(${S.cv.z})`; };
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const r = wrap.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const oldZ = S.cv.z, nz = A.clamp(oldZ * (e.deltaY < 0 ? 1.08 : 0.93), .25, 2.5);
      S.cv.x = mx - (mx - S.cv.x) * nz/oldZ; S.cv.y = my - (my - S.cv.y) * nz/oldZ; S.cv.z = nz;
      apply(); wrap.querySelector('.cvzoom span').textContent = Math.round(nz*100)+'%';
    } else { S.cv.x -= e.deltaX; S.cv.y -= e.deltaY; apply(); }
  }, {passive:false});
  /* background: marquee (left) or pan (middle/space) */
  wrap.addEventListener('pointerdown', e => {
    if (e.target.closest('.cvitem') || e.target.closest('.mtb') || e.target.closest('.cvzoom') || e.target.closest('.cpin')) return;
    const r = wrap.getBoundingClientRect();
    if (e.button === 1 || e.shiftKey || e.pointerType === 'touch') { /* pan (touch: one finger pans) */
      const sx = e.clientX, sy = e.clientY, ox = S.cv.x, oy = S.cv.y;
      const mv = m => { S.cv.x = ox + m.clientX - sx; S.cv.y = oy + m.clientY - sy; apply(); };
      const up = () => { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); };
      document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); return;
    }
    /* marquee */
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    const mq = document.createElement('div'); mq.className = 'marquee'; wrap.appendChild(mq);
    const mv = m => { const cx = m.clientX - r.left, cy = m.clientY - r.top;
      const l = Math.min(sx,cx), t = Math.min(sy,cy), w = Math.abs(cx-sx), h2 = Math.abs(cy-sy);
      Object.assign(mq.style, {left:l+'px', top:t+'px', width:w+'px', height:h2+'px'});
      const bd = S.db.boards.find(b=>b.id===bid);
      const inv = p2 => ({x:(p2.x - S.cv.x)/S.cv.z, y:(p2.y - S.cv.y)/S.cv.z});
      const a = inv({x:l,y:t}), b2 = inv({x:l+w,y:t+h2});
      S.cv.sel = bd.items.filter(i => i.x < b2.x && i.x+i.w > a.x && i.y < b2.y && i.y+i.h > a.y).map(i=>i.id);
      $$('#cvstage .cvitem').forEach(el => el.classList.toggle('sel', S.cv.sel.includes(el.dataset.item)));
    };
    const up = () => { mq.remove(); document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); };
    document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
  });
};
A.cvZoomBtn = d => { S.cv.z = A.clamp(S.cv.z + d, .25, 2.5); A.render(); };

/* minimap — world bbox with viewport rectangle */
A.minimapHtml = bd => {
  if (!bd.items.length) return '';
  const xs = bd.items.map(i=>i.x), ys = bd.items.map(i=>i.y);
  const x0 = Math.min(...xs)-60, y0 = Math.min(...ys)-60;
  const x1 = Math.max(...bd.items.map(i=>i.x+i.w))+60, y1 = Math.max(...bd.items.map(i=>i.y+i.h))+60;
  const W = x1-x0, H = y1-y0, mw = 116, mh = 78;
  const sc = Math.min(mw/W, mh/H);
  const dots = bd.items.map(i => `<i style="left:${((i.x-x0)*sc)|0}px;top:${((i.y-y0)*sc)|0}px;width:${Math.max(3,(i.w*sc)|0)}px;height:${Math.max(3,(i.h*sc)|0)}px;${i.type==='frame'?'background:transparent;border:1px solid var(--hair2)':''}"></i>`).join('');
  const vw = (window.innerWidth-270)/S.cv.z, vh = (window.innerHeight-160)/S.cv.z;
  const vx = (-S.cv.x/S.cv.z - x0)*sc, vy = (-S.cv.y/S.cv.z - y0)*sc;
  return `<div class="minimap noprint">${dots}<span class="vp" style="left:${A.clamp(vx,0,mw-14)|0}px;top:${A.clamp(vy,0,mh-10)|0}px;width:${A.clamp(vw*sc,14,mw)|0}px;height:${A.clamp(vh*sc,10,mh)|0}px"></span></div>`;
};

A.cvItemDown = (e, bid, iid, readOnly) => {
  e.stopPropagation();
  const bd = S.db.boards.find(b=>b.id===bid);
  /* connect mode */
  if (S.cv.connectFrom && S.cv.connectFrom !== 'arm' && S.cv.connectFrom !== iid) {
    bd.connectors.push({id:A.uid('cn'), from:S.cv.connectFrom, to:iid});
    S.cv.connectFrom = null; A.toast('Connected'); A.render(); return;
  }
  if (S.cv.connectFrom === 'arm') { S.cv.connectFrom = iid; A.toast('Now click the item to connect to'); return; }
  if (readOnly) { A.openThreadComposer('boarditem', iid, bd.projectId, 'Board item'); return; }
  if (!S.cv.sel.includes(iid)) { S.cv.sel = e.shiftKey ? [...S.cv.sel, iid] : [iid];
    $$('#cvstage .cvitem').forEach(el => el.classList.toggle('sel', S.cv.sel.includes(el.dataset.item))); }
  /* drag all selected */
  const sx = e.clientX, sy = e.clientY;
  const orig = S.cv.sel.map(id => { const it = bd.items.find(i=>i.id===id); return {it, x:it.x, y:it.y}; });
  let moved = false;
  const mv = m => { const dx = (m.clientX - sx)/S.cv.z, dy = (m.clientY - sy)/S.cv.z;
    if (Math.abs(dx)+Math.abs(dy) > 2) moved = true;
    orig.forEach(o => { o.it.x = Math.round(o.x + dx); o.it.y = Math.round(o.y + dy);
      const el = document.querySelector(`[data-item="${o.it.id}"]`);
      if (el) { el.style.left = o.it.x+'px'; el.style.top = o.it.y+'px'; } });
    A.cvRedrawLines(bd);
  };
  const up = m => { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up);
    if (moved) A.render(); };
  document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
};
A.cvRedrawLines = bd => {
  const svg = $('#cvlines'); if (!svg) return;
  svg.innerHTML = bd.connectors.map(cn => { const a = bd.items.find(i=>i.id===cn.from), b = bd.items.find(i=>i.id===cn.to);
    if (!a||!b) return ''; const ax=a.x+a.w/2, ay=a.y+a.h/2, bx=b.x+b.w/2, by=b.y+b.h/2;
    return `<path d="M${ax} ${ay} C ${(ax+bx)/2} ${ay}, ${(ax+bx)/2} ${by}, ${bx} ${by}" stroke="var(--faint)" stroke-width="1.6" fill="none" stroke-dasharray="4 4"/>`; }).join('');
};
A.cvArmConnect = () => { S.cv.connectFrom = S.cv.sel[0] || 'arm';
  A.toast(S.cv.sel[0] ? 'Click the item to connect to' : 'Click the first item, then the second'); };
A.cvAdd = (bid, type) => {
  const bd = S.db.boards.find(b=>b.id===bid);
  const cx = (200 - S.cv.x)/S.cv.z + Math.random()*160, cy = (160 - S.cv.y)/S.cv.z + Math.random()*120;
  const it = type==='note' ? {id:A.uid('i'), type, x:cx, y:cy, w:180, h:110, text:'New note — double-click to edit'}
    : type==='text' ? {id:A.uid('i'), type, x:cx, y:cy, w:230, h:160, text:'A line worth keeping.', kicker:'New card', swatches:['#e8e0d2','#2140d9','#1c2028']}
    : {id:A.uid('i'), type:'frame', x:cx, y:cy, w:420, h:320, label:'New frame'};
  bd.items.push(it); S.cv.sel = [it.id]; A.render();
};
A.cvAddImage = bid => {
  const bd = S.db.boards.find(b=>b.id===bid);
  const files = S.db.files.filter(f => f.projectId === bd.projectId && f.kind === 'image');
  A.modal(`${A.modalH('Add image')}
    <div class="modal-b">
      <div class="lab2" style="margin-bottom:8px">From the project file library</div>
      <div class="gridauto" style="grid-template-columns:repeat(3,1fr)">
        ${files.map(f => `<div style="cursor:pointer" onclick="A.cvPlaceImage('${bid}','${f.seed||f.name}','${f.photo||''}')"><img src="${A.pic(f,220,150)}" style="border-radius:7px;border:1px solid var(--hair)"><div class="tiny mute" style="margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${A.h(f.name)}</div></div>`).join('')}
        <div class="uploadbox" style="min-height:80px;display:flex;align-items:center;justify-content:center" onclick="A.cvPlaceImage('${bid}','new'+Math.floor(Math.random()*999))">+ New upload</div>
      </div>
      ${!files.length?`<div class="tiny mute" style="margin-top:8px">No images in delivery yet — “New upload” drops a sample in.</div>`:''}
    </div>`);
};
A.cvPlaceImage = (bid, seed, photo) => {
  const bd = S.db.boards.find(b=>b.id===bid);
  const it = {id:A.uid('i'), type:'image', x:(220 - S.cv.x)/S.cv.z, y:(180 - S.cv.y)/S.cv.z, w:220, h:160, seed};
  if (photo) it.photo = photo;
  bd.items.push(it); S.cv.sel = [it.id]; A.closeModal(); A.render();
};
A.cvDeleteSel = bid => {
  const bd = S.db.boards.find(b=>b.id===bid);
  if (!S.cv.sel.length) { A.toast('Select something first — click or drag a marquee'); return; }
  bd.items = bd.items.filter(i => !S.cv.sel.includes(i.id));
  bd.connectors = bd.connectors.filter(c => !S.cv.sel.includes(c.from) && !S.cv.sel.includes(c.to));
  S.cv.sel = []; A.render();
};
</script>
<script>/* == src/09-automations.js == */
/* ============ automations: typed node flows + engine ============ */

const NODE_DEFS = {
  form_submitted:      {kind:'trigger', label:'Form submitted',       glyph:'▤', desc:c=>`When “${c.form||'any form'}” gets a submission`},
  proposal_signed:     {kind:'trigger', label:'Proposal signed',      glyph:'✍', desc:()=>'When any proposal is signed in the portal'},
  deliverable_approved:{kind:'trigger', label:'Deliverable approved', glyph:'✓', desc:()=>'When a client approves a shared file'},
  date_reached:        {kind:'trigger', label:'Date reached',         glyph:'◷', desc:c=>`On ${c.date||'a chosen date'}, at 9:00`},
  condition:           {kind:'condition', label:'Condition',          glyph:'≟', desc:c=>c.rule||'Always true'},
  create_project:      {kind:'action', label:'Create project',        glyph:'▣', desc:c=>`From template “${c.template||'Studio default'}”`},
  seed_tasks:          {kind:'action', label:'Seed task set',         glyph:'▥', desc:c=>`Insert “${c.template||'Studio default (8 tasks)'}”`},
  send_email:          {kind:'action', label:'Send email',            glyph:'✉', desc:c=>`To ${c.to||'…'} — “${c.subject||''}”`},
  move_stage:          {kind:'action', label:'Move stage',            glyph:'⇢', desc:c=>`Move project to ${c.to||'…'}`},
  post_reminder:       {kind:'action', label:'Post reminder',         glyph:'◔', desc:c=>`For ${c.who||'the team'} — “${c.note||''}”`},
};

A.flowToggle = (id, on) => { S.db.flows.find(w=>w.id===id).enabled = on; A.toast(on?'Flow enabled':'Flow paused'); A.render(); };
A.newFlow = () => {
  const w = {id:A.uid('w'), name:'New flow', enabled:false, nodes:[
    {id:A.uid('n'), kind:'trigger', type:'form_submitted', x:60, y:100, config:{form:'New project inquiry'}}], edges:[], runs:[]};
  S.db.flows.push(w); A.go('automations', w.id);
};

/* ---- master-detail: flow list + editor on one screen ---- */
S.fSelNode = null;
A.scrAutomations = id => {
  const ws = S.db.flows;
  const w = ws.find(x=>x.id===id) || ws[0];
  return `<div class="content-wide">
    <div class="noprint toolrow" style="padding:14px 34px;border-bottom:1px solid var(--hair);background:var(--chrome);display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="min-width:0"><div class="eyebrow" style="margin-bottom:2px">Studio / Automations</div>
        <b class="serif" style="font-size:18px;font-weight:400">Make the handoffs automatic.</b></div>
      <span style="margin-left:auto" class="rowflex">
        ${w?`<button class="btn small" onclick="A.flowAddMenu(event,'${w.id}')">${A.ic('plus',12)} Add node</button>
        <button class="btn small" onclick="A.flowDelSel('${w.id}')">${A.ic('trash',12)} Remove selected</button>
        <button class="btn primary small" onclick="A.flowTest('${w.id}')">${A.ic('bolt',12)} Test run</button>`:''}
        <button class="btn small" onclick="A.newFlow()">${A.ic('plus',12)} New flow</button></span>
    </div>
    <div class="autosplit">
      <div class="autolist">
        <div class="spread" style="padding:2px 6px 10px"><span class="lab2">Flows</span><span class="tiny mute">${ws.filter(x=>x.enabled).length} live</span></div>
        ${ws.length ? ws.map(x => { const trig = x.nodes.find(n=>n.kind==='trigger'); const td = NODE_DEFS[trig?.type];
          return `<button class="flowitem ${w&&x.id===w.id?'on':''}" onclick="A.go('automations','${x.id}')">
            <span class="fic">${A.ic('zap',15)}</span>
            <span style="flex:1;min-width:0"><b>${A.h(x.name)}</b><small>${x.runs.length} run${x.runs.length===1?'':'s'} · ${td?td.label:'no trigger'}</small></span>
            <span class="switch ${x.enabled?'on':''}" onclick="event.stopPropagation();A.flowToggle('${x.id}',${!x.enabled})"></span>
          </button>`; }).join('')
        : A.empty('⚡','No flows yet','Wire a trigger to actions — intake, kickoff and approvals run themselves.','Create a flow','A.newFlow()')}
      </div>
      ${w ? A.flowEditor(w) : `<div style="flex:1">${A.empty('⚡','Pick a flow','Select a flow on the left, or create one.')}</div>`}
    </div></div>`;
};
A.flowEditor = w => {
  const nodeById = nid => w.nodes.find(n=>n.id===nid);
  return `<div style="flex:1;display:flex;flex-direction:column;min-width:0;min-height:0">
    <div class="noprint" style="padding:9px 18px;border-bottom:1px solid var(--hair);background:var(--chrome);display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="chip ${w.enabled?'ok':'neutral'}">${w.enabled?'Enabled':'Paused'}</span>
      <input class="inp bare" style="width:220px;font-weight:600" value="${A.h(w.name)}" onchange="S.db.flows.find(x=>x.id==='${w.id}').name=this.value">
      <span class="tiny mute" style="margin-left:auto">These are live — sign a proposal or submit the form and watch them fire.</span>
    </div>
    <div class="flowwrap" id="flowwrap" style="flex:1;min-height:300px;position:relative;overflow:auto">
      <svg id="fedges" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;min-width:1000px">
        ${w.edges.map(e => { const a = nodeById(e.from), b = nodeById(e.to); if (!a||!b) return '';
          return `<path class="fedge" d="M${a.x+220} ${a.y+34} C ${a.x+280} ${a.y+34}, ${b.x-60} ${b.y+34}, ${b.x} ${b.y+34}"/>`; }).join('')}
      </svg>
      ${w.nodes.map(n => { const d = NODE_DEFS[n.type]; return `
        <div class="fnodebox ${d.kind==='trigger'?'ftrig':''} ${d.kind==='condition'?'fcond':''} ${S.fSelNode===n.id?'sel':''}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px"
             onpointerdown="A.fnDown(event,'${w.id}','${n.id}')">
          <div class="fh"><span style="width:20px;height:20px;border-radius:6px;background:${d.kind==='trigger'?'var(--cobalt-wash)':d.kind==='condition'?'var(--violet-wash)':'var(--wash)'};display:inline-flex;align-items:center;justify-content:center;font-size:11px">${d.glyph}</span>
            ${d.label}<span class="chip ${d.kind==='trigger'?'cobalt':d.kind==='condition'?'violet':'neutral'}" style="margin-left:auto;font-size:9.5px;padding:1px 7px">${d.kind}</span></div>
          <div class="fb">${d.desc(n.config||{})}</div>
          ${d.kind!=='trigger'?`<span class="port in"></span>`:''}
          <span class="port out" title="Connect: click, then click a target node" onpointerdown="event.stopPropagation();A.fPortClick('${w.id}','${n.id}')"></span>
        </div>`; }).join('')}
      ${!w.nodes.length?`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${A.empty('⚡','Empty flow','Add a trigger, then chain actions after it.','Add node',`A.flowAddMenu(event,'${w.id}')`)}</div>`:''}
      ${w.runs.length?`<div class="lastrun"><span class="ok">${A.ic('check',14)}</span><span style="min-width:0"><b>Last run</b> — ${A.h(w.runs[0].summary).slice(0,60)}<span class="tiny mute" style="display:block">${A.ago(w.runs[0].at)} · engine time 0.4s</span></span></div>`:''}
    </div></div>`;
};
let fConnFrom = null;
A.fPortClick = (wid, nid) => { fConnFrom = nid; A.toast('Now click the node this should connect to'); };
A.fnDown = (e, wid, nid) => {
  e.stopPropagation();
  const w = S.db.flows.find(x=>x.id===wid);
  if (fConnFrom && fConnFrom !== nid) {
    const target = w.nodes.find(n=>n.id===nid);
    if (target.kind === 'trigger') { A.toast('Triggers only start flows — connect to an action'); fConnFrom = null; return; }
    if (!w.edges.some(ed => ed.from===fConnFrom && ed.to===nid)) w.edges.push({from:fConnFrom, to:nid});
    fConnFrom = null; A.render(); return;
  }
  S.fSelNode = nid;
  $$('#flowwrap .fnodebox').forEach(el => el.classList.toggle('sel', el.dataset.node===nid));
  const n = w.nodes.find(x=>x.id===nid);
  const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y; let moved = false;
  const mv = m => { n.x = Math.max(0, ox + m.clientX - sx); n.y = Math.max(0, oy + m.clientY - sy); moved = true;
    const el = document.querySelector(`[data-node="${nid}"]`); el.style.left = n.x+'px'; el.style.top = n.y+'px';
    A.fRedrawEdges(w); };
  const up = m => { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up);
    if (!moved) A.fnConfig(wid, nid); };
  document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
};
A.fRedrawEdges = w => {
  const svg = $('#fedges'); if (!svg) return;
  const nodeById = nid => w.nodes.find(n=>n.id===nid);
  svg.innerHTML = w.edges.map(e => { const a = nodeById(e.from), b = nodeById(e.to); if (!a||!b) return '';
    return `<path class="fedge" d="M${a.x+220} ${a.y+34} C ${a.x+280} ${a.y+34}, ${b.x-60} ${b.y+34}, ${b.x} ${b.y+34}"/>`; }).join('');
};
A.bindFlow = wid => {};
A.flowAddMenu = (ev, wid) => {
  A.menuAt(ev.currentTarget || ev.target, `<div class="mlab">Triggers</div>` +
    Object.entries(NODE_DEFS).filter(([,d])=>d.kind==='trigger').map(([k,d]) => `<button onclick="A.flowAddNode('${wid}','${k}')"><span style="width:18px">${d.glyph}</span>${d.label}</button>`).join('') +
    `<div class="mhr"></div><div class="mlab">Conditions</div>` +
    `<button onclick="A.flowAddNode('${wid}','condition')"><span style="width:18px">≟</span>Condition</button>` +
    `<div class="mhr"></div><div class="mlab">Actions</div>` +
    Object.entries(NODE_DEFS).filter(([,d])=>d.kind==='action').map(([k,d]) => `<button onclick="A.flowAddNode('${wid}','${k}')"><span style="width:18px">${d.glyph}</span>${d.label}</button>`).join(''));
};
A.flowAddNode = (wid, type) => {
  const w = S.db.flows.find(x=>x.id===wid);
  const d = NODE_DEFS[type];
  const cfg = {form_submitted:{form:'New project inquiry'}, date_reached:{date:A.addD(A.iso(A.today()),7)}, condition:{rule:'Always true'},
    create_project:{template:'Studio default'}, seed_tasks:{template:'Studio default (8 tasks)'},
    send_email:{to:'client', subject:'Hello from Atelier'}, move_stage:{to:'Production'}, post_reminder:{who:'Producer', note:'Follow up'}}[type] || {};
  w.nodes.push({id:A.uid('n'), kind:d.kind, type, x:60 + w.nodes.length*70, y:80 + (w.nodes.length%3)*90, config:cfg});
  A.closeMenu(); A.render();
};
A.flowDelSel = wid => {
  const w = S.db.flows.find(x=>x.id===wid);
  if (!S.fSelNode) { A.toast('Click a node first'); return; }
  w.nodes = w.nodes.filter(n=>n.id!==S.fSelNode);
  w.edges = w.edges.filter(e=>e.from!==S.fSelNode && e.to!==S.fSelNode);
  S.fSelNode = null; A.render();
};
A.fnConfig = (wid, nid) => {
  const w = S.db.flows.find(x=>x.id===wid); const n = w.nodes.find(x=>x.id===nid);
  const d = NODE_DEFS[n.type]; const cfg = n.config || {};
  const fields = Object.entries(cfg);
  if (!fields.length) return;
  A.modal(`${A.modalH(d.label)}
    <div class="modal-b">${fields.map(([k,v]) => `<div class="field"><label>${k}</label><input class="inp" data-cfg="${k}" value="${A.h(v)}"></div>`).join('')}</div>
    <div class="modal-f"><button class="btn" onclick="A.closeModal()">Cancel</button>
      <button class="btn primary" onclick="A.fnSaveConfig('${wid}','${nid}')">Save</button></div>`);
};
A.fnSaveConfig = (wid, nid) => {
  const w = S.db.flows.find(x=>x.id===wid); const n = w.nodes.find(x=>x.id===nid);
  $$('[data-cfg]').forEach(el => n.config[el.dataset.cfg] = el.value);
  A.closeModal(); A.render();
};

/* ---- the engine ---- */
A.runFlows = (triggerType, ctx={}) => {
  S.db.flows.filter(w => w.enabled).forEach(w => {
    const trig = w.nodes.find(n => n.kind==='trigger' && n.type===triggerType);
    if (!trig) return;
    /* walk edges breadth-first from the trigger */
    const done = new Set([trig.id]); let frontier = [trig.id]; const acted = [];
    while (frontier.length) {
      const next = [];
      frontier.forEach(fid => w.edges.filter(e=>e.from===fid).forEach(e => {
        if (done.has(e.to)) return; done.add(e.to); next.push(e.to);
        const n = w.nodes.find(x=>x.id===e.to);
        if (n && n.kind==='action') acted.push(A.execAction(n, ctx));
      }));
      frontier = next;
    }
    const who = ctx.lead?.name || ctx.project?.name || ctx.file?.name || 'event';
    const summary = `${who} — ${acted.filter(Boolean).join(', ') || 'no actions wired'}`;
    w.runs.unshift({at:Date.now(), summary});
    A.toast(`⚡ Automation “${w.name}” ran — ${acted.filter(Boolean).join(', ')}`, true);
  });
};
A.execAction = (n, ctx) => {
  const c = n.config || {};
  switch (n.type) {
    case 'send_email': {
      const to = (c.to||'').replace('{{lead.email}}', ctx.lead?.email||'').replace('{{client.email}}', ctx.client?.email||'') || 'team';
      const subj = (c.subject||'').replace('{{file.name}}', ctx.file?.name||'');
      A.notify(`Email sent to ${to}: “${subj}”`); return 'email sent'; }
    case 'seed_tasks': {
      if (ctx.project) { A.seedTasks(ctx.project.id, false); return '8 tasks seeded'; } return 'tasks queued'; }
    case 'create_project': {
      if (ctx.lead) { const cl = S.db.clients.find(x=>x.name===ctx.lead.name) ||
          (S.db.clients.push({id:A.uid('c'), name:ctx.lead.name, contact:ctx.lead.contact, email:ctx.lead.email}), S.db.clients[S.db.clients.length-1]);
        A.createProject({name: ctx.lead.name+' — New project', clientId: cl.id, budget: 20000, stage:'brief', silent:true});
        return 'project created'; } return 'project queued'; }
    case 'move_stage': {
      if (ctx.project) { const st = (c.to||'').toLowerCase(); if (A.STAGES.includes(st)) ctx.project.stage = st; return 'stage → '+(c.to||'?'); }
      return 'stage move queued'; }
    case 'post_reminder': { A.notify(`Reminder for ${c.who||'team'}: ${c.note||''}`); return 'reminder posted'; }
  }
  return null;
};
A.flowTest = wid => {
  const w = S.db.flows.find(x=>x.id===wid);
  const trig = w.nodes.find(n=>n.kind==='trigger');
  if (!trig) { A.toast('Add a trigger first'); return; }
  const wasEnabled = w.enabled; w.enabled = true;
  const ctx = {
    form_submitted: {lead:{name:'Test Lead Co.', contact:'Test Person', email:'test@example.com'}},
    proposal_signed: {project:A.proj('p2'), client:A.client('c2')},
    deliverable_approved: {file:S.db.files[0], project:A.proj('p1')},
    date_reached: {},
  }[trig.type] || {};
  /* run only this flow */
  const others = S.db.flows.filter(x=>x.id!==wid).map(x=>({x, e:x.enabled}));
  others.forEach(o=>o.x.enabled=false);
  A.runFlows(trig.type, ctx);
  others.forEach(o=>o.x.enabled=o.e);
  w.enabled = wasEnabled;
  A.render();
};
</script>
<script>/* == src/10-dashboard.js == */
/* ============ studio dashboard: charts in design tokens ============ */

A.scrDashboard = () => {
  const projects = S.db.projects;
  const active = projects.filter(p => !['report'].includes(p.stage));
  const pipelineVal = projects.filter(p=>['brief','concept','estimate','proposal'].includes(p.stage)).reduce((n,p)=>n+p.budget,0);
  const signedVal = projects.filter(p=>['production','delivery'].includes(p.stage)).reduce((n,p)=>n+p.budget,0);
  const newLeads = S.db.leads.filter(l=>l.status==='new').length;
  const notif = S.db.notifications.slice(0,4);
  return `<div class="content-pad" style="max-width:1120px">
    ${A.head('Studio / '+new Date().toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'}), 'The studio, at a glance.', 'Revenue, workload and project health — without the weekly spreadsheet.',
      A.presenceBar('dash')+`<button class="btn" onclick="A.go('pipeline')">${A.ic('pipe',14)} Pipeline</button>`)}

    <div class="statrow" style="border:1px solid var(--hair);border-radius:12px;background:var(--chrome);overflow:hidden;margin-bottom:0">
      <div class="stat"><div class="k">In pipeline</div><div class="v">${A.money(pipelineVal)}</div><div class="delta" style="color:var(--cobalt)">▲ ${newLeads} new inquir${newLeads===1?'y':'ies'}</div></div>
      <div class="stat"><div class="k">Signed & running</div><div class="v">${A.money(signedVal)}</div><div class="delta mute">${projects.filter(p=>p.stage==='production').length} in production</div></div>
      <div class="stat"><div class="k">Billed this quarter</div><div class="v">${A.money(projects.reduce((n,p)=>n+p.billed,0))}</div><div class="delta mute">across ${projects.length} projects</div></div>
      <div class="stat"><div class="k">Awaiting signature</div><div class="v">${S.db.proposals.filter(p=>p.status==='sent').length}</div><div class="delta mute">${S.db.proposals.filter(p=>p.status==='sent').map(p=>A.h(A.proj(p.projectId).name)).join(', ')||'—'}</div></div>
    </div>

    <div class="dashgrid" style="border:1px solid var(--hair);border-top:0;border-radius:0 0 12px 12px;background:var(--chrome);overflow:hidden">
      <div class="dashcell"><h3>Pipeline by stage</h3><div class="sub">Value of work at each bend of the river</div>${A.chFunnel()}</div>
      <div class="dashcell"><h3>Booked vs billed</h3><div class="sub">By month, trailing six</div>${A.chBars()}</div>
      <div class="dashcell"><h3>Budget burn</h3><div class="sub">Spent against budget, active projects</div>${A.chBurn(active)}</div>
      <div class="dashcell"><h3>Utilization</h3><div class="sub">Booked hours as % of capacity, six weeks</div>${A.chHeat()}</div>
    </div>

    ${notif.length?`<div class="sect"><h2 class="sec">From your automations</h2>
      ${notif.map(n=>`<div class="rowflex" style="padding:7px 0;border-bottom:1px solid var(--hair);font-size:13px"><span class="zap" style="color:var(--cobalt)">${A.ic('zap',13)}</span>${A.h(n.text)}<span class="tiny mute" style="margin-left:auto">${A.ago(n.at)}</span></div>`).join('')}</div>`:''}
  </div>`;
};

/* funnel — pipeline by stage */
A.chFunnel = () => {
  const stages = ['inquiry','brief','concept','estimate','proposal','production','delivery'];
  const val = st => st==='inquiry'
    ? S.db.leads.filter(l=>l.status!=='converted').length * 25000
    : S.db.projects.filter(p=>p.stage===st).reduce((n,p)=>n+p.budget,0);
  const cnt = st => st==='inquiry' ? S.db.leads.filter(l=>l.status!=='converted').length : S.db.projects.filter(p=>p.stage===st).length;
  const max = Math.max(...stages.map(val), 1);
  return `<div>${stages.map((st,i) => { const v = val(st), c = cnt(st);
    const w = Math.max(4, Math.round(v/max*100));
    const op = .25 + .75*(i/(stages.length-1));
    return `<div class="rowflex" style="gap:10px;padding:4px 0;cursor:pointer" onclick="A.go('pipeline')">
      <span class="tiny mute" style="width:74px;flex:0 0 74px;text-align:right">${A.STAGE_LABEL[st]}</span>
      <div style="flex:1;height:20px;display:flex;align-items:center">
        <div style="width:${w}%;height:18px;border-radius:4px;background:var(--cobalt);opacity:${op.toFixed(2)};min-width:5px"></div>
        <span class="tiny" style="margin-left:8px;color:var(--ink2);white-space:nowrap">${c ? A.money(v) : '—'}${c?` · ${c}`:''}</span>
      </div></div>`; }).join('')}</div>`;
};

/* grouped bars — booked vs billed */
A.chBars = () => {
  const months = ['Feb','Mar','Apr','May','Jun','Jul'];
  const booked = [38, 52, 44, 61, 58, 72], billed = [30, 41, 40, 47, 52, 55]; /* $k */
  const max = 80, W = 320, H = 150, bw = 16, gap = W/months.length;
  let bars = '', labels = '';
  months.forEach((m,i) => {
    const x0 = i*gap + gap/2 - bw - 2;
    const h1 = booked[i]/max*(H-26), h2 = billed[i]/max*(H-26);
    bars += `<rect x="${x0}" y="${H-20-h1}" width="${bw}" height="${h1}" rx="3" fill="var(--cobalt)" opacity=".28"/>
             <rect x="${x0+bw+4}" y="${H-20-h2}" width="${bw}" height="${h2}" rx="3" fill="var(--cobalt)"/>`;
    labels += `<text x="${i*gap+gap/2}" y="${H-4}" font-size="10" fill="var(--mute)" text-anchor="middle">${m}</text>`;
  });
  const gl = [0,20,40,60,80].map(v => `<line x1="0" x2="${W}" y1="${H-20-v/max*(H-26)}" y2="${H-20-v/max*(H-26)}" stroke="var(--hair)" stroke-width="1"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:420px">${gl}${bars}${labels}</svg>
    <div class="legend"><span><span class="sw" style="background:var(--cobalt);opacity:.28"></span>Booked</span>
    <span><span class="sw" style="background:var(--cobalt)"></span>Billed</span><span class="mute">$k / month</span></div>`;
};

/* budget burn — progress per active project */
A.chBurn = active => active.length ? active.map(p => {
  const pct = p.budget ? Math.round(p.spent/p.budget*100) : 0;
  const hot = pct > 80;
  return `<div style="padding:7px 0;cursor:pointer" onclick="A.go('p','${p.id}','overview')">
    <div class="spread" style="margin-bottom:4px"><span class="small"><span class="phasedot" style="background:${p.color};margin-right:6px"></span>${A.h(p.name)}</span>
      <span class="tiny ${hot?'':'mute'}" style="${hot?'color:var(--bad);font-weight:600':''}">${A.money(p.spent)} / ${A.money(p.budget)} · ${pct}%</span></div>
    <div class="progress"><i style="width:${A.clamp(pct,2,100)}%;${hot?'background:var(--bad)':''}"></i></div>
  </div>`; }).join('')
  : A.empty('◔','No active projects','Burn appears once projects are in flight.','Open pipeline',"A.go('pipeline')");

/* utilization heat row */
A.chHeat = () => {
  const people = S.db.users.filter(u => u.role !== 'client');
  const data = {u1:[70,85,60,90,75,55], u2:[80,70,95,85,60,75], u3:[95,100,90,105,85,80], u4:[45,60,80,70,90,65]};
  const wkLab = ['-2w','-1w','now','+1w','+2w','+3w'];
  const cell = v => { const a = A.clamp(v/110, .06, 1);
    return v > 95 ? `background:var(--warn-wash);color:var(--warn);box-shadow:inset 0 0 0 1px #e5cf9e` : `background:rgba(33,64,217,${(a*.85).toFixed(2)});color:${a>.5?'#fff':'var(--ink2)'}`; };
  return `<table style="border-collapse:separate;border-spacing:3px;width:100%">
    <tr><td></td>${wkLab.map(w=>`<td class="tiny mute" style="text-align:center">${w}</td>`).join('')}<td class="tiny mute" style="text-align:center">Avg</td></tr>
    ${people.map(u => { const cells = data[u.id]||[50,50,50,50,50,50]; const avg = Math.round(cells.reduce((a,b)=>a+b,0)/cells.length);
      return `<tr>
      <td style="white-space:nowrap;padding-right:6px">${A.avatar(u,'sm')} <span class="small">${u.name.split(' ')[0]}</span></td>
      ${cells.map(v => `<td style="text-align:center;border-radius:5px;font-size:10.5px;padding:6px 0;font-variant-numeric:tabular-nums;${cell(v)}">${v}</td>`).join('')}
      <td style="text-align:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums">${avg}%</td>
    </tr>`; }).join('')}
  </table>
  <div class="tiny mute" style="margin-top:6px">Amber = over 95% — someone needs air.</div>`;
};
</script>
<script>/* == src/11-comments.js == */
/* ============ comments & presence — everywhere ============ */

A.commentBtn = (anchorType, anchorId, projectId, label) => {
  const n = A.commentCount(anchorType, anchorId);
  const hasClient = A.threadsFor(anchorType, anchorId).some(t => !t.resolved && (A.user(t.authorId).role==='client' || t.replies.some(r=>A.user(r.authorId).role==='client')));
  return `<button class="cbtn ${n?'has':''} ${hasClient?'client-flag':''}" title="${n?n+' comment'+(n===1?'':'s'):'Comment'}"
    onclick="event.stopPropagation();A.openThreadComposer('${anchorType}','${anchorId}','${projectId}',${JSON.stringify(label).replace(/"/g,'&quot;')})">
    ${A.ic('chat',11)}${n?` ${n}`:''}${hasClient?' · client':''}</button>`;
};
A.toggleDrawer = () => { S.drawer = !S.drawer; if (!S.drawer) S.drawerFilter = null; A.render(); };
A.openDrawerFor = (anchorType, anchorId) => { S.drawer = true; S.drawerFilter = {anchorType, anchorId}; A.render(); };
A.openThreadComposer = (anchorType, anchorId, projectId, label) => {
  S.drawer = true; S.drawerFilter = {anchorType, anchorId, projectId, label, compose:true};
  A.render();
  setTimeout(()=>$('#cm-new')?.focus(), 50);
};

A.renderDrawer = () => {
  const f = S.drawerFilter;
  let threads, title, scopeNote;
  if (f && f.anchorType) {
    threads = A.threadsFor(f.anchorType, f.anchorId);
    title = 'Thread'; scopeNote = f.label || threads[0]?.label || '';
  } else {
    const pid = S.route.pid || (A.isClient() ? null : null);
    threads = pid ? A.projThreads(pid) : S.db.comments.slice();
    if (A.isClient()) threads = threads.filter(t => A.assertClientAccess(t.projectId) && A.clientCanSeeThread(t));
    title = pid ? 'Comments — ' + (A.proj(pid)?.name||'') : 'All comments'; scopeNote = '';
  }
  const open = threads.filter(t=>!t.resolved), resolved = threads.filter(t=>t.resolved);
  return `<div class="drawer noprint">
    <div class="drawer-h">${A.ic('chat',15)}<b style="font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${A.h(title)}</b>
      ${f?`<button class="btn ghost small" onclick="S.drawerFilter=null;A.render()">All</button>`:''}
      <button class="iconbtn" onclick="A.toggleDrawer()">${A.ic('x',14)}</button></div>
    <div class="drawer-b">
      ${scopeNote?`<div class="anch" style="margin-top:12px">${A.ic('link',10)} ${A.h(scopeNote)}</div>`:''}
      ${f && f.compose ? A.composerHtml(f) : ''}
      ${open.map(t => A.threadHtml(t)).join('')}
      ${!open.length && !(f&&f.compose) ? `<div class="empty" style="padding:30px 8px"><div class="glyph">💬</div><div class="t">No open comments</div><div class="s">Select text in a doc, a board item, an estimate row or a file and start a thread.</div></div>`:''}
      ${resolved.length?`<div class="lab2" style="margin:16px 0 4px">Resolved · ${resolved.length}</div>${resolved.map(t=>A.threadHtml(t)).join('')}`:''}
    </div>
  </div>`;
};
A.clientCanSeeThread = t => {
  /* clients see threads on shared surfaces only */
  if (t.anchorType==='doc' || t.anchorType==='block') {
    const d = S.db.docs.find(d => d.id===t.anchorId || d.blocks.some(b=>b.id===t.anchorId)); return d && d.share==='client';
  }
  if (t.anchorType==='board' || t.anchorType==='boarditem') {
    const b = S.db.boards.find(b => b.id===t.anchorId || b.items.some(i=>i.id===t.anchorId)); return b && b.share==='client';
  }
  if (t.anchorType==='file') { const fl = S.db.files.find(x=>x.id===t.anchorId); return fl && fl.shared; }
  if (t.anchorType==='proposal') return true;
  return false;
};
A.threadHtml = t => {
  const msgs = [{authorId:t.authorId, at:t.at, body:t.body}, ...t.replies];
  return `<div class="thread ${t.resolved?'resolved':''}">
    <div class="spread"><span class="anch">${A.ic('link',10)} ${A.h(t.label||t.anchorType)}</span>
      <button class="cbtn" onclick="A.resolveThread('${t.id}')">${t.resolved?'Reopen':'✓ Resolve'}</button></div>
    ${msgs.map(m => { const u = A.user(m.authorId); return `
      <div class="cmsg">${A.avatar(u,'sm')}
        <div class="bd"><div class="who">${A.h(u.name)} ${u.role==='client'?'<span class="chip client" style="font-size:9.5px;padding:0 7px">Client</span>':''}<span class="when">${A.ago(m.at)}</span></div>
        <div class="txt">${A.mentions(m.body)}</div></div></div>`; }).join('')}
    ${!t.resolved?`<div class="rowflex" style="margin-top:9px">
      <input class="inp" style="flex:1;font-size:12.5px" placeholder="Reply… use @ to mention" onkeydown="if(event.key==='Enter'&&this.value.trim()){A.replyThread('${t.id}',this.value)}">
    </div>`:''}
  </div>`;
};
A.mentions = body => A.h(body).replace(/@([A-Z][a-zA-Z]+(?: [A-Z][a-zA-Z]+)?)/g, '<span class="at">@$1</span>');
A.composerHtml = f => `
  <div class="thread">
    <div class="cmsg">${A.avatar(A.me(),'sm')}
      <div class="bd">
        <textarea class="inp" id="cm-new" placeholder="Start the thread… @mention teammates" style="font-size:12.5px;min-height:56px"></textarea>
        <div class="rowflex" style="margin-top:7px">
          <button class="btn primary small" onclick="A.postThread()">Comment</button>
          <button class="btn ghost small" onclick="S.drawerFilter.compose=false;A.render()">Cancel</button>
          <span class="tiny mute" style="margin-left:auto">@Mara @Jonah @Ines @Theo</span>
        </div></div></div></div>`;
A.postThread = () => {
  const f = S.drawerFilter; const body = $('#cm-new').value.trim();
  if (!body) { A.toast('Write something first'); return; }
  S.db.comments.unshift({id:A.uid('cm'), projectId:f.projectId || S.route.pid || null, anchorType:f.anchorType, anchorId:f.anchorId,
    label:f.label, authorId:S.meId, at:Date.now(), resolved:false, body, replies:[]});
  f.compose = false;
  A.logAct('commented on '+(f.label||f.anchorType), f.projectId || S.route.pid);
  A.render();
};
A.replyThread = (tid, body) => {
  const t = S.db.comments.find(x=>x.id===tid);
  t.replies.push({authorId:S.meId, at:Date.now(), body:body.trim()});
  A.render();
};
A.resolveThread = tid => { const t = S.db.comments.find(x=>x.id===tid); t.resolved = !t.resolved; A.render(); };
</script>
<script>/* == src/12-portal.js == */
/* ============ client portal — guests see only what is shared ============ */

A.renderPortal = () => {
  const me = A.me(); const client = A.client(me.clientId);
  const projects = A.visibleProjects();            /* hard-filtered by clientId */
  const tab = S.route.tab || 'home';
  const proj = projects.find(p => p.id === S.route.id) || projects.find(p=>p.stage!=='report') || projects[0];
  const body = {home:A.portalHome, docs:A.portalDocs, boards:A.portalBoards, proposal:A.portalProposal, files:A.portalFiles, comments:A.portalComments}[tab] || A.portalHome;
  const tabs = [['home','Overview'],['docs','Briefs & docs'],['boards','Boards'],['proposal','Proposal'],['files','Deliverables'],['comments','Comments']];
  return `<div class="portal">
    <div class="portal-top">
      <span class="pw"><b>Atelier</b><span style="width:6px;height:6px;border-radius:50%;background:var(--cobalt);display:inline-block"></span></span>
      <nav class="portal-nav">${tabs.map(([k,l]) => `<button class="${tab===k?'on':''}" onclick="A.go('portal','${k}'${proj?`,'${proj.id}'`:''})">${l}</button>`).join('')}</nav>
      <span style="margin-left:auto" class="rowflex">
        <button class="iconbtn" style="display:none" ></button>
        <button onclick="A.roleMenu(event)" style="display:flex;align-items:center;gap:7px">${A.avatar(me)}<span class="small" style="white-space:nowrap;display:none">${A.h(me.name)}</span></button>
      </span>
    </div>
    <div class="portal-body">${projects.length ? body(client, projects, proj) :
      `<div class="portal-card">${A.empty('◫','Nothing here yet','When the studio shares briefs, boards or files with you, they appear here.')}</div>`}
    </div>
    <div class="tiny mute" style="text-align:center;padding:0 20px 26px">You are signed in as ${A.h(me.name)} · ${A.h(client.name)} — you only ever see your own projects.</div>
  </div>
  ${S.drawer ? A.renderDrawer() : ''}`;
};

/* ---- home: action items ---- */
A.portalHome = (client, projects, proj) => {
  const toSign = S.db.proposals.filter(pr => pr.status==='sent' && projects.some(p=>p.id===pr.projectId));
  const toApprove = S.db.files.filter(f => f.shared && f.approval==='pending' && projects.some(p=>p.id===f.projectId));
  const openThreads = S.db.comments.filter(c => !c.resolved && projects.some(p=>p.id===c.projectId) && A.clientCanSeeThread(c));
  const actions = toSign.length + toApprove.length;
  const lead = projects.find(p=>p.stage!=='report') || projects[0];
  const sharedAll = S.db.files.filter(f => f.shared && projects.some(p=>p.id===f.projectId));
  const apprAll = sharedAll.filter(f=>f.approval==='approved').length;
  return `
    <div style="padding:6px 2px 18px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap">
      <div style="flex:1;min-width:220px">
        <div class="eyebrow">Welcome back, ${A.h(A.me().name.split(' ')[0])}</div>
        <div class="serif" style="font-size:26px">${toSign.length?'The proposal is ready for you.':toApprove.length?'The latest files are ready.':'All quiet, in the best way.'}</div>
        <div class="mute serif" style="margin-top:3px;font-size:13.5px;font-style:italic">${actions ? `${actions} thing${actions===1?'':'s'} need${actions===1?'s':''} your eye today.` : 'Nothing needs your signature or approval right now.'}</div>
      </div>
      ${lead?`<div class="ontrack">${A.ic('check',15)}<span><b>Project on track</b><span class="tiny" style="display:block;opacity:.8">${A.STAGE_LABEL[lead.stage]}${sharedAll.length?` · ${apprAll} of ${sharedAll.length} approved`:''}</span></span></div>`:''}
    </div>
    <div class="portal-card">
      <div class="lab2" style="margin-bottom:4px">Needs you</div>
      ${toSign.map(pr => `<div class="actionitem">
        <span class="ic">${A.ic('sign',16)}</span>
        <div class="bd"><div class="t">Sign the proposal — ${A.h(A.proj(pr.projectId).name)}</div>
        <div class="s">Revision ${pr.rev} · sent ${A.ago(pr.sentAt)} · signing starts production</div></div>
        <button class="btn primary" onclick="A.go('portal','proposal','${pr.projectId}')">Review & sign</button></div>`).join('')}
      ${toApprove.map(f => `<div class="actionitem">
        <span class="ic">${A.ic('eye',16)}</span>
        <div class="bd"><div class="t">Review ${A.h(f.name)}</div><div class="s">v${f.versions.length} · shared for your approval</div></div>
        <button class="btn" onclick="A.go('portal','files','${f.projectId}')">Open</button></div>`).join('')}
      ${!actions ? `<div class="actionitem"><span class="ic">${A.ic('check',16)}</span><div class="bd"><div class="t">All clear</div><div class="s">We’ll nudge you here when something needs a signature or an approval.</div></div></div>`:''}
    </div>
    ${projects.map(p => { const tasks = S.db.tasks.filter(t=>t.projectId===p.id); const done = tasks.filter(t=>t.status==='done').length;
      return `<div class="portal-card">
      <div class="spread"><div><b class="serif" style="font-size:16.5px">${A.h(p.name)}</b>
        <div class="tiny mute" style="margin-top:2px">${A.fmtD(p.start)} → ${A.fmtD(p.due)}</div></div>${A.stageChip(p.stage)}</div>
      <div class="rowflex" style="gap:0;overflow-x:auto;margin-top:14px;padding-bottom:2px">
        ${A.STAGES.map((st,i) => { const idx = A.STAGES.indexOf(p.stage);
          return `<div style="display:flex;align-items:center">
            <div style="width:9px;height:9px;border-radius:50%;${i<idx?'background:var(--cobalt);opacity:.35':i===idx?'background:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-wash)':'border:1.5px solid var(--hair2)'}"></div>
            ${i<7?'<div style="width:22px;height:1px;background:var(--hair2)"></div>':''}</div>`; }).join('')}
      </div>
      <div class="tiny mute" style="margin-top:6px">Now in <b style="color:var(--cobalt)">${A.STAGE_LABEL[p.stage]}</b>${tasks.length?` · ${done}/${tasks.length} tasks done`:''}</div>
    </div>`; }).join('')}
    ${openThreads.length?`<div class="portal-card"><div class="lab2" style="margin-bottom:2px">Recent conversation</div>
      ${openThreads.slice(0,3).map(t=>A.threadHtml(t)).join('')}</div>`:''}`;
};

/* ---- docs (shared only, read-only) ---- */
A.portalDocs = (client, projects, proj) => {
  const docs = S.db.docs.filter(d => d.share==='client' && projects.some(p=>p.id===d.projectId));
  const open = docs.find(d => d.id === S.route.id);
  if (open) return `
    <button class="btn ghost small" onclick="A.go('portal','docs')">← All documents</button>
    <div class="portal-card" style="margin-top:12px">
      <div class="doc" style="padding:6px 0 20px;max-width:none">
        <div class="serif" style="font-size:26px;margin-bottom:4px">${A.h(open.title)}</div>
        <div class="tiny mute" style="padding-bottom:14px;border-bottom:1px solid var(--hair);margin-bottom:16px">${A.h(A.proj(open.projectId).name)} · updated ${A.ago(open.updated)}</div>
        ${open.blocks.map(b => `<div class="blk" style="padding-left:0">
          <span style="float:right">${A.commentBtn('block', b.id, open.projectId, 'Brief · '+(b.text||'block').toString().replace(/<[^>]+>/g,'').slice(0,30))}</span>
          ${A.portalBlock(b)}</div>`).join('')}
      </div></div>`;
  return `${docs.length ? docs.map(d => `
    <div class="portal-card" style="cursor:pointer" onclick="A.go('portal','docs','${d.id}')">
      <div class="spread"><div><b class="serif" style="font-size:16px">${A.h(d.title)}</b>
        <div class="tiny mute" style="margin-top:2px">${A.h(A.proj(d.projectId).name)} · ${A.h(d.kind)} · updated ${A.ago(d.updated)}</div></div>
        <span class="rowflex">${A.commentBtn('doc', d.id, d.projectId, 'Doc · '+d.title)}<span class="mute">${A.ic('chev',14)}</span></span></div>
    </div>`).join('')
  : `<div class="portal-card">${A.empty('¶','No documents shared yet','Your brief and creative direction will appear here once the studio shares them.')}</div>`}`;
};
A.portalBlock = b => {
  switch(b.type){
    case 'h1': return `<div class="blk-h1">${b.text}</div>`;
    case 'h2': return `<div class="blk-h2">${b.text}</div>`;
    case 'li': return `<div class="blk-li"><div>${b.text}</div></div>`;
    case 'callout': return `<div class="blk-callout">${b.text}</div>`;
    case 'quote': return `<div class="blk-quote">${b.text}</div>`;
    case 'img': return `<div class="blk-img"><img src="${b.src}"><div class="cap">${b.cap||''}</div></div>`;
    case 'div': return `<div class="blk-div"></div>`;
    default: return `<div class="blk-p">${b.text}</div>`;
  }
};

/* ---- boards (client-visible, comment-only) ---- */
A.portalBoards = (client, projects) => {
  const boards = S.db.boards.filter(b => b.share==='client' && projects.some(p=>p.id===b.projectId));
  if (!boards.length) return `<div class="portal-card">${A.empty('▦','No boards shared yet','Moodboards and direction boards land here when the studio opens them up.')}</div>`;
  const bd = boards.find(b=>b.id===S.route.id) || boards[0];
  return `
    <div class="rowflex" style="margin-bottom:12px">
      ${boards.length>1?`<select class="inp" style="width:auto" onchange="A.go('portal','boards',this.value)">${boards.map(b=>`<option value="${b.id}" ${b.id===bd.id?'selected':''}>${A.h(b.name)}</option>`).join('')}</select>`:`<b class="serif" style="font-size:17px">${A.h(bd.name)}</b>`}
      <span class="chip client">View & comment — the studio edits</span></div>
    <div class="portal-card" style="padding:0;overflow:hidden;height:56vh;min-height:340px;display:flex">${A.boardCanvas(bd, true)}</div>`;
};

/* ---- proposal ---- */
A.portalProposal = (client, projects, proj) => {
  const prs = S.db.proposals.filter(pr => projects.some(p=>p.id===pr.projectId) && pr.status!=='draft');
  const pr = prs.find(x=>x.projectId===S.route.id) || prs[0];
  if (!pr) return `<div class="portal-card">${A.empty('§','No proposal yet','When a proposal is ready for you, it appears here to review and sign.')}</div>`;
  return `
    <div class="rowflex" style="margin-bottom:12px">
      ${pr.status==='signed' ? `<span class="lockbanner">${A.ic('lock',13)} Signed ${A.ago(pr.signature.signedAt)} — revision ${pr.rev} is locked</span>`
        : `<span class="chip cobalt">Awaiting your signature · revision ${pr.rev}</span>`}
      <span style="margin-left:auto" class="rowflex">${A.commentBtn('proposal', pr.id, pr.projectId, 'Proposal')}
        <button class="btn small" onclick="window.print()">${A.ic('print',13)} PDF</button>
        ${pr.status==='sent'?`<button class="btn primary small" onclick="A.signModal('${pr.id}')">${A.ic('sign',13)} Sign</button>`:''}</span></div>
    <div id="printarea" style="margin:0 -10px">${A.proposalPages(pr, true)}</div>`;
};

/* ---- files: preview + detail ---- */
A.portalFiles = (client, projects) => {
  const files = S.db.files.filter(f => f.shared && projects.some(p=>p.id===f.projectId));
  if (!files.length) return `<div class="portal-card">${A.empty('⇪','No deliverables shared yet','Files the studio shares for your review will collect here, with versions.')}</div>`;
  const sel = files.find(f => f.id === S.pfSel) || files.find(f=>f.approval==='pending') || files[0];
  const v = sel.versions[sel.versions.length-1];
  const threads = A.threadsFor('file', sel.id).filter(t=>!t.resolved);
  return `
    <div class="rowflex" style="margin-bottom:12px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px">
      ${files.map(f => `<button class="btn small ${f.id===sel.id?'primary':''}" style="flex:0 0 auto" onclick="S.pfSel='${f.id}';A.render()">${A.h(f.name.length>26?f.name.slice(0,24)+'…':f.name)}</button>`).join('')}
    </div>
    <div class="pfsplit">
      <div class="pfpreview">
        <div class="ppaper">
          ${sel.kind==='image' ? `<img src="${A.pic(sel,620,820)}">` : `
            <div style="padding:26px 24px;font-family:var(--serif)">
              <div style="font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--cobalt);font-weight:700">${A.h(A.client(A.proj(sel.projectId).clientId).name)}</div>
              <div style="font-size:24px;line-height:1.15;margin:14px 0 18px;text-transform:uppercase">${A.h(sel.name.replace(/\.[^.]+$/,'').replace(/[-_]/g,' '))}</div>
              ${window.PHOTOS?`<img src="${window.PHOTOS.still}" style="width:100%;border-radius:2px">`:''}
              <div style="font-size:9px;letter-spacing:.14em;color:#9b968a;margin-top:16px">VOLUME 01 · ${new Date().getFullYear()}</div>
            </div>`}
        </div>
      </div>
      <div class="pfdetail">
        <span class="chip ${sel.approval==='approved'?'ok':sel.approval==='changes'?'warn':'cobalt'}">${sel.approval==='approved'?'Approved by you':sel.approval==='changes'?'In rework':'Ready for your review'}</span>
        <div class="serif" style="font-size:19px;margin:10px 0 4px">${A.h(sel.name)}</div>
        <div class="rline"><span class="mute">Version</span><strong>v${v.n}${v.n===sel.versions.length?' · current':''}</strong></div>
        <div class="rline"><span class="mute">Uploaded</span><strong>${A.ago(v.at)}</strong></div>
        <div class="rline"><span class="mute">Size</span><strong>${v.size}</strong></div>
        <div class="rowflex" style="margin-top:14px">
          ${sel.approval==='pending' ? `<button class="btn primary" onclick="A.clientApprove('${sel.id}')">✓ Approve</button>
            <button class="btn" onclick="A.clientRequestChanges('${sel.id}')">Needs changes</button>`
          : sel.approval==='approved' ? `<span class="tiny mute">Approved — the studio was notified.</span>`
          : `<span class="tiny mute" style="color:var(--warn)">“${A.h(sel.changeNote||'Changes requested')}” — a new version is on its way.</span>`}
        </div>
        <div class="hr" style="margin:14px 0"></div>
        <div class="lab2" style="margin-bottom:4px">File comments ${A.commentBtn('file', sel.id, sel.projectId, 'Deliverable · '+sel.name)}</div>
        ${threads.length ? threads.slice(0,2).map(t=>A.threadHtml(t)).join('') : `<div class="tiny mute">Your feedback stays with the exact file you’re viewing.</div>`}
        <div class="tiny mute" style="margin-top:12px">“Needs changes” lands on the studio’s production board as a task.</div>
      </div>
    </div>`;
};

/* ---- comments tab ---- */
A.portalComments = (client, projects) => {
  const threads = S.db.comments.filter(c => projects.some(p=>p.id===c.projectId) && A.clientCanSeeThread(c));
  const open = threads.filter(t=>!t.resolved), res = threads.filter(t=>t.resolved);
  return `<div class="portal-card">
    <div class="lab2" style="margin-bottom:2px">Conversation with the studio</div>
    ${open.length ? open.map(t=>A.threadHtml(t)).join('') : A.empty('💬','No open threads','Comment on any brief, board or deliverable — the studio sees it instantly, badged as yours.')}
    ${res.length?`<div class="lab2" style="margin:14px 0 2px">Resolved</div>${res.map(t=>A.threadHtml(t)).join('')}`:''}
  </div>`;
};
</script>
</body></html>
