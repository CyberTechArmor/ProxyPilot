<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caddy Config Script Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2250%22 font-size=%2248%22>🚀</text></svg>" />
  <style>
    :root{ --card-pad:24px; }
    body{ font-family:'Inter',sans-serif; background:#1f2937; color:#f3f4f6; display:flex; flex-direction:column; align-items:center; padding:20px; margin:0; min-height:100vh; }
    .container{ max-width:760px; width:100%; background:#374151; border-radius:10px; padding:var(--card-pad); box-shadow:0 4px 14px rgba(0,0,0,.25); text-align:center; box-sizing:border-box; }
    .rocket{ font-size:4.6rem; margin-bottom:.35em; user-select:none; line-height:1; }
    h1{ margin:0 0 16px; font-size:1.55rem; user-select:none; }

    .input-group{ margin:14px 0; text-align:left; }
    label{ display:block; margin-bottom:6px; font-weight:700; cursor:pointer; }
    input[type=text],input[type=email],input[type=number],textarea{
      width:100%; padding:10px 12px; border:1px solid #4b5563; border-radius:6px;
      background:#1f2937; color:#f3f4f6; outline:none; transition:border-color .2s;
      font-family:inherit; box-sizing:border-box;
    }
    input:focus,textarea:focus{ border-color:#10b981; }

    .btn{ display:inline-block; min-width:180px; padding:11px 14px; text-align:center; border:none; border-radius:6px; background:#10b981; color:#fff; font-weight:700; cursor:pointer; transition:background-color .2s, transform .02s; user-select:none; }
    .btn:hover:not(:disabled){ background:#059669; }
    .btn:active:not(:disabled){ transform:translateY(1px); }
    .btn:disabled{ background:#4b5563; cursor:not-allowed; }
    .recovery-btn{ background:#dc2626; } .recovery-btn:hover:not(:disabled){ background:#b91c1c; }
    .bar{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:6px; }

    .output-container{ display:none; margin-top:18px; background:#1f2937; padding:14px; border-radius:8px; text-align:left; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; font-size:.92em; box-sizing:border-box; width:100%; }
    .output-container textarea{ width:100%; min-height:320px; max-height:60vh; overflow:auto; resize:vertical; background:#111827; color:#d1d5db; white-space:pre; box-sizing:border-box; }
    .copy-row{ display:flex; justify-content:flex-end; margin-top:10px; }
    .copy-btn{ background:#3b82f6; } .copy-btn:hover:not(:disabled){ background:#2563eb; }

    .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0; }
    .feedback{ margin-top:8px; font-size:.95em; text-align:center; color:#10b981; display:none; }
    .feedback.error{ color:#dc2626; }
    .toggle-group,.radio-row{ display:flex; align-items:center; gap:12px; margin:14px 0; user-select:none; flex-wrap:wrap; }
    .toggle-group input[type=checkbox]{ height:0; width:0; visibility:hidden; position:absolute; }
    .toggle-label{ background:#4b5563; border-radius:20px; cursor:pointer; width:50px; height:26px; position:relative; transition:background-color .2s; display:inline-block; vertical-align:middle; }
    .toggle-label::after{ content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; background:#f3f4f6; border-radius:50%; transition:.2s; }
    .toggle-group input[type=checkbox]:checked + .toggle-label{ background:#10b981; }
    .toggle-group input[type=checkbox]:checked + .toggle-label::after{ left:calc(100% - 23px); }
    .toggle-text{ font-weight:700; cursor:pointer; color:#f3f4f6; user-select:none; }
    .note{ font-size:.92em; color:#9ca3af; margin-top:-6px; text-align:left; }
    .hidden{ display:none; }
    .pill{ display:inline-block; padding:5px 11px; border:1px solid #4b5563; border-radius:999px; font-size:.95em; background:#111827; cursor:pointer; }
    .pill input{ margin-right:6px; transform:translateY(1px); }

    .toast{ position:fixed; right:16px; bottom:16px; background:#111827; color:#fef3c7; border:1px solid #78350f; padding:10px 12px; border-radius:6px; font-size:.9em; display:none; max-width:70vw; }
  </style>
</head>
<body>
  <div class="container" role="main">
    <div class="rocket" aria-hidden="true">🚀</div>
    <h1>Caddy Setup Script Generator</h1>

    <div class="input-group">
      <label>Deployment Mode</label>
      <div class="radio-row" role="radiogroup" aria-label="Deployment Mode">
        <label class="pill"><input type="radio" name="mode" id="modeProxy" value="proxy" checked /> Reverse Proxy (address:port)</label>
        <label class="pill"><input type="radio" name="mode" id="modeStatic" value="static" /> Static Site (directory)</label>
      </div>
      <div class="note">Choose “Static Site” to serve files directly from a folder (no upstream app).</div>
    </div>

    <div class="input-group">
      <label for="serverName">Server Name (Domain)</label>
      <input type="text" id="serverName" placeholder="e.g., sub.domain.com" required />
    </div>
    <div class="input-group">
      <label for="email">Your Email (for Caddy automatic TLS)</label>
      <input type="email" id="email" placeholder="you@example.com" required />
    </div>
    <div class="input-group">
      <label for="maxUploadSize">Max Upload Size (optional, default 1G)</label>
      <input type="text" id="maxUploadSize" placeholder="e.g., 50M, 1G" />
    </div>

    <!-- Reverse Proxy -->
    <div id="proxyFields">
      <div class="input-group">
        <label for="backendIP">Backend IP Address, Hostname, or 'localhost'</label>
        <input type="text" id="backendIP" placeholder="127.0.0.1 or backend.internal" />
      </div>
      <div class="input-group">
        <label for="backendPort">Backend Port</label>
        <input type="number" id="backendPort" placeholder="3000" min="1" max="65535" />
      </div>
      <div class="toggle-group">
        <input type="checkbox" id="websocketToggle" checked />
        <label class="toggle-label" for="websocketToggle" tabindex="0"></label>
        <label class="toggle-text" for="websocketToggle">Enable WebSocket Support</label>
      </div>
    </div>

    <!-- Static Site -->
    <div id="staticFields" class="hidden">
      <div class="input-group">
        <label for="rootDir">Root Directory (absolute path) — <strong>Required</strong></label>
        <input type="text" id="rootDir" placeholder="/home/user/websites/mysite" />
      </div>
      <div class="note">
        Provide the absolute path to your site files (e.g., <code>/home/user/websites/mysite</code>).
      </div>
    </div>

    <!-- Force HTTPS applies to BOTH modes (default ON) -->
    <div class="toggle-group">
      <input type="checkbox" id="forceHttpsToggle" checked />
      <label class="toggle-label" for="forceHttpsToggle" tabindex="0"></label>
      <label class="toggle-text" for="forceHttpsToggle">Force HTTPS (redirect http → https)</label>
    </div>

    <div class="bar">
      <button class="btn" id="generateBtn" type="button">Generate Script</button>
      <button class="btn recovery-btn" id="recoveryBtn" type="button">+Recovery (Install Caddy Only)</button>
    </div>

    <div class="output-container" id="outputContainer" aria-live="polite" aria-label="Generated script">
      <label for="output" class="sr-only">Generated Script</label>
      <textarea id="output" readonly spellcheck="false"></textarea>
      <div class="copy-row"><button class="btn copy-btn" id="copyBtn" type="button" disabled>Copy to Clipboard</button></div>
      <div id="copyFeedback" class="feedback" role="alert"></div>
    </div>

    <div id="ariaStatus" class="sr-only" aria-live="polite"></div>
  </div>

  <div id="toast" class="toast" role="alert"></div>

  <script>
  (function(){
    const $ = s => document.querySelector(s);

    const modeProxy = $('#modeProxy'), modeStatic = $('#modeStatic');
    const proxyFields = $('#proxyFields'), staticFields = $('#staticFields');

    const serverNameInput = $('#serverName'), emailInput = $('#email'), maxUploadInput = $('#maxUploadSize');
    const backendIPInput = $('#backendIP'), backendPortInput = $('#backendPort'), websocketToggle = $('#websocketToggle');
    const rootDirInput = $('#rootDir');
    const forceHttpsToggle = $('#forceHttpsToggle');

    const generateBtn = $('#generateBtn'), copyBtn = $('#copyBtn'), recoveryBtn = $('#recoveryBtn');
    const outputContainer = $('#outputContainer'), outputTextarea = $('#output'), ariaStatus = $('#ariaStatus');

    const ipv4 = /^(\d{1,3}\.){3}\d{1,3}$/;
    // IPv6: simplified pattern - allows compressed notation like ::1, fe80::1, etc.
    const ipv6 = /^([0-9a-fA-F]{1,4}:){0,7}[0-9a-fA-F]{0,4}$|^([0-9a-fA-F]{1,4}:){1,7}:$|^::[0-9a-fA-F]{0,4}$|^::([0-9a-fA-F]{1,4}:){0,6}[0-9a-fA-F]{1,4}$/;
    const hostRe = /^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$/;
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    // Shell-safe pattern for paths and domains - no backticks, $, semicolons, etc.
    const shellSafe = /^[a-zA-Z0-9_.:\/-]+$/;

    function setModeUI(){
      const isStatic = modeStatic.checked;
      proxyFields.classList.toggle('hidden', isStatic);
      staticFields.classList.toggle('hidden', !isStatic);
      backendIPInput.required = !isStatic;
      backendPortInput.required = !isStatic;
      rootDirInput.required = isStatic;
    }
    modeProxy.addEventListener('change', setModeUI);
    modeStatic.addEventListener('change', setModeUI);
    setModeUI();

    function validateSize(s){ return !s || /^[1-9][0-9]*[MG]$/i.test(s.trim()); }

    function validate(){
      const name = serverNameInput.value.trim();
      const email = emailInput.value.trim();
      if(!name || !hostRe.test(name)){ alert('Enter a valid Server Name (domain).'); serverNameInput.focus(); return false; }
      if(!email || !emailRe.test(email)){ alert("Enter a valid email for Caddy automatic TLS."); emailInput.focus(); return false; }

      if(modeStatic.checked){
        const rd = (rootDirInput.value||'').trim();
        if(!rd){ alert('Root Directory is required for Static mode.'); rootDirInput.focus(); return false; }
        if(!rd.startsWith('/')){ alert('Root Directory must be an absolute path.'); rootDirInput.focus(); return false; }
        if(!shellSafe.test(rd)){ alert('Root Directory contains invalid characters. Use only letters, numbers, dots, underscores, colons, slashes, and hyphens.'); rootDirInput.focus(); return false; }
      }else{
        const ip = backendIPInput.value.trim(), port = backendPortInput.value.trim();
        if(!ip || !port){ alert('Backend host and port are required.'); return false; }
        if(!(ip.toLowerCase()==='localhost' || ipv4.test(ip) || ipv6.test(ip) || hostRe.test(ip))){ alert('Enter valid IPv4/IPv6/hostname/localhost.'); return false; }
        const p = +port; if(!(p>=1 && p<=65535)){ alert('Port must be 1–65535.'); return false; }
      }

      if(!validateSize(maxUploadInput.value||'')){ alert('Max upload example: 50M or 1G.'); maxUploadInput.focus(); return false; }
      return true;
    }

    // --- Static-site script (Caddy auto-TLS; path REQUIRED) ---
    function genStaticFullScript({serverName, email, rootDir, forceHttps, maxUploadSize}){
      const maxUpload = maxUploadSize || '1G';

      return `#!/bin/bash
# Setup for ${serverName} — static site (Caddy)
set -euo pipefail

pause_if_tty(){ if [ -t 1 ]; then echo; read -rp "Press Enter to close..." _; fi; }
trap 'echo "An error occurred. Check the output above."; pause_if_tty' ERR

DOMAIN="${serverName}"
WEBROOT="${rootDir}"
EMAIL="${email}"
MAX_UPLOAD="${maxUpload}"

echo "[1/5] Ensure webroot + sample index at \${WEBROOT}..."
sudo mkdir -p "\${WEBROOT}"
if [ ! -f "\${WEBROOT}/index.html" ]; then
  sudo tee "\${WEBROOT}/index.html" >/dev/null <<'HTML'
<!doctype html><html><head><meta charset="utf-8"><title>It works</title></head>
<body style="font-family:system-ui;margin:2rem"><h1>It works!</h1></body></html>
HTML
fi

echo "[2/5] Permissions (ensure caddy can traverse to WEBROOT)..."
sudo chown -R caddy:caddy "\${WEBROOT}"
sudo chmod -R 755 "\${WEBROOT}"

# Carefully ensure traverse bits for parents
if [[ "\${WEBROOT}" == /home/* ]]; then
  sudo chmod 755 /home || true
  USERDIR="/home/\$(echo "\${WEBROOT}" | cut -d/ -f3)"
  [ -d "\${USERDIR}" ] && sudo chmod 755 "\${USERDIR}" || true
  LIMIT="/home"
  PATHCUR="\${WEBROOT}"
  declare -a TOFIX=()
  while [ "\${PATHCUR}" != "\${LIMIT}" ] && [ "\${PATHCUR}" != "/" ]; do
    TOFIX=( "\${PATHCUR}" "\${TOFIX[@]}" ); PATHCUR="\$(dirname "\${PATHCUR}")"
  done
  TOFIX=( "\${LIMIT}" "\${TOFIX[@]}" )
  for d in "\${TOFIX[@]}"; do [ -d "\${d}" ] && sudo chmod 755 "\${d}" || true; done
elif [[ "\${WEBROOT}" == /var/www/* ]]; then
  sudo chmod 755 /var || true
  sudo mkdir -p /var/www || true
  sudo chmod 755 /var/www || true
fi

echo "[3/5] Install Caddy if needed..."
sudo apt-get update -y
sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg 2>/dev/null || true
curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
sudo apt-get update -y
sudo apt-get install -y caddy

echo "[4/5] Write Caddy site config..."
sudo mkdir -p /etc/caddy/sites /var/log/caddy
sudo tee /etc/caddy/sites/\${DOMAIN}.caddy >/dev/null <<EOF
\${DOMAIN} {
    tls \${EMAIL}
    root * \${WEBROOT}
    file_server
    try_files {path} {path}/ /index.html
    request_body {
        max_size \${MAX_UPLOAD}
    }
    log {
        output file /var/log/caddy/\${DOMAIN}.log
    }
}
EOF

# Ensure main Caddyfile imports site configs
if ! grep -q 'import /etc/caddy/sites/\\*' /etc/caddy/Caddyfile 2>/dev/null; then
  echo 'import /etc/caddy/sites/*' | sudo tee /etc/caddy/Caddyfile >/dev/null
fi

echo "[5/5] Reload Caddy..."
sudo caddy reload --config /etc/caddy/Caddyfile --force 2>/dev/null || sudo systemctl restart caddy

echo
echo "Done for \${DOMAIN}"
echo "WEBROOT: \${WEBROOT}"
echo "Try:"
echo "  curl -I http://\${DOMAIN}"
echo "  curl -I https://\${DOMAIN}"
pause_if_tty
`;
    }

    // Full reverse-proxy script generator (Caddy auto-TLS, WS-ready)
    function genProxyFullScript({ serverName, email, backendIP, backendPort, websocketEnabled, maxUploadSize, forceHttps }) {
      const maxUpload = maxUploadSize || '1G';

      // Format backend address: wrap IPv6 in brackets
      const ipv6Re = /:/;
      const formattedHost = ipv6Re.test(backendIP) ? `[${backendIP}]` : backendIP;

      return `#!/bin/bash
# Reverse proxy for ${serverName} -> ${backendIP}:${backendPort}
set -euo pipefail

pause_if_tty(){ if [ -t 1 ]; then echo; read -rp "Press Enter to close..." _; fi; }
trap 'echo "An error occurred. Check the output above."; pause_if_tty' ERR

DOMAIN="${serverName}"
EMAIL="${email}"
APP_HOST="${formattedHost}"
APP_PORT="${backendPort}"
MAX_UPLOAD="${maxUpload}"

echo "[1/3] Install Caddy..."
sudo apt-get update -y
sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg 2>/dev/null || true
curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
sudo apt-get update -y
sudo apt-get install -y caddy

echo "[2/3] Write Caddy site config..."
sudo mkdir -p /etc/caddy/sites /var/log/caddy
sudo tee /etc/caddy/sites/\${DOMAIN}.caddy >/dev/null <<EOF
\${DOMAIN} {
    tls \${EMAIL}
    reverse_proxy \${APP_HOST}:\${APP_PORT}
    request_body {
        max_size \${MAX_UPLOAD}
    }
    log {
        output file /var/log/caddy/\${DOMAIN}.log
    }
}
EOF

# Ensure main Caddyfile imports site configs
if ! grep -q 'import /etc/caddy/sites/\\*' /etc/caddy/Caddyfile 2>/dev/null; then
  echo 'import /etc/caddy/sites/*' | sudo tee /etc/caddy/Caddyfile >/dev/null
fi

echo "[3/3] Reload Caddy..."
sudo caddy reload --config /etc/caddy/Caddyfile --force 2>/dev/null || sudo systemctl restart caddy

echo
echo "Done. Proxy https://${serverName} -> ${backendIP}:${backendPort}"
pause_if_tty`;
    }

    function gen(){
      if(!validate()) return;

      const isStatic   = modeStatic.checked;
      const name       = serverNameInput.value.trim();
      const email      = emailInput.value.trim();
      const maxUpload  = (maxUploadInput.value||'').trim() || '1G';
      const backendIP  = (backendIPInput.value||'').trim();
      const backendPort= (backendPortInput.value||'').trim();
      const ws         = !!document.getElementById('websocketToggle').checked;
      const rootDir    = (rootDirInput.value||'').trim();
      const forceHttps = !!document.getElementById('forceHttpsToggle').checked;

      let script = '';
      if(isStatic){
        script = genStaticFullScript({ serverName:name, email, rootDir, forceHttps, maxUploadSize: maxUpload });
      }else{
        script = genProxyFullScript({
          serverName: name,
          email,
          backendIP,
          backendPort,
          websocketEnabled: ws,
          maxUploadSize: maxUpload,
          forceHttps
        });
      }

      outputTextarea.value = script.trim();
      outputContainer.style.display = 'block';
      document.getElementById('copyBtn').disabled = false;
      ariaStatus.textContent = `Caddy config script generated for ${name}`;
      outputContainer.scrollIntoView({behavior:'smooth', block:'start'});
      outputTextarea.focus(); outputTextarea.select();
    }

    // Clipboard fallback for older browsers
    function copyToClipboard(text){
      if(navigator.clipboard && navigator.clipboard.writeText){
        return navigator.clipboard.writeText(text);
      }
      // Fallback for older browsers
      return new Promise((resolve, reject) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
          const success = document.execCommand('copy');
          document.body.removeChild(textarea);
          if(success) resolve();
          else reject(new Error('execCommand copy failed'));
        } catch(e) {
          document.body.removeChild(textarea);
          reject(e);
        }
      });
    }

    function copy(){
      const text = outputTextarea.value || '';
      const copyFeedback = document.getElementById('copyFeedback');
      if(!text){
        copyFeedback.textContent='Nothing to copy!';
        copyFeedback.classList.add('error');
        copyFeedback.style.display='block';
        setTimeout(()=>{copyFeedback.style.display='none'; copyFeedback.classList.remove('error');},2400);
        return;
      }
      copyToClipboard(text).then(()=>{
        copyFeedback.textContent='Script copied to clipboard!';
        copyFeedback.classList.remove('error');
        copyFeedback.style.display='block';
        setTimeout(()=>{copyFeedback.style.display='none';},2200);
      }).catch(e=>{
        copyFeedback.textContent='Failed to copy: '+e;
        copyFeedback.classList.add('error');
        copyFeedback.style.display='block';
        setTimeout(()=>{copyFeedback.style.display='none'; copyFeedback.classList.remove('error');},2400);
      });
    }

    function copyRecovery(){
      const s=`# Recovery: install Caddy
sudo apt-get update -y
sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg 2>/dev/null || true
curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
sudo apt-get update -y
sudo apt-get install -y caddy`;
      copyToClipboard(s).then(()=>alert('Recovery commands copied!')).catch(e=>alert('Failed to copy: '+e));
    }

    document.getElementById('generateBtn').addEventListener('click', gen);
    document.getElementById('copyBtn').addEventListener('click', copy);
    document.getElementById('recoveryBtn').addEventListener('click', copyRecovery);
    [serverNameInput,emailInput,backendIPInput,backendPortInput,rootDirInput,maxUploadInput].forEach(el=>{
      el && el.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='Enter') gen(); });
    });

    // Keyboard accessibility for toggle switches
    document.querySelectorAll('.toggle-label[tabindex="0"]').forEach(label => {
      label.addEventListener('keydown', e => {
        if(e.key === ' ' || e.key === 'Enter'){
          e.preventDefault();
          const checkbox = document.getElementById(label.getAttribute('for'));
          if(checkbox) checkbox.click();
        }
      });
    });
  })();
  </script>
</body>
</html>
