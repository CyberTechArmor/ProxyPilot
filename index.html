<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NGINX Config Script Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2250%22 font-size=%2248%22>🚀</text></svg>" />
  <style>
    body{font-family:'Inter',sans-serif;background:#1f2937;color:#f3f4f6;display:flex;flex-direction:column;align-items:center;padding:20px;margin:0;min-height:100vh}
    .container{max-width:720px;width:100%;background:#374151;border-radius:8px;padding:22px 28px 30px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
    .rocket{font-size:3.5rem;margin:0 0 6px}
    h1{margin:0 0 14px}
    .input-group{margin-bottom:14px}
    label{display:block;margin-bottom:6px;font-weight:600}
    input[type="text"],input[type="email"],input[type="number"],textarea{
      width:100%;padding:10px;border:1px solid #4b5563;border-radius:6px;background:#111827;color:#f3f4f6}
    input:focus,textarea:focus{outline:none;border-color:#10b981}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .radio-row,.toggle-row{display:flex;flex-wrap:wrap;gap:10px}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid #4b5563;border-radius:999px;background:#111827}
    .note{font-size:.9em;color:#9ca3af;margin-top:6px}
    .btn{display:inline-block;padding:11px 14px;border:none;border-radius:6px;background:#10b981;color:#fff;font-weight:700;cursor:pointer}
    .btn:hover{background:#059669}
    .btn.secondary{background:#3b82f6}.btn.secondary:hover{background:#2563eb}
    .btn.danger{background:#dc2626}.btn.danger:hover{background:#b91c1c}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .hidden{display:none}
    .output{margin-top:16px}
    .output textarea{height:280px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .banner{margin-top:10px;padding:8px 10px;border-radius:6px;background:#0b1220;color:#e5e7eb;display:none}
    .error{background:#3b0d0d}
  </style>
</head>
<body>
  <div class="container" role="main">
    <div class="rocket" aria-hidden="true">🚀</div>
    <h1>NGINX Setup Script Generator</h1>

    <!-- Mode -->
    <div class="input-group">
      <label>Deployment Mode</label>
      <div class="radio-row" role="radiogroup" aria-label="Deployment Mode">
        <label class="pill"><input type="radio" name="mode" id="modeProxy" value="proxy" checked> Reverse Proxy (address:port)</label>
        <label class="pill"><input type="radio" name="mode" id="modeStatic" value="static"> Static Site (directory)</label>
      </div>
      <div class="note">Static Site will create the folder + an <code>index.html</code>, fix <code>/home</code> permissions, and allow AppArmor.</div>
    </div>

    <!-- Common -->
    <div class="input-group">
      <label for="serverName">Server Name (domain)</label>
      <input id="serverName" type="text" placeholder="e.g., site.example.com">
    </div>
    <div class="input-group">
      <label for="email">Email for Let's Encrypt</label>
      <input id="email" type="email" placeholder="you@example.com">
    </div>
    <div class="input-group">
      <label for="maxUploadSize">Max Upload Size (optional; default 1G)</label>
      <input id="maxUploadSize" type="text" placeholder="e.g., 50M or 1G">
    </div>

    <!-- Proxy fields -->
    <div id="proxyFields" class="input-group">
      <div class="row">
        <div>
          <label for="backendIP">Backend IP/Host</label>
          <input id="backendIP" type="text" placeholder="127.0.0.1 / localhost / internal host">
        </div>
        <div>
          <label for="backendPort">Backend Port</label>
          <input id="backendPort" type="number" min="1" max="65535" placeholder="3000">
        </div>
      </div>
      <div class="toggle-row" style="margin-top:8px">
        <label class="pill"><input type="checkbox" id="websocketToggle" checked> Enable WebSocket headers</label>
      </div>
    </div>

    <!-- Static fields -->
    <div id="staticFields" class="input-group hidden">
      <label for="rootDir">Root Directory (absolute path)</label>
      <input id="rootDir" type="text" placeholder="/home/thomas/websites/mysite">
      <div class="row" style="margin-top:8px">
        <label class="pill"><input type="checkbox" id="spaToggle"> SPA fallback to <code>index.html</code></label>
        <label class="pill"><input type="checkbox" id="gzipToggle"> Enable gzip</label>
      </div>
    </div>

    <div class="toggle-row input-group">
      <label class="pill"><input type="checkbox" id="forceHttpsToggle"> Force HTTPS (Certbot adds redirect)</label>
    </div>

    <div class="toolbar">
      <button id="generateBtn" class="btn">Generate Script</button>
      <button id="copyBtn" class="btn secondary" disabled>Copy Script</button>
      <button id="recoveryBtn" class="btn danger">+Recovery (NGINX & Certbot only)</button>
    </div>

    <div id="banner" class="banner" role="alert"></div>

    <div class="output hidden" id="outputWrap">
      <label for="output">Generated Script</label>
      <textarea id="output" readonly spellcheck="false"></textarea>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // --- Elements
      const modeProxy = document.getElementById('modeProxy');
      const modeStatic = document.getElementById('modeStatic');
      const proxyFields = document.getElementById('proxyFields');
      const staticFields = document.getElementById('staticFields');

      const serverNameInput = document.getElementById('serverName');
      const emailInput = document.getElementById('email');
      const maxUploadInput = document.getElementById('maxUploadSize');

      const backendIPInput = document.getElementById('backendIP');
      const backendPortInput = document.getElementById('backendPort');
      const websocketToggle = document.getElementById('websocketToggle');

      const rootDirInput = document.getElementById('rootDir');
      const spaToggle = document.getElementById('spaToggle');
      const gzipToggle = document.getElementById('gzipToggle');

      const forceHttpsToggle = document.getElementById('forceHttpsToggle');

      const generateBtn = document.getElementById('generateBtn');
      const copyBtn = document.getElementById('copyBtn');
      const recoveryBtn = document.getElementById('recoveryBtn');

      const outputWrap = document.getElementById('outputWrap');
      const outputArea = document.getElementById('output');
      const banner = document.getElementById('banner');

      // --- Helpers
      function showBanner(msg, isError=false) {
        banner.textContent = msg;
        banner.classList.toggle('error', !!isError);
        banner.style.display = 'block';
        setTimeout(() => { banner.style.display = 'none'; }, 3500);
      }

      window.addEventListener('error', (e) => {
        console.error(e.error || e.message);
        showBanner('JS error: ' + (e.message || 'unknown'), true);
      });

      function setModeUI() {
        const isStatic = modeStatic.checked;
        proxyFields.classList.toggle('hidden', isStatic);
        staticFields.classList.toggle('hidden', !isStatic);
      }
      modeProxy.addEventListener('change', setModeUI);
      modeStatic.addEventListener('change', setModeUI);
      setModeUI();

      function validEmail(x){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x); }
      function validHost(x){ return /^[a-zA-Z0-9.-]+$/.test(x); }
      function validIPv4(x){ return /^(\d{1,3}\.){3}\d{1,3}$/.test(x) && x.split('.').every(o=>+o>=0&&+o<=255); }

      function validate() {
        const domain = serverNameInput.value.trim();
        const email = emailInput.value.trim();
        if (!domain || !validHost(domain)) return 'Enter a valid Server Name (domain).';
        if (!email || !validEmail(email)) return 'Enter a valid email for Let\'s Encrypt.';

        if (modeStatic.checked) {
          if (!rootDirInput.value.trim()) return 'Root Directory is required for Static Site mode.';
        } else {
          const host = backendIPInput.value.trim();
          const port = backendPortInput.value.trim();
          if (!host || !port) return 'Backend host and port are required.';
          if (!(host.toLowerCase()==='localhost' || validHost(host) || validIPv4(host))) return 'Enter a valid backend host/IP.';
          const p = Number(port);
          if (!Number.isInteger(p) || p<1 || p>65535) return 'Enter a valid backend port (1–65535).';
        }
        const mus = maxUploadInput.value.trim();
        if (mus && !/^[1-9][0-9]*[MG]$/i.test(mus)) return 'Max Upload Size must look like 50M or 1G.';
        return '';
      }

      // --- Blocks
      function buildProxyBlock({serverName, backendIP, backendPort, websocketEnabled, maxUpload}) {
        const ws = websocketEnabled
          ? '        proxy_set_header Upgrade \\$http_upgrade;\\n        proxy_set_header Connection "upgrade";'
          : '';
        return [
`server {`,
`    listen 80;`,
`    listen [::]:80;`,
`    server_name ${serverName};`,
`    client_max_body_size ${maxUpload};`,
`    # ACME to nginx directly`,
`    location ^~ /.well-known/acme-challenge/ {`,
`        root /var/www/letsencrypt;`,
`        default_type "text/plain";`,
`    }`,
`    location / {`,
`        proxy_http_version 1.1;`,
ws,
`        proxy_set_header Host \\$host;`,
`        proxy_set_header X-Real-IP \\$remote_addr;`,
`        proxy_set_header X-Forwarded-For \\$proxy_add_x_forwarded_for;`,
`        proxy_set_header X-Forwarded-Proto \\$scheme;`,
`        proxy_read_timeout 300;`,
`        proxy_connect_timeout 60;`,
`        proxy_send_timeout 300;`,
`        proxy_buffering off;`,
`        proxy_pass http://${backendIP}:${backendPort};`,
`    }`,
`}`
        ].filter(Boolean).join('\n');
      }

      function buildStaticBlock({serverName, spa, gzip, maxUpload}) {
        const tryLine = spa ? 'try_files \\$uri \\$uri/ /index.html;' : 'try_files \\$uri \\$uri/ =404;';
        const gzipBlock = gzip ? `
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;` : '';
        return [
`server {`,
`    listen 80;`,
`    listen [::]:80;`,
`    server_name ${serverName};`,
`    client_max_body_size ${maxUpload};`,
`    root __ROOT__;`,
`    index index.html;${gzipBlock}`,
`    location ^~ /.well-known/acme-challenge/ {`,
`        root __ROOT__;`,
`        default_type "text/plain";`,
`    }`,
`    location / {`,
`        ${tryLine}`,
`    }`,
`}`
        ].join('\n');
      }

      function generateScript() {
        try {
          const err = validate();
          if (err) { showBanner(err, true); return; }

          const isStatic = modeStatic.checked;
          const serverName = serverNameInput.value.trim();
          const email = emailInput.value.trim();
          const maxUpload = (maxUploadInput.value.trim() || '1G');
          const forceHttps = !!forceHttpsToggle.checked;

          const backendIP = (backendIPInput.value || '').trim();
          const backendPort = (backendPortInput.value || '').trim();
          const websocketEnabled = !!websocketToggle.checked;

          const rootDirRaw = (rootDirInput.value || '').trim();
          const spa = !!spaToggle?.checked;
          const gzip = !!gzipToggle?.checked;

          const certbotCmd = `sudo certbot --nginx --non-interactive --agree-tos --email ${email} -d ${serverName} ${forceHttps ? '--redirect' : ''}`.trim();

          let preface = '';
          let mainBlock = '';
          let afterWrite = '';

          if (isStatic) {
            mainBlock = buildStaticBlock({serverName, spa, gzip, maxUpload});
            preface = `# --- Normalize and create webroot ---
set -euo pipefail
umask 022

ROOT_DIR_RAW="${rootDirRaw}"
case "$ROOT_DIR_RAW" in
  "~/"*) ROOT_DIR="\${HOME}\${ROOT_DIR_RAW#\\~}";;
  "~")   ROOT_DIR="\${HOME}";;
  *)     ROOT_DIR="$ROOT_DIR_RAW";;
esac
if [ "$ROOT_DIR" != "/" ]; then ROOT_DIR="\${ROOT_DIR%/}"; fi

if [ -z "$ROOT_DIR" ]; then echo "ERROR: Root directory not provided."; exit 1; fi
case "$ROOT_DIR" in
  /*) ;;  # absolute OK
  *) echo "ERROR: Root directory must be absolute (got: $ROOT_DIR_RAW -> $ROOT_DIR)"; exit 1;;
esac

echo "[create] ROOT_DIR resolved to: $ROOT_DIR"
sudo install -d -m 755 "$ROOT_DIR"

# Starter index if missing
if [ ! -e "$ROOT_DIR/index.html" ]; then
  sudo tee "$ROOT_DIR/index.html" >/dev/null <<'HTML'
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>${serverName}</title></head><body style="font-family:system-ui;margin:2rem"><h1>It works! ✨</h1><p>Serving static files for ${serverName}</p></body></html>
HTML
fi

sudo chown -R www-data:www-data "$ROOT_DIR" || true
sudo find "$ROOT_DIR" -type d -exec chmod 755 {} \\;
sudo find "$ROOT_DIR" -type f -exec chmod 644 {} \\;

# If serving from /home/..., fix parent execute bits & AppArmor
if [[ "$ROOT_DIR" == /home/*/* ]]; then
  sudo chmod 755 /home "/home/$(echo "$ROOT_DIR" | cut -d/ -f3)" "/home/$(echo "$ROOT_DIR" | cut -d/ -f3)/$(echo "$ROOT_DIR" | cut -d/ -f4)" || true
  if [ -f /etc/apparmor.d/usr.sbin.nginx ]; then
    sudo mkdir -p /etc/apparmor.d/local
    LINE="$ROOT_DIR/** r,"; LINE2="$ROOT_DIR/** rix,"
    sudo bash -c 'grep -qxF '"'"'$LINE'"'"' /etc/apparmor.d/local/usr.sbin.nginx || echo '"'"'$LINE'"'"' >> /etc/apparmor.d/local/usr.sbin.nginx'
    sudo bash -c 'grep -qxF '"'"'$LINE2'"'"' /etc/apparmor.d/local/usr.sbin.nginx || echo '"'"'$LINE2'"'"' >> /etc/apparmor.d/local/usr.sbin.nginx'
    sudo apparmor_parser -r /etc/apparmor.d/usr.sbin.nginx 2>/dev/null || true
    sudo systemctl reload apparmor || true
  fi
fi
`;

            // Replace __ROOT__ with the resolved path (escape \ / & | to be safe for sed)
            afterWrite = `ESCAPED_ROOT="$(printf '%s' "$ROOT_DIR" | sed -e 's/[\\\\/&|]/\\\\&/g')"
sudo sed -i "s|__ROOT__|${ESCAPED_ROOT}|g" /etc/nginx/sites-available/${serverName}
`;
          } else {
            mainBlock = buildProxyBlock({serverName, backendIP, backendPort, websocketEnabled, maxUpload});
            preface = `sudo mkdir -p /var/www/letsencrypt
sudo chown -R www-data:www-data /var/www/letsencrypt || true
`;
          }

          // Final script
          const script = [
`#!/bin/bash`,
`# Generated by NGINX Setup Script Generator`,
`set -euo pipefail`,
``,
`pause_if_tty(){ if [ -t 1 ]; then echo; read -rp "Press Enter to close..." _; fi; }`,
`trap 'echo "An error occurred. Check the output above."; pause_if_tty' ERR`,
``,
`echo "[install] Installing NGINX & Certbot (if needed)..."`,
`sudo apt update`,
`sudo apt install -y nginx certbot python3-certbot-nginx`,
``,
`# Remove default to avoid conflicts`,
`sudo rm -f /etc/nginx/sites-enabled/default || true`,
``,
preface.trim(),
``,
`echo "[nginx] Writing initial HTTP server (no redirect) so Certbot can validate..."`,
`cat <<'EOL' | sudo tee /etc/nginx/sites-available/${serverName}`,
mainBlock,
`EOL`,
``,
afterWrite.trim(),
`sudo ln -sf /etc/nginx/sites-available/${serverName} /etc/nginx/sites-enabled/${serverName}`,
`sudo nginx -t`,
`sudo systemctl reload nginx`,
``,
`echo "[certbot] Requesting/Installing certificate..."`,
certbotCmd,
``,
`echo "[renew] Testing auto-renewal (dry run)..."`,
`sudo certbot renew --dry-run || true`,
`sudo systemctl enable certbot.timer || true`,
``,
`echo "✅ All done for ${serverName}."`,
`pause_if_tty`
          ].join('\n').trim();

          outputArea.value = script;
          outputWrap.classList.remove('hidden');
          copyBtn.disabled = false;
          showBanner('Script generated. Review and copy when ready.');
        } catch (e) {
          console.error(e);
          showBanner('Could not generate script: ' + e.message, true);
        }
      }

      function copyScript() {
        const text = outputArea.value || '';
        if (!text) return;
        // try modern clipboard API, fall back to execCommand
        navigator.clipboard?.writeText(text)
          .then(()=>showBanner('Script copied to clipboard.'))
          .catch(()=>{
            outputArea.select();
            document.execCommand('copy');
            showBanner('Script copied.');
          });
      }

      function copyRecovery() {
        const recovery = [
          '# Recovery: install NGINX & Certbot',
          'sudo apt update',
          'sudo apt install -y nginx certbot python3-certbot-nginx'
        ].join('\n');
        navigator.clipboard?.writeText(recovery).then(()=>showBanner('Recovery commands copied.'));
      }

      // Bind buttons
      generateBtn.addEventListener('click', generateScript);
      copyBtn.addEventListener('click', copyScript);
      recoveryBtn.addEventListener('click', copyRecovery);

      // Keyboard shortcut: Ctrl/Cmd+Enter to generate
      [serverNameInput, emailInput, backendIPInput, backendPortInput, rootDirInput].forEach(el=>{
        el?.addEventListener('keydown', e=>{
          if ((e.ctrlKey||e.metaKey) && e.key==='Enter') generateScript();
        });
      });
    })();
  </script>
</body>
</html>
