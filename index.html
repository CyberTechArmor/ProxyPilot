<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NGINX Config Script Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2250%22 font-size=%2248%22>🚀</text></svg>" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1f2937;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            height: 100vh;
            margin: 0;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background-color: #374151;
            border-radius: 8px;
            padding: 20px 30px 30px 30px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            text-align: center;
        }
        .rocket {
            font-size: 5rem;
            margin-bottom: 0.25em;
            user-select: none;
            line-height: 1;
        }
        h1 {
            margin-bottom: 20px;
            user-select: none;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        textarea {
            width: calc(100% - 20px);
            padding: 10px;
            border: 1px solid #4b5563;
            border-radius: 4px;
            background-color: #1f2937;
            color: #f3f4f6;
            outline: none;
            transition: border-color 0.3s;
            margin: 0 auto;
            display: block;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            border-color: #10b981;
        }
        textarea {
            height: 200px;
            resize: none;
            font-family: monospace, monospace;
            font-size: 0.9em;
            color: #d1d5db;
            background-color: #111827;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            border: none;
            border-radius: 4px;
            background-color: #10b981;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
            font-family: inherit;
            user-select: none;
        }
        .btn:hover:not(:disabled) {
            background-color: #059669;
        }
        .btn:disabled {
            background-color: #4b5563;
            cursor: not-allowed;
        }
        .recovery-btn {
            background-color: #dc2626;
        }
        .recovery-btn:hover:not(:disabled) {
            background-color: #b91c1c;
        }
        .output-container {
            display: none;
            margin-top: 20px;
            background-color: #1f2937;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            font-family: monospace, monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
        }
        .copy-btn {
            margin-top: 10px;
            background-color: #3b82f6;
        }
        .copy-btn:hover:not(:disabled) {
            background-color: #2563eb;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            border: 0;
        }
        .feedback {
            margin-top: 6px;
            font-size: 0.9em;
            text-align: center;
            color: #10b981;
            display: none;
        }
        .feedback.error {
            color: #dc2626;
        }
        /* Toggle Switch Style */
        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            user-select: none;
        }
        .toggle-group input[type="checkbox"] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }
        .toggle-label {
            background: #4b5563;
            border-radius: 20px;
            cursor: pointer;
            width: 50px;
            height: 26px;
            position: relative;
            transition: background-color 0.3s;
            display: inline-block;
            vertical-align: middle;
        }
        .toggle-label::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: #f3f4f6;
            border-radius: 50%;
            transition: 0.3s;
        }
        .toggle-group input[type="checkbox"]:checked + .toggle-label {
            background: #10b981;
        }
        .toggle-group input[type="checkbox"]:checked + .toggle-label::after {
            left: calc(100% - 23px);
        }
        .toggle-text {
            font-weight: bold;
            cursor: pointer;
            color: #f3f4f6;
            user-select: none;
        }
        .note {
            font-size: 0.9em;
            color: #9ca3af;
            margin-top: -10px;
            margin-bottom: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container" role="main">
        <div class="rocket" aria-hidden="true">🚀</div>
        <h1>NGINX Setup Script Generator</h1>

        <div class="input-group">
            <label for="serverName">Server Name (Domain)</label>
            <input type="text" id="serverName" placeholder="e.g., sub.domain.com" required aria-describedby="serverName-desc" />
        </div>

        <div class="input-group">
            <label for="backendIP">Backend IP Address, Hostname, or 'localhost'</label>
            <input type="text" id="backendIP" placeholder="e.g., 127.0.0.1 or localhost or backend.internal" required />
        </div>

        <div class="input-group">
            <label for="backendPort">Backend Port</label>
            <input type="number" id="backendPort" placeholder="e.g., 3000" min="1" max="65535" required />
        </div>

        <div class="input-group">
            <label for="email">Your Email (for Let's Encrypt SSL)</label>
            <input type="email" id="email" placeholder="you@example.com" required />
        </div>

        <div class="input-group">
            <label for="maxUploadSize">Max Upload Size (optional, default 1G)</label>
            <input type="text" id="maxUploadSize" placeholder="e.g., 50M, 1G" aria-describedby="maxUploadDesc" />
            <div id="maxUploadDesc" class="note sr-only">May include M for megabytes, G for gigabytes.</div>
        </div>

        <div class="toggle-group">
            <input type="checkbox" id="websocketToggle" checked aria-describedby="websocketLabel" />
            <label class="toggle-label" for="websocketToggle" tabindex="0"></label>
            <label class="toggle-text" id="websocketLabel" for="websocketToggle">Enable WebSocket Support</label>
        </div>

        <div class="toggle-group">
            <input type="checkbox" id="forceHttpsToggle" aria-describedby="forceHttpsLabel" />
            <label class="toggle-label" for="forceHttpsToggle" tabindex="0"></label>
            <label class="toggle-text" id="forceHttpsLabel" for="forceHttpsToggle">Force HTTPS</label>
        </div>

        <button class="btn" id="generateBtn" type="button">Generate Script</button>
        <button class="btn recovery-btn" id="recoveryBtn" type="button">+Recovery (Install NGINX Only)</button>

        <div role="region" aria-live="polite" class="sr-only" id="ariaStatus"></div>

        <div class="output-container" id="outputContainer" aria-live="polite" aria-label="Generated script container">
            <label for="output">Generated Script</label>
            <textarea id="output" readonly rows="18" spellcheck="false" aria-describedby="output-desc"></textarea>
            <div id="output-desc" class="note sr-only">Copy and paste this script to configure your NGINX server.</div>
            <button class="btn copy-btn" id="copyBtn" type="button">Copy to Clipboard</button>
            <div id="copyFeedback" class="feedback" role="alert"></div>
        </div>
    </div>

    <script>
        (function() {
            const serverNameInput = document.getElementById('serverName');
            const backendIPInput = document.getElementById('backendIP');
            const backendPortInput = document.getElementById('backendPort');
            const emailInput = document.getElementById('email');
            const maxUploadInput = document.getElementById('maxUploadSize');
            const websocketToggle = document.getElementById('websocketToggle');
            const forceHttpsToggle = document.getElementById('forceHttpsToggle');
            const generateBtn = document.getElementById('generateBtn');
            const recoveryBtn = document.getElementById('recoveryBtn');
            const outputContainer = document.getElementById('outputContainer');
            const outputTextarea = document.getElementById('output');
            const copyBtn = document.getElementById('copyBtn');
            const copyFeedback = document.getElementById('copyFeedback');
            const ariaStatus = document.getElementById('ariaStatus');

            const ipv4Regex = /^(\d{1,3}\.){3}\d{1,3}$/;
            const ipv6Regex = /^[0-9a-fA-F:]+$/;
            const hostnameRegex = /^[a-zA-Z0-9.-]+$/;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            function validateInputs() {
                const serverName = serverNameInput.value.trim();
                const backendIP = backendIPInput.value.trim();
                const backendPort = backendPortInput.value.trim();
                const email = emailInput.value.trim();
                if (!serverName) {
                    alert('Server Name (Domain) is required.');
                    serverNameInput.focus();
                    return false;
                }
                if (!backendIP) {
                    alert('Backend IP Address or Host is required.');
                    backendIPInput.focus();
                    return false;
                }
                if (!backendPort) {
                    alert('Backend Port is required.');
                    backendPortInput.focus();
                    return false;
                }
                if (!email) {
                    alert("Email is required for Let's Encrypt SSL.");
                    emailInput.focus();
                    return false;
                }
                if (!hostnameRegex.test(serverName)) {
                    alert('Please enter a valid server name (domain).');
                    serverNameInput.focus();
                    return false;
                }
                const backendLower = backendIP.toLowerCase();
                const isLocalhost = backendLower === 'localhost';
                if (!isLocalhost &&
                    !ipv4Regex.test(backendIP) &&
                    !ipv6Regex.test(backendIP) &&
                    !hostnameRegex.test(backendIP)) {
                    alert('Please enter a valid Backend IP (IPv4, IPv6), hostname, or "localhost".');
                    backendIPInput.focus();
                    return false;
                }
                if (ipv4Regex.test(backendIP)) {
                    const octets = backendIP.split(".");
                    for (const octet of octets) {
                        const val = Number(octet);
                        if (val < 0 || val > 255) {
                            alert('Please enter a valid IPv4 address for Backend IP.');
                            backendIPInput.focus();
                            return false;
                        }
                    }
                }
                const portNum = Number(backendPort);
                if (isNaN(portNum) || portNum < 1 || portNum > 65535) {
                    alert("Please enter a valid port number (1-65535).");
                    backendPortInput.focus();
                    return false;
                }
                if (!emailRegex.test(email)) {
                    alert('Please enter a valid email address.');
                    emailInput.focus();
                    return false;
                }
                return true;
            }

            function validateMaxUploadSize(size) {
                if (!size) return true; // optional, defaults to 1G
                return /^[1-9][0-9]*[MG]$/i.test(size.trim());
            }

            function generateScript() {
                if (!validateInputs()) return;

                const maxUploadRaw = maxUploadInput.value.trim();
                if (!validateMaxUploadSize(maxUploadRaw)) {
                    alert('Please enter a valid Max Upload Size like 50M or 1G.');
                    maxUploadInput.focus();
                    return;
                }
                const maxUploadSize = maxUploadRaw || '1G';
                const serverName = serverNameInput.value.trim();
                const backendIP = backendIPInput.value.trim();
                const backendPort = backendPortInput.value.trim();
                const email = emailInput.value.trim();
                const websocketEnabled = websocketToggle.checked;
                const forceHttps = forceHttpsToggle.checked;

                const wsHeaders = websocketEnabled ? `        proxy_http_version 1.1;
        proxy_set_header Upgrade \\$http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host \\$host;
        proxy_set_header X-Real-IP \\$remote_addr;
        proxy_set_header X-Forwarded-For \\$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \\$scheme;
        proxy_cache_bypass \\$http_upgrade;

        # Additional WebSocket handshake headers
        proxy_set_header Origin "";
        proxy_set_header Sec-WebSocket-Version \\$http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Key \\$http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Protocol \\$http_sec_websocket_protocol;

        # Disable request buffering (helps with streaming uploads)
        proxy_request_buffering off;
` : `        proxy_set_header Host \\$host;
        proxy_set_header X-Real-IP \\$remote_addr;
        proxy_set_header X-Forwarded-For \\$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \\$scheme;
`;

                const httpsRedirect = forceHttps ? `server {
    listen 80;
    server_name ${serverName};
    return 301 https://\\$host\\$request_uri;
}

` : '';

                const certbotCmd = `sudo certbot --nginx --non-interactive --agree-tos --email ${email} -d ${serverName}`;

                const script = `#!/bin/bash

# Step 1: Create the NGINX Redirect Configuration (if HTTPS enforced)
${forceHttps ? '# Redirect HTTP to HTTPS' : '# No HTTP to HTTPS redirect'}
${httpsRedirect}# Step 2: Create the NGINX Configuration File
echo "Creating NGINX configuration for ${serverName}..."
cat <<EOL | sudo tee /etc/nginx/sites-available/${serverName}
server {
    listen 80;
    server_name ${serverName};

    client_max_body_size ${maxUploadSize};

    location / {
${wsHeaders}        proxy_pass http://${backendIP}:${backendPort};  # Backend server
    }
}
EOL

# Step 3: Enable the Site and Test the Configuration
echo "Enabling site and testing NGINX configuration..."
sudo ln -sf /etc/nginx/sites-available/${serverName} /etc/nginx/sites-enabled/
sudo nginx -t
if [ $? -ne 0 ]; then
    echo "NGINX configuration test failed. Please check your configuration."
    exit 1
fi
sudo systemctl restart nginx

# Step 4: Install Certbot and Obtain SSL Certificate
echo "Installing Certbot and obtaining SSL certificate..."
sudo apt update
sudo apt install certbot python3-certbot-nginx -y

# Step 5: Obtain SSL Certificate using Certbot
echo "Running Certbot to obtain SSL certificate..."
${certbotCmd}

# Step 6: Setup automatic renewal
echo "Setting up automatic certificate renewal..."
sudo systemctl enable certbot.timer

echo "Setup completed successfully for ${serverName}. Your site is now configured with SSL."
`;

                outputTextarea.value = script.trim();
                outputContainer.style.display = "block";
                outputTextarea.focus();
                outputTextarea.select();
                ariaStatus.textContent = `NGINX config script generated for ${serverName}`;
            }

            function copyToClipboard() {
                const text = outputTextarea.value;
                if (!text) {
                    displayCopyFeedback('Nothing to copy!', true);
                    return;
                }
                navigator.clipboard.writeText(text)
                    .then(() => {
                        displayCopyFeedback('Script copied to clipboard!');
                    })
                    .catch(err => {
                        displayCopyFeedback('Failed to copy text: ' + err, true);
                    });
            }
            function copyRecovery() {
                const recoveryCmds = `# Recovery: install Nginx & Certbot
sudo apt update
sudo apt install nginx certbot python3-certbot-nginx -y`;
                navigator.clipboard.writeText(recoveryCmds)
                    .then(() => {
                        alert('Recovery commands copied to clipboard!');
                    })
                    .catch(err => {
                        alert('Failed to copy recovery commands: ' + err);
                    });
            }
            function displayCopyFeedback(message, isError = false) {
                copyFeedback.textContent = message;
                copyFeedback.classList.toggle('error', isError);
                copyFeedback.style.display = 'block';
                setTimeout(() => {
                    copyFeedback.style.display = 'none';
                    copyFeedback.textContent = '';
                    copyFeedback.classList.remove('error');
                }, 3000);
            }
            generateBtn.addEventListener('click', generateScript);
            copyBtn.addEventListener('click', copyToClipboard);
            recoveryBtn.addEventListener('click', copyRecovery);
            [serverNameInput, backendIPInput, backendPortInput, emailInput].forEach(el => {
                el.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                        generateScript();
                    }
                });
            });
        })();
    </script>
</body>
</html>
