<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NGINX Config Script Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2250%22 font-size=%2248%22>🚀</text></svg>" />
  <style>
    :root{
      --card-pad:24px;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #1f2937;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 760px;
      width: 100%;
      background-color: #374151;
      border-radius: 10px;
      padding: var(--card-pad);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      text-align: center;
      box-sizing: border-box;
    }
    .rocket { font-size: 4.6rem; margin-bottom: .35em; user-select: none; line-height: 1; }
    h1 { margin: 0 0 16px; font-size: 1.55rem; user-select: none; }

    /* Inputs: equal spacing left/right and full width */
    .input-group { margin: 14px 0; text-align: left; }
    label { display: block; margin-bottom: 6px; font-weight: 700; cursor: pointer; }
    input[type="text"], input[type="email"], input[type="number"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #4b5563;
      border-radius: 6px;
      background-color: #1f2937;
      color: #f3f4f6;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
      box-sizing: border-box; /* <-- ensure equal padding */
    }
    input:focus, textarea:focus { border-color: #10b981; }

    /* Buttons */
    .btn {
      display: inline-block;
      min-width: 180px;
      padding: 11px 14px;
      text-align: center;
      border: none;
      border-radius: 6px;
      background-color: #10b981;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background-color .2s, transform .02s;
      user-select: none;
    }
    .btn:hover:not(:disabled) { background-color: #059669; }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { background-color: #4b5563; cursor: not-allowed; }
    .recovery-btn { background-color: #dc2626; }
    .recovery-btn:hover:not(:disabled) { background-color: #b91c1c; }

    .bar { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top: 6px; }

    /* Output box fits and scrolls nicely */
    .output-container {
      display: none;
      margin-top: 18px;
      background-color: #1f2937;
      padding: 14px;
      border-radius: 8px;
      text-align: left;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: .92em;
      box-sizing: border-box;
      width: 100%;
    }
    .output-container textarea {
      width: 100%;
      min-height: 320px;
      max-height: 60vh;
      overflow: auto;
      resize: vertical;
      background: #111827;
      color: #d1d5db;
      white-space: pre;
      box-sizing: border-box;
    }
    .copy-row {
      display:flex;
      justify-content:flex-end;
      margin-top:10px;
    }
    .copy-btn { background-color: #3b82f6; }
    .copy-btn:hover:not(:disabled) { background-color: #2563eb; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
    .feedback { margin-top: 8px; font-size: .95em; text-align: center; color: #10b981; display: none; }
    .feedback.error { color: #dc2626; }
    .toggle-group, .radio-row {
      display: flex; align-items: center; gap: 12px; margin: 14px 0; user-select: none; flex-wrap: wrap;
    }
    .toggle-group input[type="checkbox"] { height: 0; width: 0; visibility: hidden; position: absolute; }
    .toggle-label {
      background: #4b5563; border-radius: 20px; cursor: pointer; width: 50px; height: 26px;
      position: relative; transition: background-color .2s; display: inline-block; vertical-align: middle;
    }
    .toggle-label::after {
      content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
      background: #f3f4f6; border-radius: 50%; transition: .2s;
    }
    .toggle-group input[type="checkbox"]:checked + .toggle-label { background: #10b981; }
    .toggle-group input[type="checkbox"]:checked + .toggle-label::after { left: calc(100% - 23px); }
    .toggle-text { font-weight: 700; cursor: pointer; color: #f3f4f6; user-select: none; }
    .note { font-size: .92em; color: #9ca3af; margin-top: -6px; text-align: left; }
    .hidden { display: none; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pill {
      display:inline-block; padding:5px 11px; border:1px solid #4b5563; border-radius:999px; font-size:.95em;
      background:#111827; cursor:pointer;
    }
    .pill input { margin-right:6px; transform: translateY(1px); }

    /* tiny toast for JS errors */
    .toast{ position:fixed; right:16px; bottom:16px; background:#111827; color:#fef3c7; border:1px solid #78350f; padding:10px 12px; border-radius:6px; font-size:.9em; display:none; max-width:70vw; }
  </style>
</head>
<body>
  <div class="container" role="main">
    <div class="rocket" aria-hidden="true">🚀</div>
    <h1>NGINX Setup Script Generator</h1>

    <!-- Deployment Mode -->
    <div class="input-group">
      <label>Deployment Mode</label>
      <div class="radio-row" role="radiogroup" aria-label="Deployment Mode">
        <label class="pill"><input type="radio" name="mode" id="modeProxy" value="proxy" checked /> Reverse Proxy (address:port)</label>
        <label class="pill"><input type="radio" name="mode" id="modeStatic" value="static" /> Static Site (directory)</label>
      </div>
      <div class="note">Choose “Static Site” to serve files directly from a folder (no upstream app).</div>
    </div>

    <!-- Common -->
    <div class="input-group">
      <label for="serverName">Server Name (Domain)</label>
      <input type="text" id="serverName" placeholder="e.g., sub.domain.com" required />
    </div>
    <div class="input-group">
      <label for="email">Your Email (for Let's Encrypt SSL)</label>
      <input type="email" id="email" placeholder="you@example.com" required />
    </div>
    <div class="input-group">
      <label for="maxUploadSize">Max Upload Size (optional, default 1G)</label>
      <input type="text" id="maxUploadSize" placeholder="e.g., 50M, 1G" />
    </div>

    <!-- Reverse Proxy fields -->
    <div id="proxyFields">
      <div class="input-group">
        <label for="backendIP">Backend IP Address, Hostname, or 'localhost'</label>
        <input type="text" id="backendIP" placeholder="127.0.0.1 or backend.internal" />
      </div>
      <div class="input-group">
        <label for="backendPort">Backend Port</label>
        <input type="number" id="backendPort" placeholder="3000" min="1" max="65535" />
      </div>
      <div class="toggle-group">
        <input type="checkbox" id="websocketToggle" checked />
        <label class="toggle-label" for="websocketToggle" tabindex="0"></label>
        <label class="toggle-text" for="websocketToggle">Enable WebSocket Support</label>
      </div>
    </div>

    <!-- Static Site fields -->
    <div id="staticFields" class="hidden">
      <div class="input-group">
        <label for="rootDir">Root Directory (absolute path)</label>
        <input type="text" id="rootDir" placeholder="/home/thomas/websites/mysite" />
      </div>
      <div class="row">
        <div class="toggle-group">
          <input type="checkbox" id="spaToggle" />
          <label class="toggle-label" for="spaToggle" tabindex="0"></label>
          <label class="toggle-text" for="spaToggle">SPA Fallback (route everything to index.html)</label>
        </div>
        <div class="toggle-group">
          <input type="checkbox" id="gzipToggle" />
          <label class="toggle-label" for="gzipToggle" tabindex="0"></label>
          <label class="toggle-text" for="gzipToggle">Enable gzip</label>
        </div>
      </div>
      <div class="note">We’ll create the folder if missing and place a basic <code>index.html</code>. We’ll also fix parent-dir execute bits under <code>/home</code>.</div>
    </div>

    <!-- Force HTTPS applies to BOTH modes now -->
    <div class="toggle-group">
      <input type="checkbox" id="forceHttpsToggle" />
      <label class="toggle-label" for="forceHttpsToggle" tabindex="0"></label>
      <label class="toggle-text" for="forceHttpsToggle">Force HTTPS (redirect http → https)</label>
    </div>

    <div class="bar">
      <button class="btn" id="generateBtn" type="button">Generate Script</button>
      <button class="btn recovery-btn" id="recoveryBtn" type="button">+Recovery (Install NGINX Only)</button>
    </div>

    <!-- Output -->
    <div class="output-container" id="outputContainer" aria-live="polite" aria-label="Generated script">
      <label for="output" class="sr-only">Generated Script</label>
      <textarea id="output" readonly spellcheck="false"></textarea>
      <div class="copy-row">
        <button class="btn copy-btn" id="copyBtn" type="button" disabled>Copy to Clipboard</button>
      </div>
      <div id="copyFeedback" class="feedback" role="alert"></div>
    </div>

    <div id="ariaStatus" class="sr-only" aria-live="polite"></div>
  </div>

  <div id="toast" class="toast" role="alert"></div>

  <script>
  (function () {
    // utilities
    const $ = (sel) => document.querySelector(sel);
    const show = (el) => el && (el.style.display = 'block');
    const toast = $('#toast');
    function notify(msg, isError = true) {
      if (!toast) return;
      toast.textContent = msg;
      toast.style.display = 'block';
      toast.style.borderColor = isError ? '#78350f' : '#14532d';
      setTimeout(() => { toast.style.display = 'none'; toast.textContent=''; }, 3500);
    }
    window.addEventListener('error', e => notify(`JS error: ${e.message}`));

    // elements
    const modeProxy = $('#modeProxy');
    const modeStatic = $('#modeStatic');
    const proxyFields = $('#proxyFields');
    const staticFields = $('#staticFields');

    const serverNameInput = $('#serverName');
    const emailInput = $('#email');
    const maxUploadInput = $('#maxUploadSize');

    const backendIPInput = $('#backendIP');
    const backendPortInput = $('#backendPort');
    const websocketToggle = $('#websocketToggle');

    const rootDirInput = $('#rootDir');

    const forceHttpsToggle = $('#forceHttpsToggle');

    const generateBtn = $('#generateBtn');
    const copyBtn = $('#copyBtn');
    const recoveryBtn = $('#recoveryBtn');
    const outputContainer = $('#outputContainer');
    const outputTextarea = $('#output');
    const copyFeedback = $('#copyFeedback');
    const ariaStatus = $('#ariaStatus');

    // validators
    const ipv4Regex = /^(\d{1,3}\.){3}\d{1,3}$/;
    const ipv6Regex = /^[0-9a-fA-F:]+$/;
    const hostnameRegex = /^[a-zA-Z0-9.-]+$/;
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function setModeUI() {
      const isStatic = modeStatic.checked;
      proxyFields.classList.toggle('hidden', isStatic);
      staticFields.classList.toggle('hidden', !isStatic);
      backendIPInput.required = !isStatic;
      backendPortInput.required = !isStatic;
      rootDirInput.required = isStatic;
      // Force HTTPS is allowed for both modes now
    }
    modeProxy.addEventListener('change', setModeUI);
    modeStatic.addEventListener('change', setModeUI);
    setModeUI();

    function validateMaxUploadSize(size) {
      if (!size) return true;
      return /^[1-9][0-9]*[MG]$/i.test(size.trim());
    }

    function validateInputs() {
      const serverName = (serverNameInput.value || '').trim();
      const email = (emailInput.value || '').trim();
      const isStatic = modeStatic.checked;

      if (!serverName) { alert('Server Name (Domain) is required.'); serverNameInput.focus(); return false; }
      if (!hostnameRegex.test(serverName)) { alert('Please enter a valid server name (domain).'); serverNameInput.focus(); return false; }
      if (!email) { alert("Email is required for Let's Encrypt SSL."); emailInput.focus(); return false; }
      if (!emailRegex.test(email)) { alert('Please enter a valid email address.'); emailInput.focus(); return false; }

      if (isStatic) {
        const rootDir = (rootDirInput.value || '').trim();
        if (!rootDir) { alert('Root Directory is required in Static Site mode.'); rootDirInput.focus(); return false; }
        if (!rootDir.startsWith('/')) { alert('Root Directory must be an absolute path (e.g., /home/thomas/websites/site).'); rootDirInput.focus(); return false; }
      } else {
        const backendIP = (backendIPInput.value || '').trim();
        const backendPort = (backendPortInput.value || '').trim();
        if (!backendIP) { alert('Backend IP/Host is required in Reverse Proxy mode.'); backendIPInput.focus(); return false; }
        if (!backendPort) { alert('Backend Port is required in Reverse Proxy mode.'); backendPortInput.focus(); return false; }

        const isLocalhost = backendIP.toLowerCase() === 'localhost';
        if (!isLocalhost && !ipv4Regex.test(backendIP) && !ipv6Regex.test(backendIP) && !hostnameRegex.test(backendIP)) {
          alert('Enter a valid Backend IP (IPv4, IPv6), hostname, or "localhost".'); backendIPInput.focus(); return false;
        }
        if (ipv4Regex.test(backendIP)) {
          const octets = backendIP.split("."); for (const oct of octets) {
            const v = +oct; if (v < 0 || v > 255) { alert('Invalid IPv4 address.'); backendIPInput.focus(); return false; }
          }
        }
        const portNum = +backendPort;
        if (!(portNum >= 1 && portNum <= 65535)) { alert('Enter a valid port number (1-65535).'); backendPortInput.focus(); return false; }
      }

      const maxUploadRaw = (maxUploadInput.value || '').trim();
      if (!validateMaxUploadSize(maxUploadRaw)) { alert('Enter a valid Max Upload Size like 50M or 1G.'); maxUploadInput.focus(); return false; }
      return true;
    }

    // Reverse Proxy server block (unchanged)
    function genProxyServerBlock(opts) {
      const { serverName, backendIP, backendPort, websocketEnabled, maxUploadSize } = opts;
      const wsHeaders = websocketEnabled ? `        proxy_http_version 1.1;
        proxy_set_header Upgrade \\$http_upgrade;
        proxy_set_header Connection "upgrade";` : `        proxy_http_version 1.1;`;

      return `server {
    listen 80;
    listen [::]:80;
    server_name ${serverName};

    client_max_body_size ${maxUploadSize};

    # Let ACME hit nginx directly (don’t proxy to the app)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
${wsHeaders}
        proxy_set_header Host \\$host;
        proxy_set_header X-Real-IP \\$remote_addr;
        proxy_set_header X-Forwarded-For \\$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \\$scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
        proxy_buffering off;

        proxy_pass http://${backendIP}:${backendPort};
    }
}`;
    }

    // Build the HTTP block for static site depending on Force HTTPS
    function httpBlockForStatic(forceHttps) {
      if (forceHttps) {
        return `server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root __WEBROOT__;
    index index.html;

    # ACME must be reachable on :80
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        allow all;
    }

    # Redirect everything else
    location / {
        return 301 https://$host$request_uri;
    }
}
`;
      } else {
        return `server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root __WEBROOT__;
    index index.html;

    # ACME challenge (Let’s Encrypt)
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        allow all;
    }

    # Serve directly (no redirect)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
`;
      }
    }

    // Static-site generator (UNIFIED; optional redirect on :80)
    function genStaticFullScript({ serverName, email, rootDir, forceHttps }) {
      const HTTP_BLOCK = httpBlockForStatic(forceHttps);
      return `#!/bin/bash
# Setup for ${serverName} — static site on ${rootDir}
set -euo pipefail

DOMAIN="${serverName}"
WEBROOT="${rootDir}"
EMAIL="${email}"

echo "[1/6] Ensure webroot + sample index..."
sudo mkdir -p "$WEBROOT"
if [ ! -f "$WEBROOT/index.html" ]; then
  sudo tee "$WEBROOT/index.html" >/dev/null <<'HTML'
<!doctype html><html><head><meta charset="utf-8"><title>It works</title></head>
<body style="font-family:system-ui;margin:2rem"><h1>✅ It works!</h1></body></html>
HTML
fi

echo "[2/6] Permissions (nginx must traverse /home/*)..."
sudo chown -R www-data:www-data "$WEBROOT"
sudo chmod 755 /home || true
sudo chmod 755 /home/thomas || true
sudo chmod 755 /home/thomas/websites || true
sudo chmod -R 755 "$WEBROOT"

echo "[3/6] Install nginx/certbot if needed..."
sudo apt-get update -y
sudo apt-get install -y nginx certbot python3-certbot-nginx
sudo rm -f /etc/nginx/sites-enabled/default || true

CERT_DIR="/etc/letsencrypt/live/\${DOMAIN}"
if [ ! -f "\${CERT_DIR}/fullchain.pem" ] || [ ! -f "\${CERT_DIR}/privkey.pem" ]; then
  echo "[3b/6] Obtaining certificate..."
  sudo certbot --nginx --non-interactive --agree-tos --email "\${EMAIL}" -d "\${DOMAIN}" || true
fi

FULLCHAIN="\${CERT_DIR}/fullchain.pem"
PRIVKEY="\${CERT_DIR}/privkey.pem"
CHAIN="\${CERT_DIR}/chain.pem"

echo "[4/6] Remove duplicate/old site configs for this domain..."
sudo find /etc/nginx/sites-available -maxdepth 1 -type f -name "\${DOMAIN}-*" -delete || true
sudo find /etc/nginx/sites-enabled   -maxdepth 1 -type l -name "\${DOMAIN}-*" -delete || true
sudo rm -f "/etc/nginx/sites-available/\${DOMAIN}" || true
sudo rm -f "/etc/nginx/sites-enabled/\${DOMAIN}" || true

echo "[5/6] Write a SINGLE canonical config..."
TMP="/tmp/\${DOMAIN}.nginx.tmp"
sudo tee "$TMP" >/dev/null <<'NGINX'
# =========================
# __DOMAIN__
# Unified config (http block varies by Force HTTPS)
# =========================

__HTTP_BLOCK__

# HTTPS: serve the site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;
    root __WEBROOT__;
    index index.html;

    ssl_certificate           __FULLCHAIN__;
    ssl_certificate_key       __PRIVKEY__;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_trusted_certificate   __CHAIN__;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
NGINX

# Inject the chosen HTTP block and paths
sudo sed -i \
  -e "s|__HTTP_BLOCK__|$(printf '%s' "${HTTP_BLOCK//|/\\|}")|" \
  -e "s|__DOMAIN__|${serverName}|g" \
  -e "s|__WEBROOT__|${rootDir}|g" \
  -e "s|__FULLCHAIN__|\${FULLCHAIN}|g" \
  -e "s|__PRIVKEY__|\${PRIVKEY}|g" \
  -e "s|__CHAIN__|\${CHAIN}|g" \
  "$TMP"

sudo mv "$TMP" "/etc/nginx/sites-available/\${DOMAIN}"
sudo ln -sf "/etc/nginx/sites-available/\${DOMAIN}" "/etc/nginx/sites-enabled/\${DOMAIN}"

echo "[6/6] Test & reload..."
sudo nginx -t
sudo systemctl reload nginx

echo
echo "✅ Done. HTTP ${forceHttps ? 'redirects to HTTPS' : 'serves directly'}; HTTPS serves content."
echo "Quick checks:"
echo "  curl -I http://\${DOMAIN}"
echo "  curl -I https://\${DOMAIN}"
`;
    }

    function generateScript() {
      if (!validateInputs()) return;

      const isStatic = modeStatic.checked;
      const serverName = (serverNameInput.value || '').trim();
      const email = (emailInput.value || '').trim();
      const maxUploadSize = (maxUploadInput.value || '').trim() || '1G';
      const backendIP = (backendIPInput.value || '').trim();
      const backendPort = (backendPortInput.value || '').trim();
      const websocketEnabled = !!document.getElementById('websocketToggle').checked;
      const rootDir = (rootDirInput.value || '').trim();
      const forceHttps = !!forceHttpsToggle.checked;

      let script = '';

      if (isStatic) {
        script = genStaticFullScript({ serverName, email, rootDir, forceHttps });
      } else {
        const mainServerBlock = genProxyServerBlock({
          serverName, backendIP, backendPort, websocketEnabled, maxUploadSize
        });

        const certbotCmd = `sudo certbot --nginx --non-interactive --agree-tos --email ${email} -d ${serverName} ${forceHttps ? '--redirect' : ''}`.trim();

        const preface = `sudo mkdir -p /var/www/letsencrypt
sudo chown -R www-data:www-data /var/www/letsencrypt || true
`;

        script = `#!/bin/bash
# Generated by NGINX Setup Script Generator
set -uo pipefail

pause_if_tty() {
  if [ -t 1 ]; then
    echo
    read -rp "Press Enter to close..." _
  fi
}
trap 'echo "An error occurred. Check the output above."; pause_if_tty' ERR

echo "Installing NGINX & Certbot (if needed)..."
sudo apt update
sudo apt install -y nginx certbot python3-certbot-nginx

# Remove default to avoid conflicts
sudo rm -f /etc/nginx/sites-enabled/default || true

${preface}echo "Writing initial HTTP server (no redirect) so Certbot can validate..."
cat <<'EOL' | sudo tee /etc/nginx/sites-available/${serverName}
${mainServerBlock}
EOL

sudo ln -sf /etc/nginx/sites-available/${serverName} /etc/nginx/sites-enabled/${serverName}
sudo nginx -t
sudo systemctl reload nginx

echo "Running Certbot..."
${certbotCmd}

echo "Testing auto-renewal (dry run)..."
sudo certbot renew --dry-run || true

sudo systemctl enable certbot.timer || true

echo "All done for ${serverName}."
pause_if_tty
`;
      }

      outputTextarea.value = script.trim();
      outputContainer.style.display = "block";
      copyBtn.disabled = false;
      ariaStatus.textContent = `NGINX config script generated for ${serverName}`;
      outputContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
      outputTextarea.focus(); outputTextarea.select();
    }

    function showCopyFeedback(message, isError = false) {
      copyFeedback.textContent = message;
      copyFeedback.classList.toggle('error', !!isError);
      copyFeedback.style.display = 'block';
      setTimeout(() => { copyFeedback.style.display = 'none'; copyFeedback.textContent=''; copyFeedback.classList.remove('error'); }, 2600);
    }

    function copyToClipboard() {
      const text = outputTextarea.value || '';
      if (!text) { showCopyFeedback('Nothing to copy!', true); return; }
      navigator.clipboard.writeText(text)
        .then(() => showCopyFeedback('Script copied to clipboard!'))
        .catch(err => showCopyFeedback('Failed to copy: ' + err, true));
    }

    function copyRecovery() {
      const recoveryCmds = `# Recovery: install NGINX & Certbot
sudo apt update
sudo apt install -y nginx certbot python3-certbot-nginx`;
      navigator.clipboard.writeText(recoveryCmds)
        .then(() => alert('Recovery commands copied to clipboard!'))
        .catch(err => alert('Failed to copy recovery commands: ' + err));
    }

    // wire up
    document.getElementById('generateBtn').addEventListener('click', generateScript);
    document.getElementById('copyBtn').addEventListener('click', copyToClipboard);
    document.getElementById('recoveryBtn').addEventListener('click', copyRecovery);

    // Ctrl/Cmd + Enter generates
    [serverNameInput, emailInput, backendIPInput, backendPortInput, rootDirInput, maxUploadInput].forEach(el => {
      el && el.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generateScript(); });
    });
  })();
  </script>
</body>
